<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cálculo de Dilatación Térmica en Tuberías</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;             /* ⬅️ antes 24 16 60 */
    color: #222;
  }
  .container {
    max-width: 373px;                   /* ⬅️ antes 560 (≈ 2/3) */
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;                 /* ⬅️ antes 10 */
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;            /* ⬅️ antes 24 28 32 */
  }
  h1 {
    text-align: center;
    font-size: 13px;                    /* ⬅️ antes 20 */
    background: #111;
    color: #fff;
    padding: 8px 11px;                  /* ⬅️ antes 12 16 */
    border-radius: 4px;                 /* ⬅️ antes 6 */
    margin: 0 0 15px;                   /* ⬅️ antes 22 */
  }
  .field { margin-bottom: 11px; }       /* ⬅️ antes 16 */
  .field label {
    display: block;
    font-size: 9px;                     /* ⬅️ antes 13 */
    font-weight: 600;
    color: #444;
    margin-bottom: 3px;                 /* ⬅️ antes 5 */
  }
  select, input[type="number"] {
    width: 100%;
    padding: 6px 7px;                   /* ⬅️ antes 9 10 */
    font-size: 10px;                    /* ⬅️ antes 15 */
    border: 1px solid #c7ccd1;
    border-radius: 4px;                 /* ⬅️ antes 6 */
    background: #fff;
  }
  select:focus, input[type="number"]:focus { outline: none; border-color: #4a90d9; }
  #resultBox {
    margin-top: 16px;                   /* ⬅️ antes 24 */
    padding: 12px;                      /* ⬅️ antes 18 */
    border-radius: 5px;                 /* ⬅️ antes 8 */
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    text-align: center;
    display: none;
  }
  #resultBox.show { display: block; }
  .result-item {
    margin-bottom: 9px;                 /* ⬅️ antes 14 */
  }
  .result-item:last-child {
    margin-bottom: 0;
  }
  .result-item .label {
    font-size: 8px;                     /* ⬅️ antes 12 */
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;                 /* ⬅️ antes 4 */
  }
  .result-item .value {
    font-size: 16px;                    /* ⬅️ antes 24 */
    font-weight: 700;
    color: #111;
  }
  .result-item .sub-value {
    font-size: 9px;                     /* ⬅️ antes 14 */
    color: #555;
    margin-top: 1px;                    /* ⬅️ antes 2 */
  }
  #resultBox.warning .value {
    font-size: 11px;                    /* ⬅️ antes 16 */
    color: #b04a3f;
    font-weight: 600;
  }
  .btn-copy {
    margin-top: 12px;                   /* ⬅️ antes 18 */
    padding: 5px 11px;                  /* ⬅️ antes 8 16 */
    font-size: 9px;                     /* ⬅️ antes 13 */
    font-weight: 600;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 4px;                 /* ⬅️ antes 6 */
    cursor: pointer;
  }
  .btn-copy:hover {
    background: #333;
  }
  /* ============ BOTÓN CÁLCULOS AVANZADOS ============ */
.btn-avanzado {
  display: block;
  width: 100%;
  text-align: center;
  text-decoration: none;
  background: #1e5fa8;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 9px 12px;
  border-radius: 5px;
  margin: 0 0 14px;
  box-shadow: 0 2px 6px rgba(30, 95, 168, 0.35);
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  cursor: pointer;
}
.btn-avanzado:hover {
  background: #174a85;
  transform: translateY(-1px);
  box-shadow: 0 4px 10px rgba(30, 95, 168, 0.45);
}
.btn-avanzado:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px rgba(30, 95, 168, 0.35);
}
</style>
</head>
<body>

<div class="container">
  <h1>Dilatación Térmica en Tuberías</h1>
  <!-- Botón a cálculos avanzados -->
<a href="dilatacion_avanzada.html" class="btn-avanzado">🔧 Cálculos avanzados (lazo, fuerza, tensión)</a>

  <div class="field">
    <label for="materialSelect">Material de Tubería</label>
    <select id="materialSelect">
      <option value="">-</option>
      <option value="carbono">Acero al Carbono (ASME/ASTM)</option>
      <option value="inox">Acero Inoxidable (ASME/ASTM)</option>
    </select>
  </div>

  <div class="field">
    <label for="tempMinInput">Temperatura MÍNIMA de operación (°C)</label>
    <input type="number" id="tempMinInput" placeholder="Ej: 20" step="any" value="20">
  </div>

  <div class="field">
    <label for="tempMaxInput">Temperatura MÁXIMA de operación (°C)</label>
    <input type="number" id="tempMaxInput" placeholder="Ej: 150" step="any" value="150">
  </div>

  <div class="field">
    <label for="longitudInput">Longitud de la Tubería (mm)</label>
    <input type="number" id="longitudInput" placeholder="Ej: 6000" step="any" min="0" value="6000">
  </div>

  <div id="resultBox">
    <div class="result-item">
      <div class="label">Dilatación Total Inherente</div>
      <div class="value" id="dilatacionValue">-</div>
    </div>
    <div class="result-item">
      <div class="label">Variación de Temperatura (ΔT)</div>
      <div class="sub-value" id="deltaTempValue">-</div>
    </div>
    <div class="result-item">
      <div class="label">Coeficiente Alfa (α)</div>
      <div class="sub-value" id="alfaValue">-</div>
    </div>
    <button class="btn-copy" id="copyBtn">Copiar Resultados</button>
  </div>
</div>

<script>
const ALFA_MAP = {
  carbono: { nombre: "Acero al Carbono", alfa: 0.0000115 },
  inox: { nombre: "Acero Inoxidable", alfa: 0.0000165 }
};

const materialSelect = document.getElementById('materialSelect');
const tempMinInput = document.getElementById('tempMinInput');
const tempMaxInput = document.getElementById('tempMaxInput');
const longitudInput = document.getElementById('longitudInput');
const resultBox = document.getElementById('resultBox');

const dilatacionValue = document.getElementById('dilatacionValue');
const deltaTempValue = document.getElementById('deltaTempValue');
const alfaValue = document.getElementById('alfaValue');
const copyBtn = document.getElementById('copyBtn');

function calcular() {
  const matKey = materialSelect.value;
  const tempMin = parseFloat(tempMinInput.value);
  const tempMax = parseFloat(tempMaxInput.value);
  const longitud = parseFloat(longitudInput.value);

  if (!matKey || isNaN(tempMin) || isNaN(tempMax) || isNaN(longitud) || longitud <= 0) {
    resultBox.classList.remove('show', 'warning');
    return;
  }

  const matData = ALFA_MAP[matKey];
  const alfa = matData.alfa;

  const deltaTemp = tempMax - tempMin;
  const dilatacionTotal = alfa * longitud * deltaTemp;

  dilatacionValue.textContent = dilatacionTotal.toFixed(0) + ' mm';
  deltaTempValue.textContent = deltaTemp.toFixed(0) + ' °C';
  alfaValue.textContent = alfa.toExponential(2) + ' 1/°C';

  resultBox.classList.remove('warning');
  resultBox.classList.add('show');
}

copyBtn.addEventListener('click', () => {
  const matKey = materialSelect.value;
  const tempMin = parseFloat(tempMinInput.value);
  const tempMax = parseFloat(tempMaxInput.value);
  const longitud = parseFloat(longitudInput.value);

  if (!matKey) return;

  const matData = ALFA_MAP[matKey];
  const deltaTemp = tempMax - tempMin;
  const dilatacionTotal = matData.alfa * longitud * deltaTemp;

  const resumen = 
`--- RESULTADOS DEL CÁLCULO ---

Material: ${matData.nombre}
Coeficiente alfa: ${matData.alfa.toExponential(6)} 1/°C
Longitud Inicial: ${longitud.toFixed(2)} mm
Rango de Temperatura: ${tempMin}°C a ${tempMax}°C (ΔT = ${deltaTemp}°C)

DILATACIÓN TOTAL INHERENTE: ${dilatacionTotal.toFixed(3)} mm`;

  navigator.clipboard.writeText(resumen).then(() => {
    const originalText = copyBtn.textContent;
    copyBtn.textContent = '¡Copiado!';
    setTimeout(() => {
      copyBtn.textContent = originalText;
    }, 1500);
  });
});

[materialSelect, tempMinInput, tempMaxInput, longitudInput].forEach(elem => {
  elem.addEventListener('input', calcular);
  elem.addEventListener('change', calcular);
});
</script>
<link rel="stylesheet" href="men-header.css">
<script src="men-header.js" data-autor="Creado por: J.N.G"></script>

</body>
</html>
