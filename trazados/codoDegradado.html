<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Degradado de Codo</title>
<style>
  :root{
    --azul:#1e5fa8; --azul-claro:#e8f0fa; --gris:#f4f5f7;
    --borde:#e0e3e6; --texto:#1f2937; --ok:#137a3f; --error:#b42318;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;
    color: #222;
    display: block !important;
  }

  .container {
    max-width: 733px;
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;
  }

  h1 {
    text-align: center;
    font-size: 13px;
    background: #111;
    color: #fff;
    padding: 8px 11px;
    border-radius: 4px;
    margin: 0 0 5px;
  }

  .subtitulo {
    text-align: center;
    font-size: 9px;
    color: #666;
    margin: 0 0 15px;
  }

  .layout {
    display: grid;
    grid-template-columns: 253px 1fr;
    gap: 13px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: #f4f6f8;
    border: 1px solid var(--borde);
    border-radius: 5px;
    padding: 11px;
  }
  .panel h2 {
    font-size: 9px;
    margin: 0 0 8px;
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .esquema {
    margin-bottom: 9px;
    background: #e8f0fa;
    border-radius: 4px;
    padding: 7px;
    min-height: 27px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .esquema svg,
  .esquema img {
    display: block;
    margin: 0 auto;
    max-width: 60%;
    height: auto;
  }
  .esquema img {
    cursor: zoom-in;
    transition: transform 0.15s ease;
  }
  .esquema img:hover {
    transform: scale(1.04);
  }

  label {
    display: block;
    font-size: 9px;
    margin: 7px 0 3px;
    font-weight: 600;
    color: #444;
  }

  input, select {
    width: 100%;
    padding: 6px 7px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    font-size: 10px;
    background: #fff;
    color: #222;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #4a90d9;
  }

  .fila {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  button {
    width: 100%;
    padding: 7px;
    margin-top: 9px;
    border: none;
    border-radius: 4px;
    background: #111;
    color: #fff;
    font-size: 9px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #333; }

  button.sec {
    background: #fff;
    color: #111;
    border: 1px solid #c7ccd1;
  }
  button.sec:hover { background: #f4f6f8; }

  .aviso {
    margin-top: 7px;
    padding: 5px 7px;
    border-radius: 4px;
    font-size: 9px;
    display: none;
  }
  .aviso.error {
    background: #fdecea;
    color: var(--error);
    display: block;
  }
  .aviso.ok {
    background: #e7f5ec;
    color: var(--ok);
    display: block;
  }

  .resultado {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 5px;
    padding: 11px;
    min-height: 133px;
  }
  .resultado h2 {
    font-size: 9px;
    margin: 0 0 8px;
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .resumen {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 8px 0 5px;
    font-size: 10px;
    font-weight: 600;
  }
  .resumen .dato {
    background: #f4f6f8;
    border: 1px solid var(--borde);
    padding: 8px 11px;
    border-radius: 4px;
    color: #111;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .resumen .dato .letra {
    display: inline-block;
    width: 19px;
    height: 19px;
    line-height: 19px;
    text-align: center;
    background: #111;
    color: #fff;
    border-radius: 50%;
    font-weight: 700;
    margin-right: 7px;
  }
  .resumen .dato .valor {
    font-size: 11px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 10px;
  }
  th, td {
    border: 1px solid var(--borde);
    padding: 5px 9px;
    text-align: left;
  }
  th {
    background: #f4f6f8;
    font-weight: 600;
    color: #111;
  }
  td:last-child {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .nota {
    font-size: 8px;
    color: #667085;
    margin-top: 7px;
    line-height: 1.5;
  }

  /* ============ LIGHTBOX ============ */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    padding: 20px;
    cursor: zoom-out;
    animation: fadeIn 0.2s ease;
  }
  .lightbox.activo { display: flex; }
  .lightbox img {
    max-width: 95vw;
    max-height: 90vh;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    background: #fff;
    padding: 10px;
    cursor: default;
    animation: zoomIn 0.25s ease;
  }
  .lightbox .cerrar {
    position: absolute;
    top: 15px;
    right: 22px;
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
  }
  .lightbox .cerrar:hover { transform: scale(1.2); }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes zoomIn { from{transform:scale(0.85);opacity:0} to{transform:scale(1);opacity:1} }
      /* ============================================================
       ESTILO DEL BOTÓN VOLVER (Para calculadoras)
       ============================================================ */
    .btn-volver {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 20px;
        padding: 8px 16px;
        background-color: #ecf0f1;
        color: #34495e;
        border: 1px solid #bdc3c7;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
        font-family: Arial, sans-serif;
    }

    .btn-volver:hover {
        background-color: #e0e6ed;
        border-color: #95a5a6;
        color: #2c3e50;
    }

    .btn-volver:active {
        transform: scale(0.98);
    }
</style>
</head>
<body>

<div class="container">
<a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>
  <h1>Calculadora de Degradado de Codo</h1>
  <p class="subtitulo">Arco exterior, arco interior y tangente — medidas en mm</p>

  <div class="layout">

    <!-- ==================== PANEL IZQUIERDO ==================== -->
    <section class="panel">
      <h2>Datos de entrada</h2>

      <div class="esquema" id="esquemaEntradaImg">
          <img src="img/esquema-codo.png" alt="Esquema del codo" id="imgEsquema"
               onerror="this.style.display='none'">
      </div>
      <div id="esquemaEntrada" style="display:none;"></div>

      <select id="unidad" hidden>
        <option value="mm" selected>Milímetros (mm)</option>
      </select>

      <div class="fila">
        <div>
          <label for="in_ang">Ángulo del codo α (°)</label>
          <input type="number" id="in_ang" value="90" step="any" min="1" max="180">
        </div>
        <div>
          <label for="in_d">Diámetro del codo d (mm)</label>
          <input type="number" id="in_d" value="200" step="any" min="0">
        </div>
      </div>

      <label for="in_R">Radio del codo R (mm)</label>
      <input type="number" id="in_R" value="300" step="any" min="0">

      <button id="btnCalcular">Calcular</button>
      <button id="btnCSV" class="sec">Exportar CSV</button>
      <div class="aviso" id="aviso"></div>

      <p class="nota">
        <strong>A</strong> = arco exterior · <strong>B</strong> = arco interior · <strong>C</strong> = tangente (R * tan(α/2)).
        Todas las medidas en <strong>mm</strong>.
      </p>
    </section>

    <!-- ==================== PANEL DERECHO ==================== -->
    <section class="resultado">
      <h2>Resultados</h2>
      <div id="resumenSalida"></div>
    </section>

  </div>
</div>

<!-- ============ LIGHTBOX ============ -->
<div class="lightbox" id="lightbox">
  <span class="cerrar" id="cerrarLightbox">&times;</span>
  <img id="imgLightbox" alt="Vista ampliada">
</div>

<script src="codoDegradado.js"></script>

<script>
/* ============ LIGHTBOX ============ */
(function(){
  "use strict";

  const lightbox       = document.getElementById('lightbox');
  const cerrarLightbox = document.getElementById('cerrarLightbox');
  const imgLightbox    = document.getElementById('imgLightbox');

  if (!lightbox) return;

  function abrirLightbox(srcImagen){
    if (srcImagen) imgLightbox.src = srcImagen;
    lightbox.classList.add('activo');
    document.body.style.overflow = 'hidden';
  }
  function cerrarLightboxFn(){
    lightbox.classList.remove('activo');
    document.body.style.overflow = '';
  }

  document.addEventListener('click', function(e){
    const img = e.target.closest('.esquema img');
    if (img) {
      e.preventDefault();
      abrirLightbox(img.src);
    }
  });

  cerrarLightbox.addEventListener('click', cerrarLightboxFn);
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) cerrarLightboxFn();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && lightbox.classList.contains('activo')) cerrarLightboxFn();
  });
})();

/* ============ CORRECCIÓN DEL CÁLCULO Y LIMPIEZA ============ */
(function(){
  "use strict";

  const patrones = [
    /ángulo\s*total\s*del\s*conjunto/i,
    /longitud\s*total\s*arco\s*exterior/i,
    /longitud\s*total\s*arco\s*interior/i,
    /arco\s*exterior\s*\(2D\)/i,
    /arco\s*interior\s*\(2E\)/i,
    /conjunto\s*\(2C\)/i
  ];

  function coincide(texto){
    return patrones.some(p => p.test(texto));
  }

  // NUEVA FUNCIÓN PARA CALCULAR LA TANGENTE CORRECTAMENTE
  function corregirTangente() {
      const angInput = document.getElementById('in_ang');
      const RInput = document.getElementById('in_R');
      const contenedor = document.getElementById('resumenSalida');
      
      if (!angInput || !RInput || !contenedor) return;

      const ang = parseFloat(angInput.value);
      const R = parseFloat(RInput.value);

      if (isNaN(ang) || isNaN(R) || ang <= 0) return;

      // FÓRMULA DE LA TANGENTE: T = R * tan(alpha / 2)
      const rad = ang * Math.PI / 180;
      const tangente_correcta = R * Math.tan(rad / 2);
      
      const elementos = contenedor.querySelectorAll('.dato, tr');
      
      elementos.forEach(el => {
          const txt = el.textContent;
          // Buscamos cualquier fila que mencione Avance o Tangente
          if (/Avance|Tangente/i.test(txt)) {
              
              // Si es el diseño de "dato" (con la bolita de la letra)
              let valorSpan = el.querySelector('.valor');
              if (valorSpan) {
                  valorSpan.textContent = tangente_correcta.toFixed(2) + ' mm';
                  
                  // Opcional: Cambiar el texto de "Avance" a "Tangente" si aún dice Avance
                  let textNode = Array.from(el.childNodes).find(n => n.nodeType === 3 && /Avance/i.test(n.nodeValue));
                  if(textNode) {
                      textNode.nodeValue = textNode.nodeValue.replace(/Avance/i, 'Tangente');
                  }
              } 
              // Si es una tabla normal
              else {
                  const tds = el.querySelectorAll('td');
                  if(tds.length > 0) {
                      tds[tds.length-1].textContent = tangente_correcta.toFixed(2);
                  }
              }
          }
      });
  }

  function eliminarFilas(){
    const contenedor = document.getElementById('resumenSalida');
    if (!contenedor) return;

    // 1. Corregimos el valor
    corregirTangente();

    // 2. Eliminamos las filas sobrantes
    contenedor.querySelectorAll('tr').forEach(tr => {
      const txt = (tr.textContent || '').trim();
      if (coincide(txt)) {
        tr.remove();
      }
    });

    const todos = Array.from(contenedor.querySelectorAll('*')).reverse();
    todos.forEach(el => {
      if (el.tagName === 'TR') return;
      const txt = (el.textContent || '').trim();
      if (txt && coincide(txt) && txt.length < 150) {
        el.remove();
      }
    });

    Array.from(contenedor.children).forEach(hijo => {
      const txt = (hijo.textContent || '').trim();
      if (coincide(txt)) hijo.remove();
    });
  }

  const btnCalcular = document.getElementById('btnCalcular');
  if (btnCalcular) {
    btnCalcular.addEventListener('click', () => {
      setTimeout(eliminarFilas, 30); 
      setTimeout(eliminarFilas, 100);
      setTimeout(eliminarFilas, 250);
      setTimeout(eliminarFilas, 500);
    });
  }

  window.addEventListener('load', () => {
    setTimeout(eliminarFilas, 50);
    setTimeout(eliminarFilas, 200);
    setTimeout(eliminarFilas, 500);
  });

  const contenedor = document.getElementById('resumenSalida');
  if (contenedor && window.MutationObserver) {
    const observer = new MutationObserver(() => {
      setTimeout(eliminarFilas, 0);
    });
    observer.observe(contenedor, { childList: true, subtree: true });
  }

  document.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        setTimeout(eliminarFilas, 50);
        setTimeout(eliminarFilas, 200);
      }
    });
  });
})();
</script>
