<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba JointJS P&ID</title>
    <!-- 1. Cargar la librería desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@joint/core@4.1.0/dist/joint.js"></script>
    <style>
        /* 2. El contenedor debe tener un tamaño definido */
        #paper { width: 800px; height: 500px; border: 1px solid #ccc; background: #f5f5f5; }
    </style>
</head>
<body>
    <div id="paper"></div>
    <script>
        // 3. Crear el grafo (el modelo de datos)
        const namespace = joint.shapes;
        const graph = new joint.dia.Graph({}, { cellNamespace: namespace });

        // 4. Crear el "papel" (el lienzo SVG donde se dibuja)
        const paper = new joint.dia.Paper({
            el: document.getElementById('paper'),
            model: graph,
            width: 800,
            height: 500,
            gridSize: 10,
            cellViewNamespace: namespace
        });

        // 5. Crear dos elementos (simulando equipos)
        const rect1 = new joint.shapes.standard.Rectangle();
        rect1.position(100, 100);
        rect1.resize(100, 50);
        rect1.attr('label/text', 'Bomba P-101');
        rect1.addTo(graph);

        const rect2 = new joint.shapes.standard.Rectangle();
        rect2.position(400, 200);
        rect2.resize(100, 50);
        rect2.attr('label/text', 'Válvula V-201');
        rect2.addTo(graph);

        // 6. Crear una conexión (simulando una tubería)
        const link = new joint.shapes.standard.Link();
        link.source(rect1);
        link.target(rect2);
        link.router('orthogonal'); // Línea con ángulos rectos, típico en P&ID
        link.addTo(graph);
    </script>
</body>
</html>
