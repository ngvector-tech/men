<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor P&ID - MEN</title>
    <script src="https://cdn.jsdelivr.net/npm/@joint/core@4.1.0/dist/joint.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* HEADER NATIVO */
        #header-nativo {
            background-color: #1a252f;
            color: white;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            width: 100%;
            flex-shrink: 0;
            border-bottom: 2px solid #3498db;
        }
        #header-nativo .logo-text { font-size: 24px; font-weight: 900; color: #3498db; margin-right: 15px; letter-spacing: 1px; }
        #header-nativo .empresa-text { font-size: 13px; font-weight: bold; color: #ecf0f1; margin-right: 20px; }
        #header-nativo .autor-text { font-size: 10px; color: #7f8c8d; }

        /* TOOLBAR */
        #toolbar { background: #2c3e50; color: white; padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100; flex-wrap: wrap; flex-shrink: 0; }
        .tool-group { display: flex; align-items: center; gap: 6px; border-right: 1px solid #555; padding-right: 12px; }
        .tool-group:last-child { border-right: none; padding-right: 0; }
        .btn-tool { padding: 6px 10px; background: #3498db; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-tool:hover { background: #2980b9; }
        .btn-tool.active { background: #e74c3c; box-shadow: inset 0 3px 5px rgba(0,0,0,0.3); }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; }
        .btn-warning:hover { background: #d68910; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; cursor: pointer; transition: transform 0.1s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.seleccionado { border: 3px solid #f1c40f; transform: scale(1.2); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        
        /* SELECTOR DE GROSOR EN TOOLBAR */
        .grosor-btn { padding: 4px 8px; background: #34495e; border: 1px solid #555; color: white; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .grosor-btn:hover { background: #e67e22; }
        .grosor-btn.seleccionado { background: #e67e22; border-color: #fff; }

        /* LIENZO */
        #main { display: flex; flex: 1; width: 100%; overflow: hidden; position: relative; }
        #paleta { width: 300px; background: #ecf0f1; border-right: 1px solid #ccc; padding: 12px; overflow-y: auto; flex-shrink: 0; z-index: 10; transition: transform 0.3s ease; box-sizing: border-box; }
        #buscador { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        .categoria { margin-bottom: 10px; border: 1px solid #bdc3c7; border-radius: 4px; background: #fff; }
        .categoria-titulo { background: #dcdde1; padding: 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
        .categoria-contenido { display: none; padding: 10px; }
        .categoria.abierta .categoria-contenido { display: block; }
        .simbolo { border: 1px solid #eee; margin-bottom: 8px; padding: 8px; cursor: grab; display: flex; align-items: center; gap: 12px; background: #CFC6C6; border-radius: 4px; }
        .simbolo:hover { background: #f1f2f6; border-color: #3498db; }
        .simbolo img { width: 100px; height: 80px; object-fit: contain; pointer-events: none; }
        .simbolo span { font-size: 10px; font-weight: bold; color: #333; }
        
        /* CAMBIO DE FONDO SI SE DESACTIVA LA REJILLA */
        #lienzo { flex: 1; background: #f9f9f9; position: relative; overflow: hidden; cursor: default; height: 100%; transition: background 0.3s; }
        #lienzo.sin-rejilla { background: white; }
        
        #btn-hamburguesa { display: none; background: #3498db; border: none; color: white; font-size: 18px; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        #overlay-paleta { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 9; }
        #overlay-paleta.activo { display: block; }
        
        @media (max-width: 768px) {
            #btn-hamburguesa { display: inline-block; }
            #paleta { position: absolute; top: 0; left: 0; height: 100%; transform: translateX(-100%); box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
            #paleta.abierta { transform: translateX(0); }
            .btn-tool { padding: 5px 8px; font-size: 11px; }
            .color-btn { width: 18px; height: 18px; }
        }
        
        /* MENÚ CONTEXTUAL */
        #menu-contextual { position: absolute; display: none; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); border-radius: 4px; z-index: 2000; padding: 5px 0; min-width: 180px; }
        #menu-contextual > div { padding: 8px 15px; cursor: pointer; font-size: 13px; color: #333; display: flex; align-items: center; gap: 8px; }
        #menu-contextual > div:hover { background-color: #f1f2f6; color: #3498db; }
        .menu-colores { display: flex; gap: 5px; padding: 8px 15px; border-top: 1px solid #eee; flex-wrap: wrap; width: 140px; }
        .menu-colores .color-btn { width: 20px; height: 20px; border: 2px solid #ccc; }

        /* CAJA OCULTA PARA IMPRESIÓN */
        #caja-impresion {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 210mm; /* Ancho A4 */
            height: 297mm; /* Alto A4 */
            background: white;
            z-index: 9999;
        }
        #caja-impresion svg {
            width: 100% !important;
            height: 100% !important;
        }

        /* --- ESTILOS DE IMPRESIÓN --- */
        @media print {
            body * { visibility: hidden; }
            #caja-impresion, #caja-impresion * { visibility: visible; }
            #caja-impresion {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: white;
            }
        }
    </style>
</head>
<body>

    <div id="header-nativo">
        <span class="logo-text">MEN</span>
        <span class="empresa-text">Montajes Industriales S. L.</span>
        <span class="autor-text">Creado por: J.N.G</span>
    </div>

    <div id="menu-contextual">
        <div onclick="copiarElemento(event)">📄 Copiar</div>
        <div onclick="pegarElemento(event)">📋 Pegar</div>
        <div id="menu-editar" onclick="editarTextoMenu(event)" style="display:none; border-top: 1px solid #eee;">✏️ Editar Texto</div>
        <div id="menu-paleta" class="menu-colores" style="display:none;">
            <div class="color-btn" style="background: #000;" onclick="setColorMenu('#000', event)"></div>
            <div class="color-btn" style="background: #e74c3c;" onclick="setColorMenu('#e74c3c', event)"></div>
            <div class="color-btn" style="background: #3498db;" onclick="setColorMenu('#3498db', event)"></div>
            <div class="color-btn" style="background: #2ecc71;" onclick="setColorMenu('#2ecc71', event)"></div>
            <div class="color-btn" style="background: #e67e22;" onclick="setColorMenu('#e67e22', event)"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="setColorMenu('#9b59b6', event)"></div>
            <div class="color-btn" style="background: #f1c40f;" onclick="setColorMenu('#f1c40f', event)"></div>
            <div class="color-btn" style="background: #7f8c8d;" onclick="setColorMenu('#7f8c8d', event)"></div>
            <div class="color-btn" style="background: #795548;" onclick="setColorMenu('#795548', event)"></div>
        </div>
    </div>

    <div id="toolbar">
        <button id="btn-hamburguesa" onclick="togglePaleta()">☰</button>
        <div class="tool-group">
            <button class="btn-tool btn-danger" onclick="eliminarSeleccionado()">🗑️ Borrar</button>
            <button class="btn-tool btn-warning" onclick="rotar90()">🔄 Girar 90°</button>
            <button class="btn-tool" onclick="prepararImpresion()" style="background: #16a085;">🖨️ Guardar / Imprimir</button>
        </div>
        
        <div class="tool-group">
            <span style="font-size: 11px; font-weight: bold; opacity: 0.8;">Color:</span>
            <div class="color-btn seleccionado" style="background: #000;" onclick="setColor('#000', this)"></div>
            <div class="color-btn" style="background: #e74c3c;" onclick="setColor('#e74c3c', this)"></div>
            <div class="color-btn" style="background: #3498db;" onclick="setColor('#3498db', this)"></div>
            <div class="color-btn" style="background: #2ecc71;" onclick="setColor('#2ecc71', this)"></div>
            <div class="color-btn" style="background: #e67e22;" onclick="setColor('#e67e22', this)"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="setColor('#9b59b6', this)"></div>
            <div class="color-btn" style="background: #f1c40f;" onclick="setColor('#f1c40f', this)"></div>
            <div class="color-btn" style="background: #7f8c8d;" onclick="setColor('#7f8c8d', this)"></div>
        </div>

        <div class="tool-group">
            <span style="font-size: 11px; font-weight: bold; opacity: 0.8;">Grosor:</span>
            <div class="grosor-btn" onclick="setGrosor(1, this)">1px</div>
            <div class="grosor-btn seleccionado" onclick="setGrosor(2, this)">2px</div>
            <div class="grosor-btn" onclick="setGrosor(4, this)">4px</div>
            <div class="grosor-btn" onclick="setGrosor(6, this)">6px</div>
            <div class="grosor-btn" onclick="setGrosor(8, this)">8px</div>
        </div>

        <div class="tool-group">
            <button class="btn-tool" id="btn-linea" onclick="toggleLinea()">📐 Línea Libre</button>
            <button class="btn-tool" id="btn-texto" onclick="toggleTexto()">📝 Añadir Texto</button>
            <button class="btn-tool btn-success" onclick="toggleNombreSimbolo()">🏷️ Nombre Símbolo</button>
        </div>
        <div class="tool-group">
            <button class="btn-tool" style="background: #27ae60;" onclick="centrarDibujo()">🎯 Centrar Dibujo</button>
            <!-- NUEVO BOTÓN DE REJILLA -->
            <button class="btn-tool" style="background: #8e44ad;" onclick="toggleRejilla(this)" id="btn-rejilla">📐 Rejilla ON</button>
        </div>
        <div class="tool-group" style="border-left: 1px solid #555; padding-left: 12px;">
            <span style="font-size: 12px; font-weight: bold; color: #f1c40f;">
                📦 Símbolos visibles: <span id="contador-simbolos">0</span>
            </span>
        </div>
    </div>

    <div id="main">
        <div id="overlay-paleta" onclick="togglePaleta()"></div>
        <div id="paleta">
            <h3 style="margin-top: 0;">Biblioteca P&ID</h3>
            <input type="text" id="buscador" placeholder="🔍 Buscar símbolo...">
            <div id="lista-categorias">Cargando...</div>
        </div>
        <div id="lienzo"></div>
    </div>

    <!-- CAJA OCULTA PARA LA IMPRESIÓN -->
    <div id="caja-impresion"></div>

    <script>
        const graph = new joint.dia.Graph({}, { cellNamespace: joint.shapes });
        let currentScale = 1;
        let grosorActual = 2; 
        let rejillaActiva = true; // Estado de la rejilla

        const paper = new joint.dia.Paper({
            el: document.getElementById('lienzo'), 
            model: graph, 
            width: '100%', height: '100%',
            gridSize: 10, 
            drawGrid: true, 
            cellViewNamespace: joint.shapes,
            interactive: true,
            linkPinning: false, 
            snapLinks: { radius: 20 }, 
            sortViews: true, 
            elementView: joint.dia.ElementView.extend({
                renderMarkup: function() {
                    joint.dia.ElementView.prototype.renderMarkup.apply(this, arguments);
                    this.el.style.overflow = 'visible';
                }
            }),
            defaultLink: new joint.shapes.standard.Link({
                router: { 
                    name: 'orthogonal', 
                    args: { padding: 25, step: 10 } 
                }, 
                connector: { name: 'jumpover', args: { size: 10 } }, 
                attrs: { 
                    line: { 
                        stroke: '#000', 
                        strokeWidth: 2, 
                        targetMarker: null 
                    } 
                }
            })
        });

        // --- FUNCIÓN PARA ACTIVAR/DESACTIVAR LA REJILLA ---
        window.toggleRejilla = function(btn) {
            rejillaActiva = !rejillaActiva;
            const lienzo = document.getElementById('lienzo');
            
            if (rejillaActiva) {
                paper.options.drawGrid = true;
                lienzo.classList.remove('sin-rejilla');
                btn.innerText = '📐 Rejilla ON';
                btn.style.background = '#8e44ad';
            } else {
                paper.options.drawGrid = false;
                lienzo.classList.add('sin-rejilla');
                btn.innerText = '📐 Rejilla OFF';
                btn.style.background = '#7f8c8d';
            }
            paper.drawGrid(); // Forzar redibujado
        };

        let portapapeles = null;
        let elementoBajoClicDerecho = null;
        let colorActual = '#000000';
        let modoLinea = false;
        let modoTexto = false;
        let lineaEnCurso = null;
        let puntosLinea = [];
        let ultimoClicTiempo = 0;
        let elementoClicAnterior = null;

        const CustomImageShape = joint.dia.Element.define('custom.ImageShape', {
            size: { width: 100, height: 60 },
            attrs: {
                body: { refWidth: '100%', refHeight: '100%', fill: 'transparent', stroke: 'none' },
                image: { refWidth: '100%', refHeight: '100%', 'xlink:href': '' }
            },
            ports: {
                groups: {
                    port: { 
                        position: { name: 'absolute' }, 
                        attrs: { circle: { r: 5, magnet: true, stroke: '#3498db', strokeWidth: 2, fill: '#fff', opacity: 0.6 } } 
                    }
                },
                items: []
            }
        }, {
            markup: [
                { tagName: 'rect', selector: 'body' },
                { tagName: 'image', selector: 'image' }
            ]
        });

        let configPuertos = {};

        async function cargarConfigPuertos() {
            const urlSinCache = './config_puertos.json?t=' + new Date().getTime();
            try {
                const res = await fetch(urlSinCache);
                if (res.ok) {
                    configPuertos = await res.json();
                    console.log("✅ JSON de puertos cargado.");
                } else {
                    throw new Error("Error HTTP: " + res.status);
                }
            } catch (e) { 
                console.warn("⚠️ Error al cargar JSON de puertos. Reintentando...");
                setTimeout(cargarConfigPuertos, 1000);
            }
        }
        cargarConfigPuertos();

        function actualizarContador() {
            let totalVisibles = 0;
            document.querySelectorAll('.categoria.abierta').forEach(cat => {
                const simbolos = cat.querySelectorAll('.simbolo');
                simbolos.forEach(sim => {
                    if (sim.style.display !== 'none') totalVisibles++;
                });
            });
            document.getElementById('contador-simbolos').innerText = totalVisibles;
        }

        async function cargarPaleta() {
            try {
                const res = await fetch('./catalogo.json?t=' + new Date().getTime());
                const catalogo = await res.json();
                const contenedor = document.getElementById('lista-categorias');
                contenedor.innerHTML = ''; 

                const categoriasOrdenadas = Object.keys(catalogo).sort((a, b) => a.localeCompare(b));

                categoriasOrdenadas.forEach(categoria => {
                    let archivos = catalogo[categoria];
                    archivos.sort((a, b) => a.nombre.localeCompare(b.nombre));

                    const divCat = document.createElement('div');
                    divCat.className = 'categoria'; 
                    divCat.innerHTML = `<div class="categoria-titulo"><span>${categoria}</span> <span>▼</span></div><div class="categoria-contenido"></div>`;
                    
                    divCat.querySelector('.categoria-titulo').onclick = () => {
                        divCat.classList.toggle('abierta');
                        actualizarContador();
                    };
                    
                    const contenido = divCat.querySelector('.categoria-contenido');

                    archivos.forEach(archivo => {
                        const divSimbolo = document.createElement('div');
                        divSimbolo.className = 'simbolo';
                        divSimbolo.draggable = true;
                        
                        const nombreArchivoReal = archivo.ruta.split('/').pop().replace('.svg', '');
                        const nombreLimpio = nombreArchivoReal.replace(/\s+/g, '_').toLowerCase();
                        
                        divSimbolo.innerHTML = `<img src="${archivo.ruta}"><span>${archivo.nombre}</span>`;
                        
                        divSimbolo.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('svg-url', archivo.ruta);
                            e.dataTransfer.setData('svg-nombre-real', nombreLimpio); 
                            e.dataTransfer.setData('svg-label', archivo.nombre);
                        });
                        contenido.appendChild(divSimbolo);
                    });
                    contenedor.appendChild(divCat);
                });
                activarBuscador();
                actualizarContador();
            } catch (error) { 
                console.error("Error catálogo:", error);
                document.getElementById('lista-categorias').innerHTML = "<p style='color:red; font-size:12px;'>Error al cargar catalogo.json.</p>";
            }
        }

        function activarBuscador() {
            const inputBuscador = document.getElementById('buscador');
            
            inputBuscador.addEventListener('input', (e) => {
                const termino = e.target.value.toLowerCase().trim();
                
                document.querySelectorAll('.simbolo').forEach(sim => {
                    const texto = sim.querySelector('span').innerText.toLowerCase();
                    if (texto.includes(termino)) {
                        sim.style.display = 'flex';
                    } else {
                        sim.style.display = 'none';
                    }
                });

                if (termino.length > 0) {
                    document.querySelectorAll('.categoria').forEach(cat => cat.classList.add('abierta'));
                }
                actualizarContador();
            });
        }

        // --- ZOOM ---
        document.getElementById('lienzo').addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            let newScale = e.deltaY < 0 ? currentScale * zoomFactor : currentScale / zoomFactor;
            newScale = Math.max(0.2, Math.min(5, newScale)); 
            paper.scale(newScale, newScale, e.offsetX, e.offsetY);
            currentScale = newScale;
        }, { passive: false });

        // --- PANEO ---
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;

        document.getElementById('lienzo').addEventListener('mousedown', (e) => {
            if (e.button === 1 || e.button === 2) {
                isPanning = true;
                startPanX = e.clientX;
                startPanY = e.clientY;
                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            const dx = e.clientX - startPanX;
            const dy = e.clientY - startPanY;
            startPanX = e.clientX;
            startPanY = e.clientY;

            const translate = paper.translate();
            paper.translate(translate.tx + dx, translate.ty + dy);
        });

        document.addEventListener('mouseup', () => { isPanning = false; });
        document.getElementById('lienzo').addEventListener('contextmenu', e => e.preventDefault());

        // --- CENTRAR DIBUJO ---
        window.centrarDibujo = function() {
            const elementos = graph.getElements();
            if (elementos.length === 0) {
                paper.scale(1, 1);
                paper.translate(0, 0);
                currentScale = 1;
                return;
            }
            paper.scaleContentToFit({ padding: 50, minScale: 0.2, maxScale: 2 });
            currentScale = paper.scale().sx;
        };

        // --- IMPRESIÓN CLONADA ---
        window.prepararImpresion = function() {
            const caja = document.getElementById('caja-impresion');
            caja.innerHTML = ''; 

            const bbox = graph.getBBox();
            if (!bbox || bbox.width === 0 || bbox.height === 0) {
                alert("No hay nada que imprimir.");
                return;
            }

            const margen = 20;
            const anchoTotal = bbox.width + margen * 2;
            const altoTotal = bbox.height + margen * 2;

            const svgOriginal = paper.svg;
            const svgClon = svgOriginal.cloneNode(true);

            svgClon.setAttribute('viewBox', `${bbox.x - margen} ${bbox.y - margen} ${anchoTotal} ${altoTotal}`);
            svgClon.setAttribute('width', '100%');
            svgClon.setAttribute('height', '100%');
            svgClon.setAttribute('preserveAspectRatio', 'xMidYMid meet');

            svgClon.querySelectorAll('.joint-grid').forEach(el => el.remove());
            svgClon.querySelectorAll('.joint-port').forEach(el => el.remove());
            svgClon.querySelectorAll('.joint-link path').forEach(el => {
                el.setAttribute('stroke', '#000');
                el.setAttribute('stroke-width', '1.5');
            });

            caja.appendChild(svgClon);
            
            setTimeout(() => {
                window.print();
                setTimeout(() => { caja.innerHTML = ''; }, 500);
            }, 100);
        };

        const lienzo = document.getElementById('lienzo');
        lienzo.addEventListener('dragover', (e) => e.preventDefault());

        lienzo.addEventListener('drop', (e) => {
            e.preventDefault();

            const svgUrl = e.dataTransfer.getData('svg-url');
            const svgNombreReal = e.dataTransfer.getData('svg-nombre-real') || "";
            const svgLabel = e.dataTransfer.getData('svg-label') || "Símbolo";
            if (!svgUrl) return;

            let localPoint = paper.clientToLocalPoint({ x: e.clientX, y: e.clientY });
            if (localPoint.x < 150) localPoint.x = 150;
            if (localPoint.y < 100) localPoint.y = 100;

            fetch(svgUrl)
                .then(res => res.text())
                .then(svgTexto => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(svgTexto, "image/svg+xml");
                    const svgElement = doc.querySelector('svg');
                    
                    if(svgElement.getAttribute('fill') === '#fff' || svgElement.getAttribute('fill') === '#ffffff') {
                        svgElement.setAttribute('fill', 'none');
                    }
                    svgElement.querySelectorAll('rect[fill="#fff"], rect[fill="#ffffff"]').forEach(f => f.setAttribute('fill', 'none'));

                    let minX = 0, minY = 0, anchoReal = 100, altoReal = 60;
                    const viewBox = svgElement.getAttribute('viewBox');
                    if(viewBox) {
                        const partes = viewBox.trim().split(/\s+/);
                        if(partes.length === 4) {
                            minX = parseFloat(partes[0]);
                            minY = parseFloat(partes[1]);
                            anchoReal = parseFloat(partes[2]);
                            altoReal = parseFloat(partes[3]);
                        }
                    }

                    svgElement.setAttribute('width', anchoReal);
                    svgElement.setAttribute('height', altoReal);
                    svgElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');

                    const svgLimpio = new XMLSerializer().serializeToString(svgElement);
                    const blob = new Blob([svgLimpio], {type: 'image/svg+xml'});
                    const urlLimpia = URL.createObjectURL(blob);

                    const escala = 2; 
                    const targetWidth = anchoReal * escala;
                    const targetHeight = altoReal * escala;

                    let puertosItems = [];

                    let claveEncontrada = null;
                    for (const clave in configPuertos) {
                        if (clave.replace(/\s+/g, '_').toLowerCase() === svgNombreReal) {
                            claveEncontrada = clave;
                            break;
                        }
                    }

                    if (claveEncontrada) {
                        puertosItems = configPuertos[claveEncontrada].map(p => {
                            return {
                                group: 'port',
                                id: p.id,
                                args: { 
                                    x: (p.x - minX) * escala, 
                                    y: (p.y - minY) * escala 
                                }
                            };
                        });
                    } else {
                        const xLeft = 0; const xRight = targetWidth;
                        const centroY = targetHeight / 2;
                        puertosItems = [
                            { group: 'port', id: 'p_left', args: { x: xLeft, y: centroY } },
                            { group: 'port', id: 'p_right', args: { x: xRight, y: centroY } }
                        ];
                    }

                    const elemento = new CustomImageShape();
                    elemento.position(localPoint.x - (targetWidth/2), localPoint.y - (targetHeight/2));
                    elemento.resize(targetWidth, targetHeight);
                    
                    elemento.attr('image/xlink:href', urlLimpia);
                    elemento.prop('ports/items', puertosItems);
                    
                    elemento.set('simboloNombre', svgNombreReal);
                    elemento.set('simboloLabel', svgLabel);
                    elemento.set('mostrarNombre', false);
                    elemento.set('anchoReal', anchoReal);
                    elemento.set('altoReal', altoReal);
                    elemento.addTo(graph);
                })
                .catch(err => alert("Error al cargar SVG: " + err));
        });

        paper.on('element:pointerdown', function(elementView, evt) {
            if (modoLinea || modoTexto) return;
            const el = elementView.model;
            const ahora = new Date().getTime();
            
            if (ahora - ultimoClicTiempo < 300 && elementoClicAnterior === el.id) {
                if (el.get('tipo') === 'texto') {
                    const nuevoTexto = prompt("Editar texto:", el.attr('label/text'));
                    if (nuevoTexto && nuevoTexto.trim() !== '') {
                        el.attr('label/text', nuevoTexto);
                        el.resize(Math.max(100, nuevoTexto.length * 8), 30);
                    }
                }
                ultimoClicTiempo = 0; elementoClicAnterior = null; return;
            }
            ultimoClicTiempo = ahora; elementoClicAnterior = el.id;

            paper.model.getElements().forEach(otherEl => { otherEl.unset('selected'); if (otherEl.get('tipo') === 'texto') otherEl.attr('body/stroke', 'none'); });
            paper.model.getLinks().forEach(l => l.unset('selected'));
            
            el.set('selected', true);
            if (el.get('tipo') === 'texto') {
                el.attr('body/stroke', '#3498db'); el.attr('body/strokeWidth', 1); el.attr('body/strokeDasharray', '5, 5');
            }
        });

        window.setColor = function(hex, btn) {
            colorActual = hex;
            document.querySelectorAll('#toolbar .color-btn').forEach(b => b.classList.remove('seleccionado'));
            btn.classList.add('seleccionado');
            const seleccionados = paper.model.getElements().filter(el => el.get('selected'));
            seleccionados.forEach(el => {
                el.attr('image/style', colorActual === '#000000' ? '' : `filter: drop-shadow(0 0 0 ${colorActual}) saturate(10);`);
            });
            const lineas = paper.model.getLinks().filter(link => link.get('selected'));
            lineas.forEach(link => link.attr('line/stroke', colorActual));
        };

        window.setColorMenu = function(hex, event) {
            if (event) event.stopPropagation();
            if (!elementoBajoClicDerecho) return;
            const el = elementoBajoClicDerecho;
            if (el.get('tipo') === 'texto') el.attr('label/fill', hex);
            else if (el.get('tipo') === 'svg' || el.get('type') === 'custom.ImageShape') {
                el.attr('image/style', hex === '#000000' ? '' : `filter: drop-shadow(0 0 0 ${hex}) saturate(10);`);
            }
            else if (el.isLink && el.isLink()) el.attr('line/stroke', hex);
            menuContextual.style.display = 'none';
        };

        window.editarTextoMenu = function(event) {
            if (event) event.stopPropagation();
            if (!elementoBajoClicDerecho) return;
            const el = elementoBajoClicDerecho;
            if (el.get('tipo') === 'texto') {
                const textoActual = el.attr('label/text');
                const nuevoTexto = prompt("Editar texto:", textoActual);
                if (nuevoTexto !== null && nuevoTexto.trim() !== '') {
                    el.attr('label/text', nuevoTexto);
                    el.resize(Math.max(100, nuevoTexto.length * 8), 30);
                }
            }
            menuContextual.style.display = 'none';
        };

        window.setGrosor = function(grosor, btn) {
            grosorActual = grosor;
            document.querySelectorAll('.grosor-btn').forEach(b => b.classList.remove('seleccionado'));
            btn.classList.add('seleccionado');

            const lineas = paper.model.getLinks().filter(link => link.get('selected'));
            lineas.forEach(link => {
                link.attr('line/strokeWidth', grosorActual);
            });
        };

        window.toggleLinea = function() {
            modoLinea = !modoLinea;
            if (modoLinea) modoTexto = false;
            document.getElementById('btn-linea').classList.toggle('active', modoLinea);
            document.getElementById('btn-texto').classList.remove('active');
            document.getElementById('lienzo').style.cursor = modoLinea ? 'crosshair' : 'default';
            if (!modoLinea && lineaEnCurso) { lineaEnCurso.remove(); lineaEnCurso = null; puntosLinea = []; }
        };

        window.toggleTexto = function() {
            modoTexto = !modoTexto;
            if (modoTexto) modoLinea = false;
            document.getElementById('btn-texto').classList.toggle('active', modoTexto);
            document.getElementById('btn-linea').classList.remove('active');
            document.getElementById('lienzo').style.cursor = modoTexto ? 'text' : 'default';
        };

        paper.on('blank:pointerdown', function(evt, x, y) {
            if (modoTexto) {
                const texto = prompt("Escribe el texto:");
                if (texto && texto.trim() !== '') {
                    const etiqueta = new joint.shapes.standard.TextBlock();
                    etiqueta.position(x, y);
                    etiqueta.resize(Math.max(100, texto.length * 8), 30); 
                    etiqueta.attr({ body: { fill: 'transparent', stroke: 'none' }, label: { text: texto, fontSize: 14, fontWeight: 'bold', fill: colorActual } });
                    etiqueta.set('tipo', 'texto');
                    etiqueta.addTo(graph);
                }
                toggleTexto();
                return;
            }
            if (modoLinea) {
                if (!lineaEnCurso) {
                    puntosLinea = [{ x: x, y: y }];
                    lineaEnCurso = new joint.shapes.standard.Link({
                        source: { x: x, y: y }, target: { x: x, y: y },
                        router: { name: 'manhattan', args: { padding: 15, step: 10 } },
                        connector: { name: 'jumpover', args: { size: 10 } },
                        attrs: { line: { stroke: colorActual, strokeWidth: grosorActual, targetMarker: null } }
                    });
                    lineaEnCurso.addTo(graph);
                } else {
                    puntosLinea.push({ x: x, y: y });
                    lineaEnCurso.vertices(puntosLinea);
                }
            }
        });

        paper.on('blank:pointermove', function(evt, x, y) {
            if (modoLinea && lineaEnCurso) lineaEnCurso.target({ x: x, y: y });
        });

        paper.on('blank:pointerdblclick', function() {
            if (modoLinea && lineaEnCurso) { lineaEnCurso = null; puntosLinea = []; toggleLinea(); }
        });

        window.eliminarSeleccionado = function() {
            const seleccionados = paper.model.getElements().filter(el => el.get('selected'));
            const enlaces = paper.model.getLinks().filter(link => link.get('selected'));
            if (seleccionados.length === 0 && enlaces.length === 0) return;
            seleccionados.forEach(el => el.remove());
            enlaces.forEach(link => link.remove());
        };

        window.rotar90 = function() {
            const seleccionado = paper.model.getElements().find(el => el.get('selected'));
            if (!seleccionado || seleccionado.get('tipo') === 'texto') return;
            seleccionado.rotate((seleccionado.angle() || 0) + 90);
        };

        paper.on('link:pointerdown', function(linkView) {
            paper.model.getElements().forEach(el => el.unset('selected'));
            paper.model.getLinks().forEach(link => link.unset('selected'));
            linkView.model.set('selected', true);
        });

        paper.on('blank:pointerdown', function() {
            if (modoLinea || modoTexto) return;
            paper.model.getElements().forEach(el => { el.unset('selected'); if (el.get('tipo') === 'texto') el.attr('body/stroke', 'none'); });
            paper.model.getLinks().forEach(l => l.unset('selected'));
            menuContextual.style.display = 'none';
            ultimoClicTiempo = 0; elementoClicAnterior = null;
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') { eliminarSeleccionado(); e.preventDefault(); }
        });

        const menuContextual = document.getElementById('menu-contextual');

        document.getElementById('lienzo').addEventListener('contextmenu', function(evt) {
            evt.preventDefault();
            const localPoint = paper.clientToLocalPoint({ x: evt.clientX, y: evt.clientY });
            const elementos = paper.model.getElements();
            elementoBajoClicDerecho = null;
            for (let i = elementos.length - 1; i >= 0; i--) {
                const bbox = elementos[i].getBBox();
                if (localPoint.x >= bbox.x && localPoint.x <= bbox.x + bbox.width && localPoint.y >= bbox.y && localPoint.y <= bbox.y + bbox.height) {
                    elementoBajoClicDerecho = elementos[i]; break;
                }
            }
            if (elementoBajoClicDerecho) {
                paper.model.getElements().forEach(el => el.unset('selected'));
                elementoBajoClicDerecho.set('selected', true);
                document.getElementById('menu-editar').style.display = elementoBajoClicDerecho.get('tipo') === 'texto' ? 'flex' : 'none';
                document.getElementById('menu-paleta').style.display = 'flex';
                menuContextual.style.display = 'block';
                menuContextual.style.left = evt.clientX + 'px'; menuContextual.style.top = evt.clientY + 'px';
                menuContextual.querySelectorAll('div')[0].style.display = 'flex';
                menuContextual.querySelectorAll('div')[1].style.display = portapapeles ? 'flex' : 'none';
            } else {
                elementoBajoClicDerecho = null;
                if (portapapeles) {
                    menuContextual.style.display = 'block';
                    menuContextual.style.left = evt.clientX + 'px'; menuContextual.style.top = evt.clientY + 'px';
                    document.getElementById('menu-editar').style.display = 'none';
                    document.getElementById('menu-paleta').style.display = 'none';
                    menuContextual.querySelectorAll('div')[0].style.display = 'none';
                    menuContextual.querySelectorAll('div')[1].style.display = 'flex';
                } else { menuContextual.style.display = 'none'; }
            }
        });

        paper.on('link:contextmenu', function(linkView, evt) {
            evt.preventDefault();
            paper.model.getElements().forEach(el => el.unset('selected'));
            paper.model.getLinks().forEach(link => link.unset('selected'));
            linkView.model.set('selected', true);
            elementoBajoClicDerecho = linkView.model;
            document.getElementById('menu-editar').style.display = 'none';
            document.getElementById('menu-paleta').style.display = 'flex';
            menuContextual.style.display = 'block';
            menuContextual.style.left = evt.clientX + 'px'; menuContextual.style.top = evt.clientY + 'px';
            menuContextual.querySelectorAll('div')[0].style.display = 'none';
            menuContextual.querySelectorAll('div')[1].style.display = 'none';
        });

        document.addEventListener('click', function(e) { 
            if (!menuContextual.contains(e.target)) {
                menuContextual.style.display = 'none';
            }
        });
        
        window.copiarElemento = function(event) { 
            if (event) event.stopPropagation(); 
            if (!elementoBajoClicDerecho) return; 
            portapapeles = elementoBajoClicDerecho.clone(); 
            menuContextual.style.display = 'none'; 
        };
        
        window.pegarElemento = function(event) { 
            if (event) event.stopPropagation(); 
            if (!portapapeles) return; 
            const nuevoElemento = portapapeles.clone(); 
            const pos = nuevoElemento.position(); 
            nuevoElemento.position(pos.x + 20, pos.y + 20); 
            nuevoElemento.addTo(graph); 
            nuevoElemento.set('selected', true); 
            portapapeles = nuevoElemento.clone(); 
            menuContextual.style.display = 'none'; 
        };

        window.toggleNombreSimbolo = function() {
            const elementoSeleccionado = paper.model.getElements().find(el => el.get('selected'));
            if (!elementoSeleccionado) return alert("Selecciona un símbolo primero.");

            let estadoActual = elementoSeleccionado.get('mostrarNombre') || false;
            estadoActual = !estadoActual; 
            elementoSeleccionado.set('mostrarNombre', estadoActual);

            const etiquetaId = elementoSeleccionado.get('etiquetaId');

            if (estadoActual) {
                if (etiquetaId) {
                    const viejaEtiqueta = graph.getCell(etiquetaId);
                    if (viejaEtiqueta) viejaEtiqueta.remove();
                }
                const nombreLabel = elementoSeleccionado.get('simboloLabel') || "Símbolo";
                const pos = elementoSeleccionado.position();
                const tam = elementoSeleccionado.size();

                const etiqueta = new joint.shapes.standard.Rectangle();
                etiqueta.position(pos.x + (tam.width / 2) - 100, pos.y + tam.height + 6); 
                etiqueta.resize(200, 24);
                etiqueta.attr({
                    body: { fill: 'transparent', stroke: 'none' },
                    label: { text: nombreLabel, fontSize: 11, fontWeight: 'bold', fill: colorActual, textAnchor: 'middle', textVerticalAnchor: 'middle' }
                });
                etiqueta.addTo(graph);

                etiqueta.listenTo(elementoSeleccionado, 'change:position', function() {
                    const p = elementoSeleccionado.position();
                    const t = elementoSeleccionado.size();
                    etiqueta.position(p.x + (t.width / 2) - 100, p.y + t.height + 6);
                });

                elementoSeleccionado.set('etiquetaId', etiqueta.id);
            } else {
                if (etiquetaId) {
                    const etiquetaExistente = graph.getCell(etiquetaId);
                    if (etiquetaExistente) etiquetaExistente.remove();
                    elementoSeleccionado.unset('etiquetaId');
                }
            }
        };

        window.togglePaleta = function() {
            document.getElementById('paleta').classList.toggle('abierta');
            document.getElementById('overlay-paleta').classList.toggle('activo');
        };

        cargarPaleta();
    </script>
</body>
</html>
