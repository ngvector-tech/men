<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor P&ID - MEN (Versión con más Colores)</title>
    <script src="https://cdn.jsdelivr.net/npm/@joint/core@4.1.0/dist/joint.js"></script>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; }
        #toolbar { background: #2c3e50; color: white; padding: 10px 15px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100; flex-wrap: wrap; }
        .tool-group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #555; padding-right: 15px; }
        .tool-group:last-child { border-right: none; }
        .color-btn { width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
        .btn-tool { padding: 6px 12px; background: #3498db; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-tool.active { background: #e74c3c; }
        .btn-danger { background: #e74c3c; }
        
        #main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        #paleta { width: 320px; background: #ecf0f1; border-right: 1px solid #ccc; padding: 12px; overflow-y: auto; flex-shrink: 0; z-index: 10; transition: transform 0.3s ease; }
        #buscador { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        
        .categoria { margin-bottom: 10px; border: 1px solid #bdc3c7; border-radius: 4px; background: #fff; }
        .categoria-titulo { background: #dcdde1; padding: 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
        .categoria-contenido { display: none; padding: 10px; }
        .categoria.abierta .categoria-contenido { display: block; }
        
        .simbolo { border: 1px solid #eee; margin-bottom: 8px; padding: 8px; cursor: grab; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 4px; }
        .simbolo:hover { background: #f1f2f6; }
        .simbolo img { width: 60px; height: 45px; object-fit: contain; }
        .simbolo span { font-size: 12px; font-weight: bold; color: #333; }
        
        #lienzo { flex: 1; background: #f9f9f9; position: relative; overflow: hidden; cursor: default; }

        /* ===== BOTÓN HAMBURGUESA (solo móvil) ===== */
        #btn-hamburguesa {
            display: none;
            background: #3498db;
            border: none;
            color: white;
            font-size: 18px;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 200;
        }

        /* ===== OVERLAY PARA CERRAR PALETA EN MÓVIL ===== */
        #overlay-paleta {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 9;
        }
        #overlay-paleta.activo { display: block; }

        /* ===== FORZAR TAMAÑOS PEQUEÑOS EN HEADER MEN ===== */
        #men-header img,
        #men-header .logo,
        #men-header svg {
            max-height: 40px;
            width: auto;
        }
        #men-header [data-autor],
        #men-header .autor,
        #men-header .created-by {
            font-size: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #toolbar {
                padding: 6px 8px;
                gap: 8px;
            }
            .tool-group {
                padding-right: 8px;
                gap: 5px;
                border-right: none;
            }
            .btn-tool {
                padding: 5px 9px;
                font-size: 10px;
            }
            .color-btn {
                width: 16px;
                height: 16px;
            }
            #paleta {
                width: 240px;
                padding: 8px;
            }
            .simbolo img {
                width: 45px;
                height: 34px;
            }
            .simbolo span {
                font-size: 11px;
            }
            #buscador {
                padding: 6px;
                font-size: 12px;
            }
            .categoria-titulo {
                padding: 8px;
                font-size: 12px;
            }

            /* Header MEN más pequeño */
            #men-header img,
            #men-header .logo,
            #men-header svg {
                max-height: 28px !important;
            }
            #men-header [data-autor],
            #men-header .autor,
            #men-header .created-by {
                font-size: 9px !important;
            }

            /* Paleta se convierte en panel deslizante */
            #btn-hamburguesa {
                display: inline-block;
            }
            #paleta {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            }
            #paleta.abierta {
                transform: translateX(0);
            }
        }

        @media (max-width: 480px) {
            #toolbar {
                padding: 5px 6px;
                gap: 6px;
            }
            .btn-tool {
                font-size: 9px;
                padding: 4px 7px;
            }
            #paleta {
                width: 200px;
            }
            .simbolo img {
                width: 36px;
                height: 28px;
            }
            .simbolo span {
                font-size: 10px;
            }

            #men-header img,
            #men-header .logo,
            #men-header svg {
                max-height: 22px !important;
            }
            #men-header [data-autor],
            #men-header .autor,
            #men-header .created-by {
                font-size: 8px !important;
            }
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <button id="btn-hamburguesa" onclick="togglePaleta()">☰</button>
        <div class="tool-group">
            <button class="btn-tool btn-danger" onclick="eliminarSeleccionado()">🗑️ Eliminar</button>
            <button class="btn-tool" onclick="window.print()" style="background: #16a085;">🖨️ Imprimir / Guardar</button>
        </div>
        <div class="tool-group">
            <span style="font-size: 12px; font-weight: bold;">Color:</span>
            <div class="color-btn" style="background: #000;" onclick="aplicarEstilo('color', '#000')" title="Negro"></div>
            <div class="color-btn" style="background: #e74c3c;" onclick="aplicarEstilo('color', '#e74c3c')" title="Rojo"></div>
            <div class="color-btn" style="background: #3498db;" onclick="aplicarEstilo('color', '#3498db')" title="Azul"></div>
            <div class="color-btn" style="background: #2ecc71;" onclick="aplicarEstilo('color', '#2ecc71')" title="Verde"></div>
            <div class="color-btn" style="background: #e67e22;" onclick="aplicarEstilo('color', '#e67e22')" title="Naranja"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="aplicarEstilo('color', '#9b59b6')" title="Morado"></div>
            <div class="color-btn" style="background: #f1c40f;" onclick="aplicarEstilo('color', '#f1c40f')" title="Amarillo"></div>
            <div class="color-btn" style="background: #7f8c8d;" onclick="aplicarEstilo('color', '#7f8c8d')" title="Gris"></div>
            <div class="color-btn" style="background: #795548;" onclick="aplicarEstilo('color', '#795548')" title="Marrón"></div>
        </div>
        <div class="tool-group">
            <span style="font-size: 12px; font-weight: bold;">Grosor:</span>
            <select id="select-grosor" onchange="aplicarEstilo('grosor', this.value)" style="padding: 4px; border-radius: 4px;">
                <option value="1">Fino (1px)</option>
                <option value="2" selected>Normal (2px)</option>
                <option value="3">Grueso (3px)</option>
            </select>
        </div>
        <div class="tool-group">
            <button class="btn-tool" id="btn-texto-libre" onclick="toggleModoTexto()">Añadir Texto Libre</button>
            <button class="btn-tool" id="btn-linea-libre" onclick="toggleModoLineaLibre()" style="background: #8e44ad;">📐 Dibujar Línea Libre</button>
            <button class="btn-tool" onclick="agregarTagAElemento()">Añadir Tag a Equipo</button>
            <button class="btn-tool" onclick="toggleNombreSimbolo()" style="background: #27ae60;">🏷️ Nombre Símbolo</button>
        </div>
    </div>

    <div id="main">
        <div id="overlay-paleta" onclick="togglePaleta()"></div>
        <div id="paleta">
            <h3 style="margin-top: 0;">Biblioteca P&ID</h3>
            <input type="text" id="buscador" placeholder="🔍 Buscar símbolo...">
            <div id="lista-categorias">Cargando...</div>
        </div>
        <div id="lienzo"></div>
    </div>

    <script>
        const graph = new joint.dia.Graph({}, { cellNamespace: joint.shapes });
        const paper = new joint.dia.Paper({
            el: document.getElementById('lienzo'), 
            model: graph, 
            width: '100%', height: '100%',
            gridSize: 10, drawGrid: true, cellViewNamespace: joint.shapes,
            linkPinning: true, 
            snapLinks: { radius: 20 },
            defaultLink: new joint.shapes.standard.Link({
                router: { 
                    name: 'manhattan', 
                    args: { padding: 15, step: 10, maximumLoops: 200 } 
                }, 
                connector: { name: 'jumpover', args: { size: 10 } }, 
                attrs: { 
                    line: { 
                        stroke: '#000', 
                        strokeWidth: 2, 
                        targetMarker: { type: 'path', d: 'M 10 -5 0 0 10 5 z' } 
                    } 
                }
            })
        });

        let currentScale = 1;
        paper.on('scale', (scale) => { currentScale = scale; });

        document.getElementById('lienzo').addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            let newScale = e.deltaY < 0 ? currentScale * zoomFactor : currentScale / zoomFactor;
            newScale = Math.max(0.2, Math.min(5, newScale));

            const offsetX = e.offsetX;
            const offsetY = e.offsetY;

            paper.scale(newScale, newScale, offsetX, offsetY);
            currentScale = newScale;
        });

        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;

        paper.on('blank:pointerdown', (evt, x, y) => {
            if (evt.button === 1 || evt.button === 2 || modoTextoActivo) {
                isPanning = true;
                startPanX = evt.clientX;
                startPanY = evt.clientY;
            }
        });

        document.addEventListener('mousemove', (evt) => {
            if (!isPanning) return;
            const dx = evt.clientX - startPanX;
            const dy = evt.clientY - startPanY;
            startPanX = evt.clientX;
            startPanY = evt.clientY;

            const translate = paper.translate();
            paper.translate(translate.tx + dx, translate.ty + dy);
        });

        document.addEventListener('mouseup', () => { isPanning = false; });
        document.getElementById('lienzo').addEventListener('contextmenu', e => e.preventDefault());

        const CustomImageShape = joint.dia.Element.define('custom.ImageShape', {
            size: { width: 100, height: 60 },
            attrs: {
                body: { refWidth: '100%', refHeight: '100%', fill: 'transparent', stroke: 'none' },
                image: { refWidth: '100%', refHeight: '100%', 'xlink:href': '' }
            },
            ports: {
                groups: {
                    port: { 
                        position: { name: 'absolute' }, 
                        attrs: { circle: { r: 6, magnet: true, stroke: '#3498db', strokeWidth: 2, fill: '#fff', opacity: 0 } } 
                    }
                },
                items: []
            }
        }, {
            markup: [
                { tagName: 'rect', selector: 'body' },
                { tagName: 'image', selector: 'image' }
            ]
        });

        paper.on('element:mouseenter', (elementView) => {
            elementView.model.getPorts().forEach(port => {
                elementView.model.portProp(port.id, 'attrs/circle/opacity', 1);
            });
        });
        paper.on('element:mouseleave', (elementView) => {
            elementView.model.getPorts().forEach(port => {
                elementView.model.portProp(port.id, 'attrs/circle/opacity', 0);
            });
        });

        async function cargarPaleta() {
            try {
                const res = await fetch('catalogo.json');
                const catalogo = await res.json();
                const contenedor = document.getElementById('lista-categorias');
                contenedor.innerHTML = ''; 

                const categoriasOrdenadas = Object.keys(catalogo).sort((a, b) => a.localeCompare(b));

                categoriasOrdenadas.forEach(categoria => {
                    let archivos = catalogo[categoria];
                    archivos.sort((a, b) => a.nombre.localeCompare(b.nombre));

                    const divCat = document.createElement('div');
                    divCat.className = 'categoria';
                    divCat.innerHTML = `<div class="categoria-titulo"><span>${categoria}</span> <span>▼</span></div><div class="categoria-contenido"></div>`;
                    divCat.querySelector('.categoria-titulo').onclick = () => divCat.classList.toggle('abierta');
                    const contenido = divCat.querySelector('.categoria-contenido');

                    archivos.forEach(archivo => {
                        const divSimbolo = document.createElement('div');
                        divSimbolo.className = 'simbolo';
                        divSimbolo.draggable = true;
                        divSimbolo.setAttribute('data-nombre', archivo.nombre.toLowerCase());
                        divSimbolo.setAttribute('data-ruta', archivo.ruta);
                        divSimbolo.setAttribute('data-label', archivo.nombre);
                        
                        divSimbolo.innerHTML = `<img src="${archivo.ruta}"><span>${archivo.nombre}</span>`;
                        
                        divSimbolo.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('svg-url', archivo.ruta);
                            e.dataTransfer.setData('svg-nombre', archivo.nombre.toLowerCase());
                            e.dataTransfer.setData('svg-label', archivo.nombre);
                        });
                        contenido.appendChild(divSimbolo);
                    });
                    contenedor.appendChild(divCat);
                });
                activarBuscador();
            } catch (error) { console.error("Error catálogo:", error); }
        }

        function activarBuscador() {
            document.getElementById('buscador').addEventListener('input', (e) => {
                const termino = e.target.value.toLowerCase();
                document.querySelectorAll('.simbolo').forEach(sim => {
                    sim.style.display = sim.getAttribute('data-nombre').includes(termino) ? 'flex' : 'none';
                });
                if(termino.length > 0) document.querySelectorAll('.categoria').forEach(cat => cat.classList.add('abierta'));
            });
        }

        const lienzo = document.getElementById('lienzo');
        lienzo.addEventListener('dragover', (e) => e.preventDefault());

        lienzo.addEventListener('drop', (e) => {
            e.preventDefault();
            const svgUrl = e.dataTransfer.getData('svg-url');
            const svgNombre = e.dataTransfer.getData('svg-nombre') || "";
            const svgLabel = e.dataTransfer.getData('svg-label') || "Símbolo";
            if (!svgUrl) return;

            const localPoint = paper.clientToLocalPoint({ x: e.clientX, y: e.clientY });

            fetch(svgUrl)
                .then(res => res.text())
                .then(svgTexto => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(svgTexto, "image/svg+xml");
                    const svgElement = doc.querySelector('svg');
                    
                    if(svgElement.getAttribute('fill') === '#fff' || svgElement.getAttribute('fill') === '#ffffff') {
                        svgElement.setAttribute('fill', 'none');
                    }
                    svgElement.querySelectorAll('rect[fill="#fff"], rect[fill="#ffffff"]').forEach(f => f.setAttribute('fill', 'none'));

                    // ELIMINACIÓN INTELIGENTE: Solo borra el círculo de la esquina inferior izquierda (marcador externo) y preserva los círculos centrales internos
                    svgElement.querySelectorAll('circle').forEach(c => {
                        const cx = parseFloat(c.getAttribute('cx') || 0);
                        const cy = parseFloat(c.getAttribute('cy') || 0);
                        
                        const viewBox = svgElement.getAttribute('viewBox');
                        if (viewBox) {
                            const partes = viewBox.trim().split(/\s+/).map(Number);
                            if (partes.length === 4) {
                                const [minX, minY, width, height] = partes;
                                if (cx < minX + width * 0.25 && cy > minY + height * 0.5) {
                                    c.remove();
                                    return;
                                }
                            }
                        }
                        if (cx < 35 && cy > 35) {
                            c.remove();
                        }
                    });

                    const svgLimpio = new XMLSerializer().serializeToString(svgElement);
                    const blob = new Blob([svgLimpio], {type: 'image/svg+xml'});
                    const urlLimpia = URL.createObjectURL(blob);

                    let minX = 0, minY = 0, anchoReal = 100, altoReal = 60;
                    const viewBox = svgElement.getAttribute('viewBox');
                    if(viewBox) {
                        const partes = viewBox.trim().split(/\s+/);
                        if(partes.length === 4) {
                            minX = parseFloat(partes[0]);
                            minY = parseFloat(partes[1]);
                            anchoReal = parseFloat(partes[2]);
                            altoReal = parseFloat(partes[3]);
                        }
                    }

                    const escala = 2; 
                    const targetWidth = anchoReal * escala;
                    const targetHeight = altoReal * escala;

                    const centroY = (Math.abs(minY) + (altoReal / 2)) * escala;
                    const centroX = (Math.abs(minX) + (anchoReal / 2)) * escala;
                    const xLeft = Math.abs(minX) * escala;
                    const xRight = targetWidth - (Math.abs(minX) * escala);
                    const yTop = Math.abs(minY) * escala;
                    const yBottom = targetHeight - (Math.abs(minY) * escala);

                    let puertosItems = [];
                    if (svgNombre.includes('3') || svgNombre.includes('tres') || svgNombre.includes('3v')) {
                        puertosItems = [
                            { group: 'port', id: 'p_left', args: { x: xLeft - 2, y: centroY } },
                            { group: 'port', id: 'p_right', args: { x: xRight + 2, y: centroY } },
                            { group: 'port', id: 'p_bottom', args: { x: centroX, y: yBottom + 2 } }
                        ];
                    } else if (svgNombre.includes('4') || svgNombre.includes('cuatro') || svgNombre.includes('4v')) {
                        puertosItems = [
                            { group: 'port', id: 'p_left', args: { x: xLeft - 2, y: centroY } },
                            { group: 'port', id: 'p_right', args: { x: xRight + 2, y: centroY } },
                            { group: 'port', id: 'p_top', args: { x: centroX, y: yTop - 2 } },
                            { group: 'port', id: 'p_bottom', args: { x: centroX, y: yBottom + 2 } }
                        ];
                    } else {
                        puertosItems = [
                            { group: 'port', id: 'p_left', args: { x: xLeft - 2, y: centroY } },
                            { group: 'port', id: 'p_right', args: { x: xRight + 2, y: centroY } }
                        ];
                    }

                    const elemento = new CustomImageShape();
                    elemento.position(localPoint.x - (targetWidth/2), localPoint.y - (targetHeight/2));
                    elemento.resize(targetWidth, targetHeight);
                    elemento.attr('image/xlink:href', urlLimpia);
                    elemento.prop('ports/items', puertosItems);
                    
                    elemento.set('simboloNombre', svgLabel);
                    elemento.set('mostrarNombre', false);

                    elemento.addTo(graph);
                })
                .catch(err => alert("Error al cargar el SVG: " + err));
        });

        let modoLineaLibreActivo = false;
        let lineaEnCurso = null;
        let puntosLinea = [];

        window.toggleModoLineaLibre = function() {
            modoLineaLibreActivo = !modoLineaLibreActivo;
            const btn = document.getElementById('btn-linea-libre');
            btn.classList.toggle('active', modoLineaLibreActivo);
            btn.innerText = modoLineaLibreActivo ? "Dibujando (Doble clic para terminar)" : "📐 Dibujar Línea Libre";
            lienzo.style.cursor = modoLineaLibreActivo ? 'crosshair' : 'default';

            if (!modoLineaLibreActivo && lineaEnCurso) {
                lineaEnCurso = null;
                puntosLinea = [];
            }
        };

        let colorActual = '#000';
        let grosorActual = 2;
        let modoTextoActivo = false;

        window.aplicarEstilo = function(tipo, valor) {
            if (tipo === 'color') colorActual = valor;
            if (tipo === 'grosor') grosorActual = parseInt(valor);
            paper.model.getElements().forEach(el => {
                if (el.get('selected')) {
                    el.attr('image/style', colorActual === '#000' ? '' : `filter: drop-shadow(0 0 0 ${colorActual}) saturate(10);`);
                }
            });
            paper.model.getLinks().forEach(link => {
                if (link.get('selected')) {
                    link.attr('line/stroke', colorActual);
                    link.attr('line/strokeWidth', grosorActual);
                }
            });
        };

        window.toggleModoTexto = function() {
            modoTextoActivo = !modoTextoActivo;
            const btn = document.getElementById('btn-texto-libre');
            btn.classList.toggle('active', modoTextoActivo);
            btn.innerText = modoTextoActivo ? "Haz clic para escribir" : "Añadir Texto Libre";
            lienzo.style.cursor = modoTextoActivo ? 'text' : 'default';
        };

        paper.on('blank:pointerdown', function(evt, x, y) {
            if (modoTextoActivo) {
                const texto = prompt("Escribe el texto:");
                if (texto) {
                    const etiqueta = new joint.shapes.standard.TextBlock();
                    etiqueta.position(x, y);
                    etiqueta.resize(100, 20);
                    etiqueta.attr({
                        body: { fill: 'transparent', stroke: 'none' },
                        label: { text: texto, fontSize: 14, fontWeight: 'bold', fill: colorActual }
                    });
                    etiqueta.addTo(graph);
                }
                toggleModoTexto();
                return;
            }

            if (modoLineaLibreActivo) {
                if (!lineaEnCurso) {
                    puntosLinea = [{ x: x, y: y }];
                    lineaEnCurso = new joint.shapes.standard.Link({
                        source: { x: x, y: y },
                        target: { x: x, y: y },
                        router: { name: 'manhattan', args: { padding: 15, step: 10 } },
                        connector: { name: 'jumpover', args: { size: 10 } },
                        attrs: {
                            line: {
                                stroke: colorActual,
                                strokeWidth: grosorActual,
                                targetMarker: { type: 'path', d: 'M 10 -5 0 0 10 5 z' }
                            }
                        }
                    });
                    lineaEnCurso.addTo(graph);
                } else {
                    puntosLinea.push({ x: x, y: y });
                    lineaEnCurso.vertices(puntosLinea);
                }
            }
        });

        paper.on('blank:pointermove', function(evt, x, y) {
            if (modoLineaLibreActivo && lineaEnCurso) {
                lineaEnCurso.target({ x: x, y: y });
            }
        });

        paper.on('blank:pointerdblclick', function(evt, x, y) {
            if (modoLineaLibreActivo && lineaEnCurso) {
                lineaEnCurso = null;
                puntosLinea = [];
                toggleModoLineaLibre();
            }
        });

        window.eliminarSeleccionado = function() {
            const elementos = paper.model.getElements().filter(el => el.get('selected'));
            const enlaces = paper.model.getLinks().filter(link => link.get('selected'));
            if (elementos.length === 0 && enlaces.length === 0) return alert("Selecciona algo.");
            enlaces.forEach(link => link.remove());
            elementos.forEach(el => el.remove());
        };

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const elementos = paper.model.getElements().filter(el => el.get('selected'));
                const enlaces = paper.model.getLinks().filter(link => link.get('selected'));
                if (elementos.length > 0 || enlaces.length > 0) {
                    enlaces.forEach(link => link.remove());
                    elementos.forEach(el => el.remove());
                    e.preventDefault();
                }
            }
        });

        window.agregarTagAElemento = function() {
            const elementoSeleccionado = paper.model.getElements().find(el => el.get('selected'));
            if (!elementoSeleccionado) return alert("Selecciona un equipo primero.");
            const texto = prompt("Escribe el Tag:", "TAG-01");
            if (!texto) return;
            const pos = elementoSeleccionado.position();
            const tam = elementoSeleccionado.size();
            const etiqueta = new joint.shapes.standard.TextBlock();
            etiqueta.position(pos.x, pos.y - 25); 
            etiqueta.resize(tam.width, 20);
            etiqueta.attr({
                body: { fill: 'transparent', stroke: 'none' },
                label: { text: texto, fontSize: 12, fontWeight: 'bold', fill: colorActual }
            });
            etiqueta.addTo(graph);
            etiqueta.listenTo(elementoSeleccionado, 'change:position', function() {
                etiqueta.position(elementoSeleccionado.position().x, elementoSeleccionado.position().y - 25);
            });
        };

        window.toggleNombreSimbolo = function() {
            const elementoSeleccionado = paper.model.getElements().find(el => el.get('selected'));
            if (!elementoSeleccionado) return alert("Selecciona un símbolo primero.");

            let estadoActual = elementoSeleccionado.get('mostrarNombre') || false;
            estadoActual = !estadoActual; 
            elementoSeleccionado.set('mostrarNombre', estadoActual);

            const etiquetaId = elementoSeleccionado.get('etiquetaId');

            if (estadoActual) {
                if (etiquetaId) {
                    const viejaEtiqueta = graph.getCell(etiquetaId);
                    if (viejaEtiqueta) viejaEtiqueta.remove();
                }

                const nombreSimbolo = elementoSeleccionado.get('simboloNombre') || "Símbolo";
                const pos = elementoSeleccionado.position();
                const tam = elementoSeleccionado.size();

                const etiqueta = new joint.shapes.standard.Rectangle();
                etiqueta.position(pos.x + (tam.width / 2) - 100, pos.y + tam.height + 6); 
                etiqueta.resize(200, 24);
                etiqueta.attr({
                    body: { fill: 'transparent', stroke: 'none' },
                    label: { 
                        text: nombreSimbolo, 
                        fontSize: 11, 
                        fontWeight: 'bold', 
                        fill: colorActual,
                        textAnchor: 'middle',
                        textVerticalAnchor: 'middle'
                    }
                });
                etiqueta.addTo(graph);

                etiqueta.listenTo(elementoSeleccionado, 'change:position', function() {
                    const p = elementoSeleccionado.position();
                    const t = elementoSeleccionado.size();
                    etiqueta.position(p.x + (t.width / 2) - 100, p.y + t.height + 6);
                });

                elementoSeleccionado.set('etiquetaId', etiqueta.id);
            } else {
                if (etiquetaId) {
                    const etiquetaExistente = graph.getCell(etiquetaId);
                    if (etiquetaExistente) {
                        etiquetaExistente.remove();
                    }
                    elementoSeleccionado.unset('etiquetaId');
                }
            }
        };

        paper.on('element:pointerdown', function(elementView) {
            paper.model.getElements().forEach(el => el.unset('selected'));
            paper.model.getLinks().forEach(link => link.unset('selected'));
            elementView.model.set('selected', true);
        });
        paper.on('link:pointerdown', function(linkView) {
            paper.model.getElements().forEach(el => el.unset('selected'));
            paper.model.getLinks().forEach(link => link.unset('selected'));
            linkView.model.set('selected', true);
        });
        paper.on('blank:pointerdown', function() {
            if (modoLineaLibreActivo) return;
            paper.model.getElements().forEach(el => el.unset('selected'));
            paper.model.getLinks().forEach(link => link.unset('selected'));
        });

        // ===== TOGGLE PALETA EN MÓVIL =====
        window.togglePaleta = function() {
            const paleta = document.getElementById('paleta');
            const overlay = document.getElementById('overlay-paleta');
            const estaAbierta = paleta.classList.contains('abierta');
            if (estaAbierta) {
                paleta.classList.remove('abierta');
                overlay.classList.remove('activo');
            } else {
                paleta.classList.add('abierta');
                overlay.classList.add('activo');
            }
        };

        // Cerrar paleta al arrastrar un símbolo (en móvil)
        document.addEventListener('dragstart', () => {
            if (window.innerWidth <= 768) {
                const paleta = document.getElementById('paleta');
                const overlay = document.getElementById('overlay-paleta');
                if (paleta.classList.contains('abierta')) {
                    paleta.classList.remove('abierta');
                    overlay.classList.remove('activo');
                }
            }
        });

        cargarPaleta();
    </script>
