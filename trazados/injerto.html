<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Injerto de Tubería</title>
<style>
  :root{
    --azul:#1e5fa8; --azul-claro:#e8f0fa; --gris:#f4f5f7;
    --borde:#e0e3e6; --texto:#1f2937; --ok:#137a3f; --error:#b42318;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;      /* ⬅️ antes 24 16 60 */
    color: #222;
    display: block !important;
  }

  .container {
    max-width: 800px;            /* ⬅️ antes 1200 (≈ 2/3) */
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;          /* ⬅️ antes 10 */
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;     /* ⬅️ antes 24 28 32 */
  }

  h1 {
    text-align: center;
    font-size: 13px;             /* ⬅️ antes 20 */
    background: #111;
    color: #fff;
    padding: 8px 11px;           /* ⬅️ antes 12 16 */
    border-radius: 4px;          /* ⬅️ antes 6 */
    margin: 0 0 5px;
  }

  .subtitulo {
    text-align: center;
    font-size: 9px;              /* ⬅️ antes 13 */
    color: #666;
    margin: 0 0 15px;            /* ⬅️ antes 22 */
  }

  .layout {
    display: grid;
    grid-template-columns: 253px 1fr;   /* ⬅️ antes 380px 1fr */
    gap: 13px;                          /* ⬅️ antes 20 */
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- Panel izquierdo ---------- */
  .panel {
    background: #f4f6f8;
    border: 1px solid var(--borde);
    border-radius: 5px;          /* ⬅️ antes 8 */
    padding: 11px;               /* ⬅️ antes 16 */
  }
  .panel h2 {
    font-size: 9px;              /* ⬅️ antes 14 */
    margin: 0 0 8px;             /* ⬅️ antes 12 */
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .esquema {
    margin-bottom: 9px;          /* ⬅️ antes 14 */
    background: #e8f0fa;
    border-radius: 4px;          /* ⬅️ antes 6 */
    padding: 7px;                /* ⬅️ antes 10 */
    min-height: 27px;            /* ⬅️ antes 40 */
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .esquema img {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
  }
  .esquema:empty { display: none; }

  label {
    display: block;
    font-size: 9px;              /* ⬅️ antes 13 */
    margin: 7px 0 3px;           /* ⬅️ antes 10 0 4 */
    font-weight: 600;
    color: #444;
  }

  input, select {
    width: 100%;
    padding: 6px 7px;            /* ⬅️ antes 9 10 */
    border: 1px solid #c7ccd1;
    border-radius: 4px;          /* ⬅️ antes 6 */
    font-size: 10px;             /* ⬅️ antes 15 */
    background: #fff;
    color: #222;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #4a90d9;
  }

  .fila {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;                    /* ⬅️ antes 10 */
  }

  button {
    width: 100%;
    padding: 7px;                /* ⬅️ antes 10 */
    margin-top: 9px;             /* ⬅️ antes 14 */
    border: none;
    border-radius: 4px;          /* ⬅️ antes 6 */
    background: #111;
    color: #fff;
    font-size: 9px;              /* ⬅️ antes 14 */
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #333; }

  button.sec {
    background: #fff;
    color: #111;
    border: 1px solid #c7ccd1;
  }
  button.sec:hover { background: #f4f6f8; }

  .aviso {
    margin-top: 7px;             /* ⬅️ antes 10 */
    padding: 5px 7px;            /* ⬅️ antes 8 10 */
    border-radius: 4px;          /* ⬅️ antes 6 */
    font-size: 9px;              /* ⬅️ antes 13 */
    display: none;
  }
  .aviso.error {
    background: #fdecea;
    color: var(--error);
    display: block;
  }
  .aviso.ok {
    background: #e7f5ec;
    color: var(--ok);
    display: block;
  }

  /* ---------- Panel derecho ---------- */
  .resultado {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 5px;          /* ⬅️ antes 8 */
    padding: 11px;               /* ⬅️ antes 16 */
    min-height: 133px;           /* ⬅️ antes 200 */
  }
  .resultado h2 {
    font-size: 9px;              /* ⬅️ antes 14 */
    margin: 0 0 8px;             /* ⬅️ antes 12 */
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  #svgPatron {
    margin-bottom: 11px;         /* ⬅️ antes 16 */
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f6f8;
    border: 1px solid var(--borde);
    border-radius: 4px;          /* ⬅️ antes 6 */
    padding: 8px;                /* ⬅️ antes 12 */
  }
  #svgPatron svg {
    max-width: 100%;
    height: auto;
  }

  /* Tabla que genera injerto.js */
  .tabla-gen {
    width: 100%;
    border-collapse: collapse;
    margin-top: 7px;             /* ⬅️ antes 10 */
    font-size: 10px;             /* ⬅️ antes 14 */
  }
  .tabla-gen th {
    background: #f4f6f8;
    color: #111;
    padding: 5px;                /* ⬅️ antes 8 */
    text-align: left;
    border: 1px solid var(--borde);
    font-weight: 600;
  }
  .tabla-gen td {
    border: 1px solid var(--borde);
    padding: 4px 5px;            /* ⬅️ antes 6 8 */
  }
  .tabla-gen tr:nth-child(even) { background: #f4f6f8; }
  .tabla-gen th:first-child,
  .tabla-gen td:first-child {
    width: 40px;                 /* ⬅️ antes 60 */
    padding-left: 4px;           /* ⬅️ antes 6 */
    padding-right: 4px;          /* ⬅️ antes 6 */
    text-align: left;
  }

  .titulo {
    font-weight: 700;
    color: #111;
    padding: 4px 0 1px;          /* ⬅️ antes 6 0 2 */
  }

  .nota {
    font-size: 8px;              /* ⬅️ antes 12 */
    color: #667085;
    margin-top: 7px;             /* ⬅️ antes 10 */
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Calculadora de Injerto de Tubería</h1>
  <p class="subtitulo">Cálculo del injerto de caña sobre cabezal (α entre ejes)</p>

  <div class="layout">

    <!-- ==================== PANEL IZQUIERDO ==================== -->
    <section class="panel">
      <h2>Datos de entrada</h2>

      <div class="esquema" id="esquemaEntrada"></div>

      <label for="unidad">Unidad</label>
      <select id="unidad">
        <option value="mm" selected>Milímetros (mm)</option>
        <option value="pulg">Pulgadas (in)</option>
      </select>

      <div class="fila">
        <div>
          <label for="in_D">Diámetro base (D)</label>
          <input type="number" id="in_D" value="200" step="any" min="0">
        </div>
        <div>
          <label for="in_d">Diámetro de la caña (d)</label>
          <input type="number" id="in_d" value="160" step="any" min="0">
        </div>
      </div>

      <div class="fila">
        <div>
          <label for="in_C">Altura C (cualquier altura)</label>
          <input type="number" id="in_C" value="170" step="any" min="0">
        </div>
        <div>
          <label for="in_alpha">Ángulo α (° entre ejes)</label>
          <input type="number" id="in_alpha" value="60" step="any" min="15" max="90">
        </div>
      </div>

      <label for="in_N">Nº de divisiones (N)</label>
      <select id="in_N">
        <option value="12" selected>12</option>
        <option value="24">24</option>
        <option value="36">36</option>
      </select>

      <button id="btnCalcular">Calcular</button>
      <button id="btnCSV" class="sec">Exportar CSV</button>
      <button id="btnSVG" class="sec">Exportar SVG</button>
      <div class="aviso" id="aviso"></div>

      <p class="nota">
        α es el ángulo entre el eje de la caña y el eje del cabezal.
        α = 90° → injerto recto (perpendicular).
        α = 45° → injerto típico.
        α = 30° → caña excesiva para soldar.
      </p>
    </section>

    <!-- ==================== PANEL DERECHO ==================== -->
    <section class="resultado">
      <h2>Resultados</h2>
      <div id="svgPatron"></div>
      <div id="resumenSalida"></div>
    </section>

  </div>
</div>

<script src="injerto.js?v=2"></script>

<!-- Cabecera MEN generada por tus archivos, sin tocar nada de ellos -->
<link rel="stylesheet" href="men-header.css">
<script src="men-header.js" data-autor="Creado por: J.N.G"></script>
</body>
</html>
