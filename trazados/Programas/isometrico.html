<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trazo de Tubería — MEN</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: Arial, sans-serif; margin: 0; background:#f4f4f4; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
  
  /* Header Superior */
  #header-nativo {
      background-color: #1a252f;
      color: white;
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      box-sizing: border-box;
      width: 100%;
      flex-shrink: 0;
      border-bottom: 2px solid #3498db;
  }
  #header-nativo .logo-text { font-size: 24px; font-weight: 900; color: #3498db; margin-right: 15px; letter-spacing: 1px; }
  #header-nativo .empresa-text { font-size: 13px; font-weight: bold; color: #ecf0f1; margin-right: 20px; }
  #header-nativo .autor-text { font-size: 10px; color: #7f8c8d; }
  
  .btn-nav {
      padding: 4px 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.2s;
  }
  .btn-nav:hover { background: #2980b9; }

  .main-container { display: flex; flex-direction: column; flex: 1; padding: 6px 10px; gap: 6px; max-width: 100%; overflow-x: hidden; }

  /* Barra de herramientas compacta */
  .toolbar { 
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #fff; 
    padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; 
  }
  .group-box { display: flex; gap: 5px; align-items: center; padding-right: 8px; border-right: 1px solid #ddd; }
  .group-box:last-child { border-right: none; padding-right: 0; margin-left: 0; width: 100%; }
  
  .conf-group {
    display: flex; gap: 6px; align-items: center; background: #f8f9fa; padding: 3px 6px; border-radius: 4px; border: 1px solid #e0e0e0; flex-wrap: wrap;
  }
  .conf-group label { font-size: 11px; font-weight: bold; color: #555; display: flex; flex-direction: column; align-items: center; }
  .conf-group input { width: 50px; padding: 2px; font-size: 11px; text-align: center; border: 1px solid #ccc; border-radius: 3px; }
  .btn-apply { background: #1f6feb; color: #fff; border: none; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 3px; cursor: pointer; height: 100%; }
  .btn-apply:hover { background: #1557b0; }

  .btn-tool {
    padding: 5px 8px; font-size: 11px; border-radius: 4px; cursor: pointer;
    border: 1px solid #888; background: #eef; font-weight: bold; white-space: nowrap;

  .btn-tool:hover { background: #dde; }
  .btn-tool.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .btn-tool.locked { background: #fbbf24; border-color: #f59e0b; color: #000; }

  canvas { display: block; cursor: default; touch-action: none; }

  .resultados-panel { display: flex; gap: 8px; flex-wrap: wrap; transition: all 0.3s ease; overflow: hidden; }

  table { border-collapse: collapse; font-size: 11px; width:100%; margin-bottom: 6px; }

    padding: 5px 10px; border-radius: 6px; border: 1px solid #e0e0e0; margin-bottom: 4px;
  }
  .slider-group { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: bold; }
  .slider-group label { min-width: 15px; color: #333; }
  .slider-group input[type="range"] { width: 100px; accent-color: #1f6feb; }
  .slider-group .valor-slider {
    min-width: 35px; text-align: center; font-family: monospace; font-size: 10px;
    background: #fff; padding: 1px 3px; border-radius: 3px; border: 1px solid #ccc;
  }

  /* Modal de Símbolos P&ID */
  #modalSimbolosIso { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
  .modal-content-iso { background: #fff; width: 650px; height: 80vh; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; border: 2px solid #3498db; }
  .modal-header-iso { background: #3498db; color: white; padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  .modal-cats-iso { background: #2c3e50; padding: 6px 10px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; align-items: center; }
  .btn-cat-iso { background: #34495e; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; font-weight: bold; white-space: nowrap; }
  .btn-cat-iso.active, .btn-cat-iso:hover { background: #27ae60; border-color: #27ae60; }
  .modal-body-iso { padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; flex: 1; }
  .card-simb-iso { border: 1px solid #ddd; padding: 8px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; background: #fafafa; transition: all 0.2s; }
  .card-simb-iso:hover { background: #eef2f7; border-color: #3498db; transform: scale(1.03); }
  .card-simb-iso img { width: 70px; height: 50px; object-fit: contain; }
  .card-simb-iso span { font-size: 10px; text-align: center; font-weight: bold; color: #333; line-height: 1.2; }

  #modalLupa { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  #modalLupa img { max-width: 95vw; max-height: 95vh; background: #fff; border-radius: 4px; object-fit: contain; }
  #modalCerrar { position: absolute; top: 15px; right: 25px; color: #fff; font-size: 40px; cursor: pointer; }

  @media (max-width: 900px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .group-box { border-right: none; border-bottom: 1px solid #ddd; padding-bottom: 6px; padding-right: 0; justify-content: center; flex-wrap: wrap; width: 100%; }
    .btn-tool, .btn-acc, .btn-share { flex: 1; text-align: center; padding: 6px; }
    .conf-group { justify-content: center; width: 100%; }

  }
</style>

<script>
const estado = {
  elementos: [],
  posActual: { x:0, y:0, z:0 },
  dirActual: null,
  codoActual: { diam:100, radio:150 },
  teActual:   { diam:100 },
  tubActual:  { diam:100 },
  requiereNuevoCodo: false,
  ramalesTes: [],
  contadorTes: 0,
  ramaActivaId: null,
  contadorCarretes: 0,
  nodosInteractivos: [],
  cotasInteractivas: [],
  ejesInteractivos: [],
  simbolosInteractivos: [],
  simboloSeleccionado: null,
  rotacionBloqueada: false
};

let catalogoGlobalIso = {};
let imagenesSvgCacheadas = {};
let subcarpetaActivaIso = '';

async function cargarCatalogoIso() {
  try {
    const res = await fetch('./catalogo.json?t=' + new Date().getTime());
    catalogoGlobalIso = await res.json();
  } catch (e) { console.error("Error al cargar catálogo P&ID en isométrico", e); }
}
cargarCatalogoIso();

async function obtenerImagenSvgCache(ruta) {
  if (imagenesSvgCacheadas[ruta]) return imagenesSvgCacheadas[ruta];
  try {
    const res = await fetch(ruta);
    const texto = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(texto, "image/svg+xml");
    const svgEl = doc.querySelector('svg');
    if (!svgEl) return null;
    svgEl.setAttribute('width', '100');
    svgEl.setAttribute('height', '72');
    svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    const serializer = new XMLSerializer();
    const dataUri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(serializer.serializeToString(svgEl))));
    const img = new Image();
    img.src = dataUri;
    await new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; });
    imagenesSvgCacheadas[ruta] = img;
    return img;
  } catch (err) {
    return null;
  }
}

document.getElementById('btnSimb').addEventListener('click', () => {
  const modal = document.getElementById('modalSimbolosIso');
  const bar = document.getElementById('barSubcarpetas');
  bar.innerHTML = '';

  const categorias = Object.keys(catalogoGlobalIso);

  if (categorias.length === 0) {
    document.getElementById('listaModalSimb').innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se cargó catalogo.json o está vacío.</p>';
    modal.style.display = 'flex';
    return;
  }

  categorias.forEach((cat, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn-cat-iso' + (idx === 0 ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      document.querySelectorAll('.btn-cat-iso').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      subcarpetaActivaIso = cat;
      renderizarItemsSubcarpeta(cat);
    };
    bar.appendChild(btn);
  });

  subcarpetaActivaIso = categorias[0];
  renderizarItemsSubcarpeta(subcarpetaActivaIso);
  modal.style.display = 'flex';
});

function renderizarItemsSubcarpeta(cat) {
  const contenedor = document.getElementById('listaModalSimb');
  contenedor.innerHTML = '';
  document.getElementById('buscIsoSimb').value = '';

  const items = catalogoGlobalIso[cat] || [];
  if (items.length === 0) {
    contenedor.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Carpeta vacía.</p>';
    return;
  }

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card-simb-iso';
    card.innerHTML = `<img src="${item.ruta}" alt=""><span>${item.nombre}</span>`;
    card.onclick = () => {
      agregarSimboloIsometrico(item.ruta, item.nombre);
      cerrarModalSimb();
    };
    contenedor.appendChild(card);
  });
}

function filtrarSimbolosIso() {
  const txt = document.getElementById('buscIsoSimb').value.toLowerCase().trim();
  const contenedor = document.getElementById('listaModalSimb');
  contenedor.innerHTML = '';

  if (!txt) {
    renderizarItemsSubcarpeta(subcarpetaActivaIso);
    return;
  }

  let total = 0;
  for (const cat in catalogoGlobalIso) {
    catalogoGlobalIso[cat].forEach(item => {
      if (item.nombre.toLowerCase().includes(txt)) {
        total++;
        const card = document.createElement('div');
        card.className = 'card-simb-iso';
        card.innerHTML = `<img src="${item.ruta}" alt=""><span>${item.nombre}<br><small style="color:#777;">(${cat})</small></span>`;
        card.onclick = () => {
          agregarSimboloIsometrico(item.ruta, item.nombre);
          cerrarModalSimb();
        };
        contenedor.appendChild(card);
      }
    });
  }

  if (total === 0) {
    contenedor.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron resultados.</p>';
  }
}

function cerrarModalSimb() {
  document.getElementById('modalSimbolosIso').style.display = 'none';
}

function agregarSimboloIsometrico(ruta, nombre) {
  obtenerImagenSvgCache(ruta);
  const texto = prompt(`Texto o etiqueta para el símbolo "${nombre}" (vacío para omitir):`, '') || '';
  const orientacionEje = prompt('¿En qué plano/eje se orienta el símbolo?\n1. Eje X (Horizontal +30°)\n2. Eje Y (Horizontal -30°)\n3. Eje Z (Vertical)', '1');
  let plano = 'x';
  if (orientacionEje === '2') plano = 'y';
  else if (orientacionEje === '3') plano = 'z';

  const targetArr = (estado.ramaActivaId && estado.ramaActivaId !== 'principal') ? estado.ramalesTes.find(t=>t.id===estado.ramaActivaId).ramaElementos : estado.elementos;
  targetArr.push({
    tipo: 'simbolo',
    ruta,
    nombre,
    texto,
    plano,
    pos: { ...estado.posActual },
    diam: estado.tubActual.diam,
    mostrarTag: false,
    tramoConectadoNum: null,
    tPos: 0.5 // Posición relativa a lo largo del tramo (0.0 a 1.0)
  });
  dibujar();
  actualizarEstado();
}

let cambiosSinGuardar = false;
let archivoHandleActual = null;

window.addEventListener('beforeunload', function (e) {
  if (cambiosSinGuardar && (estado.elementos.length > 0 || estado.ramalesTes.length > 0)) {
    e.preventDefault();
    e.returnValue = '';
  }
});

const camara = { rotX: -Math.PI / 4, rotY: Math.PI / 4, zoom: 1 };
const vistaFija = { rotX: -Math.PI / 4, rotY: Math.PI / 4, zoom: 1 };
const rotacionEjes = { x: 0, y: 0, z: 0 };

const PALETA = ['#1f6feb', '#16a34a', '#dc2626', '#9333ea', '#0891b2', '#ca8a04', '#db2777', '#059669', '#7c3aed', '#ea580c', '#2563eb', '#65a30d', '#e11d48', '#0d9488', '#a16207'];
const colorPorDiam = new Map();
function colorDiam(d) {
  const key = Math.round(d);
  if (!colorPorDiam.has(key)) colorPorDiam.set(key, PALETA[colorPorDiam.size % PALETA.length]);
  return colorPorDiam.get(key);
}

const DIRS = {
  'z+': { x:0, y:0, z: 1 }, 'z-': { x:0, y:0, z:-1 },
  'x+': { x:1, y:0, z: 0 }, 'x-': { x:-1,y:0, z: 0 },
  'y+': { x:0, y:1, z: 0 }, 'y-': { x:0, y:-1,z: 0 }
};

const DIR_LABEL = { 
  'z+':'+Z Arriba','z-':'−Z Abajo','x+':'+X Derecha',
  'x-':'−X Izquierda','y+':'+Y Fondo','y-':'−Y Delante' 
};

function dirKey(d) {
  if (!d) return null;
  for (const k in DIRS) { const v = DIRS[k]; if (v.x===d.x && v.y===d.y && v.z===d.z) return k; }
  return null;
}

function calcularCarretesLimpios(elementos, esRama = false, teAsociada = null) {
  const res = [];
  for (let i = 0; i < elementos.length; i++) {
    const el = elementos[i];
    if (el.tipo !== 'tramo') continue;
    const prev = elementos[i - 1];
    const next = elementos[i + 1];
    let descIzq = 0, descDer = 0;
    if (prev) {
      if (prev.tipo === 'codo') descIzq = prev.radio;
      else if (prev.tipo === 'te') descIzq = estado.codoActual.radio;
    } else if (esRama && teAsociada) { descIzq = estado.codoActual.radio; }
    if (next) {
      if (next.tipo === 'codo') descDer = next.radio;
      else if (next.tipo === 'te') descDer = estado.codoActual.radio;
    }
    const limpio = Math.max(0, el.largo - (descIzq + descDer));
    res.push({ num: el.num, diam: el.diam, dirKey: el.dirKey, bruto: el.largo, descuento: descIzq + descDer, limpio, texto: el.texto || '' });
  }
  return res;
}

function actualizarEstado() {
  cambiosSinGuardar = true;

  const todosElementos = [...estado.elementos];
  estado.ramalesTes.forEach(t => { if (t.ramaElementos) todosElementos.push(...t.ramaElementos); });
  
  const accPorDiam = {};
  todosElementos.forEach(el => {
    if (el.tipo === 'codo' || el.tipo === 'te' || el.tipo === 'reduccion' || el.tipo === 'simbolo') {
      let tipoLabel = el.tipo === 'codo' ? 'Codos' : el.tipo === 'te' ? 'Tes' : el.tipo === 'reduccion' ? 'Reducciones' : `Símbolo (${el.nombre})`;
      let diamKey = el.tipo === 'reduccion' ? `DN${Math.round(el.d1)}→DN${Math.round(el.d2)}` : `DN${Math.round(el.diam)}`;
      let keyUnica = `${tipoLabel}_${diamKey}`;
      if (!accPorDiam[keyUnica]) accPorDiam[keyUnica] = { tipo: tipoLabel, diam: diamKey, cant: 0, textos: [] };
      accPorDiam[keyUnica].cant++;
      if (el.texto && !accPorDiam[keyUnica].textos.includes(el.texto)) {
        accPorDiam[keyUnica].textos.push(el.texto);
      }
    }
  });

  let htmlAcc = `<table><thead><tr><th>Tipo / Símbolo</th><th>Ø</th><th>Cant.</th><th>Texto / Ref</th></tr></thead><tbody>`;
  let hayAcc = false;
  for (const k in accPorDiam) {
    const item = accPorDiam[k];
    const txts = item.textos.join(', ');
    htmlAcc += `<tr><td>${item.tipo}</td><td>${item.diam}</td><td><b>${item.cant}</b></td><td>${txts}</td></tr>`;
    hayAcc = true;
  }
  if (!hayAcc) htmlAcc += `<tr><td colspan="4" class="small">No hay accesorios ni símbolos</td></tr>`;
  htmlAcc += `</tbody></table>`;
  document.getElementById('listaAccesorios').innerHTML = htmlAcc;

  const carretesPrincipales = calcularCarretesLimpios(estado.elementos, false);
  const carretesRamas = [];
  estado.ramalesTes.forEach(t => { if (t.ramaElementos && t.ramaElementos.length > 0) carretesRamas.push(...calcularCarretesLimpios(t.ramaElementos, true, t)); });
  const todosCarretes = [...carretesPrincipales, ...carretesRamas];

  let htmlCar = `<table><thead><tr><th>Nº</th><th>Ø</th><th>Carrete</th><th>Texto / Ref</th><th>C</th></tr></thead><tbody>`;
  if (todosCarretes.length === 0) htmlCar += `<tr><td colspan="5" class="small">No hay carretes</td></tr>`;
  else {
    todosCarretes.forEach(c => {
      htmlCar += `<tr>
        <td>${c.num}</td>
        <td>DN<input type="number" class="inp-edit inp-diam" data-num="${c.num}" value="${Math.round(c.diam)}" step="1" min="1"></td>
        <td><b>${c.limpio.toFixed(0)}</b></td>
        <td><input type="text" class="inp-txt inp-texto" data-num="${c.num}" value="${c.texto || ''}" placeholder="Texto..."></td>
        <td><span style="background:${colorDiam(c.diam)}; display:inline-block; width:12px; height:12px; border-radius:3px; border:1px solid #333;"></span></td>
      </tr>`;
    });
  }
  htmlCar += `</tbody></table>`;
  document.getElementById('listaMateriales').innerHTML = htmlCar;

  document.querySelectorAll('.inp-diam').forEach(inp => {
    inp.addEventListener('change', (ev) => {
      const num = parseInt(ev.target.dataset.num);
      const nuevo = parseFloat(ev.target.value);
      if (!isNaN(nuevo) && nuevo > 0) actualizarDiametroTramo(num, nuevo);
      else ev.target.value = obtenerDiamTramo(num);
    });
  });

  document.querySelectorAll('.inp-texto').forEach(inp => {
    inp.addEventListener('change', (ev) => {
      const num = parseInt(ev.target.dataset.num);
      actualizarTextoTramo(num, ev.target.value);
    });
  });

  const leg = document.getElementById('leyenda');
  leg.innerHTML = '';
  [...colorPorDiam.entries()].sort((a,b)=>a[0]-b[0]).forEach(([d, c]) => {
    leg.innerHTML += `<span><span style="display:inline-block; width:12px; height:12px; background:${c}; border:1px solid #333; border-radius:3px; vertical-align:middle;"></span> DN${d}</span>`;
  });

  setTimeout(dibujar, 50);
}

function buscarTramoPorNum(num) {
  for (const el of estado.elementos) if (el.tipo === 'tramo' && el.num === num) return { el, arr: estado.elementos, esRama: false };
  for (const te of estado.ramalesTes) {
    if (!te.ramaElementos) continue;
    for (const el of te.ramaElementos) if (el.tipo === 'tramo' && el.num === num) return { el, arr: te.ramaElementos, esRama: true };
  }
  return null;
}
function obtenerLargoTramo(num) { const r = buscarTramoPorNum(num); return r ? r.el.largo : ''; }
function obtenerDiamTramo(num) { const r = buscarTramoPorNum(num); return r ? r.el.diam : ''; }

function actualizarLargoTramo(num, nuevoLargo) {
  const r = buscarTramoPorNum(num);
  if (!r) return;
  r.el.largo = nuevoLargo;
  reconstruirPosiciones();
  dibujar();
  actualizarEstado();
}
function actualizarDiametroTramo(num, nuevoDiam) {
  const r = buscarTramoPorNum(num);
  if (!r) return;
  r.el.diam = nuevoDiam;
  reconstruirPosiciones();
  dibujar();
  actualizarEstado();
}
function actualizarTextoTramo(num, nuevoTexto) {
  const r = buscarTramoPorNum(num);
  if (!r) return;
  r.el.texto = nuevoTexto;
  dibujar();
}

function reconstruirPosiciones() {
  estado.posActual = { x:0, y:0, z:0 };
  estado.dirActual = null;
  estado.contadorCarretes = 0;
  const reconstruirArr = (arr) => {
    for (const el of arr) {
      if (el.tipo === 'tramo') {
        const dir = DIRS[el.dirKey];
        el.inicio = { ...estado.posActual };
        estado.posActual = { x: estado.posActual.x + dir.x * el.largo, y: estado.posActual.y + dir.y * el.largo, z: estado.posActual.z + dir.z * el.largo };
        estado.dirActual = dir;
      } else if (el.tipo === 'codo') { el.pos = { ...estado.posActual }; }
      else if (el.tipo === 'reduccion') {
        el.pos = { ...estado.posActual };
        const dir = estado.dirActual || DIRS['z+'];
        el.dir = { ...dir };
        estado.posActual = { x: estado.posActual.x + dir.x * el.altura, y: estado.posActual.y + dir.y * el.altura, z: estado.posActual.z + dir.z * el.altura };
        estado.tubActual.diam = el.d2;
      } else if (el.tipo === 'te') {
        el.pos = { ...estado.posActual };
        el.dir = estado.dirActual ? { ...estado.dirActual } : { x:0,y:0,z:1 };
      } else if (el.tipo === 'simbolo') {
        el.pos = { ...estado.posActual };
      }
    }
  };
  reconstruirArr(estado.elementos);
  estado.ramalesTes.forEach(te => {
    if (te.ramaElementos.length > 0) {
      estado.posActual = { ...te.pos };
      estado.dirActual = null;
      reconstruirArr(te.ramaElementos);
    }
  });
}

function proyectar(x, y, z) {
  const cosX = Math.cos(camara.rotX), sinX = Math.sin(camara.rotX);
  const y1 = y * cosX - z * sinX, z1 = y * sinX + z * cosX;
  const cosY = Math.cos(camara.rotY), sinY = Math.sin(camara.rotY);
  const x2 = x * cosY - z1 * sinY, z2 = x * sinY + z1 * cosY;
  const ang = Math.PI/6, c = Math.cos(ang), s = Math.sin(ang);
  return { sx: (x2 + z2) * c, sy: -y1 + (x2 - z2) * s };
}

function dibujarCota(ctx, A, B, offset, texto, fs, color, idTramo) {
  const dx = B.x - A.x, dy = B.y - A.y;
  const len = Math.hypot(dx, dy);
  if (len < 1) return;
  const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  const a = { x: A.x + nx * offset, y: A.y + ny * offset };
  const b = { x: B.x + nx * offset, y: B.y + ny * offset };

  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 0.5 * fs; ctx.setLineDash([]);
  
  ctx.beginPath(); ctx.moveTo(A.x + nx * 4 * fs, A.y + ny * 4 * fs); ctx.lineTo(a.x + nx * 4 * fs, a.y + ny * 4 * fs);
  ctx.moveTo(B.x + nx * 4 * fs, B.y + ny * 4 * fs); ctx.lineTo(b.x + nx * 4 * fs, b.y + ny * 4 * fs); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

  const angAB = Math.atan2(b.y - a.y, b.x - a.x);
  const drawArrow = (x, y, angle) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-6*fs, -2*fs); ctx.lineTo(-6*fs, 2*fs); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
  };
  drawArrow(a.x, a.y, angAB); drawArrow(b.x, b.y, angAB + Math.PI);

  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  let angTexto = angAB;
  if (angTexto > Math.PI / 2) angTexto -= Math.PI;
  if (angTexto < -Math.PI / 2) angTexto += Math.PI;

  ctx.save();
  ctx.translate(mx, my); ctx.rotate(angTexto);
  ctx.font = `bold ${9 * fs}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  const w = ctx.measureText(texto).width;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillRect(-w / 2 - 3 * fs, -11 * fs, w + 6 * fs, 11 * fs);
  ctx.fillStyle = color; ctx.fillText(texto, 0, -2 * fs);
  
  if (idTramo !== undefined) {
    ctx.restore(); 
    estado.cotasInteractivas.push({ x: mx, y: my, idTramo, valorActual: texto });
  } else {
    ctx.restore();
  }
  ctx.restore();
}

let mostrarCotas = true;
const RED_VIS_LEN = 14;

function puntosReduccion(el, toScreen, factorEscala) {
  const dir = el.dir;
  const a = toScreen(el.pos);
  const bReal = toScreen({ x: el.pos.x + dir.x * el.altura, y: el.pos.y + dir.y * el.altura, z: el.pos.z + dir.z * el.altura });
  const dxv = bReal.x - a.x, dyv = bReal.y - a.y;
  const ang = Math.atan2(dyv, dxv);
  const lenVis = RED_VIS_LEN * factorEscala;
  return { a, bReal, bVis: { x: a.x + Math.cos(ang) * lenVis, y: a.y + Math.sin(ang) * lenVis }, ang, lenVis };
}

function dibujarIndicadorEjesEsquina(ctx, w, h, factorEscala) {
  const size = 35 * factorEscala;
  const cx = 45 * factorEscala;
  const cy = h - 45 * factorEscala;

  const ex = proyectar(size, 0, 0);
  const ey = proyectar(0, size, 0);
  const ez = proyectar(0, 0, size);

  const pX = { x: cx + ex.sx, y: cy + ex.sy };
  const pY = { x: cx + ey.sx, y: cy + ey.sy };
  const pZ = { x: cx + ez.sx, y: cy + ez.sy };

  const dibujarFlechaEje = (pEnd, col, label) => {
    const ang = Math.atan2(pEnd.y - cy, pEnd.x - cx);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(pEnd.x, pEnd.y);
    ctx.strokeStyle = col; ctx.lineWidth = 2 * factorEscala; ctx.stroke();

    ctx.save(); ctx.translate(pEnd.x, pEnd.y); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-6 * factorEscala, -3 * factorEscala); ctx.lineTo(-6 * factorEscala, 3 * factorEscala); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.restore();

    ctx.font = `bold ${10 * factorEscala}px Arial`; ctx.fillStyle = col;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, pEnd.x + Math.cos(ang) * 10 * factorEscala, pEnd.y + Math.sin(ang) * 10 * factorEscala);
  };

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 3 * factorEscala, 0, Math.PI * 2); ctx.fillStyle = '#333'; ctx.fill();
  dibujarFlechaEje(pX, '#e74c3c', 'X');
  dibujarFlechaEje(pY, '#27ae60', 'Y');
  dibujarFlechaEje(pZ, '#2563eb', 'Z');
  ctx.restore();
}

function renderizarLienzo(ctx, w, h, factorEscala, interactivo) {
  ctx.clearRect(0, 0, w, h);
  
  const pts = [{ x:0, y:0, z:0 }];
  const agregarPuntos = (arr) => {
    for (const el of arr) {
      if (el.tipo === 'tramo') {
        pts.push({ ...el.inicio });
        const d = DIRS[el.dirKey];
        pts.push({ x: el.inicio.x + d.x * el.largo, y: el.inicio.y + d.y * el.largo, z: el.inicio.z + d.z * el.largo });
      } else if (el.pos) {
        pts.push({ ...el.pos });
        if (el.tipo === 'reduccion') {
          const d = el.dir;
          pts.push({ x: el.pos.x + d.x * el.altura, y: el.pos.y + d.y * el.altura, z: el.pos.z + d.z * el.altura });
        }
      }
    }
  };
  agregarPuntos(estado.elementos);
  estado.ramalesTes.forEach(t => agregarPuntos(t.ramaElementos));
  pts.push({ ...estado.posActual });

  const proy = pts.map(p => proyectar(p.x, p.y, p.z));
  const xs = proy.map(p => p.sx), ys = proy.map(p => p.sy);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);

  const margen = 100 * factorEscala;
  let ancho = maxX - minX;
  let alto = maxY - minY;
  if (ancho < 50) ancho = 150; 
  if (alto < 50) alto = 150;

  const escalaBase = Math.min((w - 2 * margen) / ancho, (h - 2 * margen) / alto);
  const escala = interactivo ? escalaBase * camara.zoom : escalaBase;
  const offsetX = w / 2 - ((minX + maxX) / 2) * escala;
  const offsetY = h / 2 - ((minY + maxY) / 2) * escala;

  const toScreen = p => {
    const q = proyectar(p.x, p.y, p.z);
    return { x: q.sx*escala + offsetX, y: q.sy*escala + offsetY };
  };

  if (interactivo) {
    estado.nodosInteractivos = [];
    estado.cotasInteractivas = [];
    estado.ejesInteractivos = [];
    estado.simbolosInteractivos = [];

    const L = 150; 
    const ejes = [
      { v:{x:L,y:0,z:0}, c:'#e74c3c', t:'+X', dirKey:'x+' },
      { v:{x:-L,y:0,z:0}, c:'#e74c3c', t:'−X', dirKey:'x-' },
      { v:{x:0,y:L,z:0}, c:'#27ae60', t:'+Y', dirKey:'y+' },
      { v:{x:0,y:-L,z:0}, c:'#27ae60', t:'−Y', dirKey:'y-' },
      { v:{x:0,y:0,z:L}, c:'#8e44ad', t:'+Z', dirKey:'z+' },
      { v:{x:0,y:0,z:-L}, c:'#8e44ad', t:'−Z', dirKey:'z-' },
    ];
    const o = toScreen({x:0,y:0,z:0});
    
    ejes.forEach(e => {
      const p = toScreen(e.v);
      ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(p.x,p.y);
      ctx.strokeStyle = e.c; ctx.lineWidth = 1.0 * factorEscala;
      ctx.setLineDash([4*factorEscala, 6*factorEscala]); ctx.stroke(); ctx.setLineDash([]);
      
      const pText = { x: o.x + (p.x - o.x) * 0.65, y: o.y + (p.y - o.y) * 0.65 };
      ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(pText.x, pText.y);
      ctx.strokeStyle = e.c; ctx.lineWidth = 1.5 * factorEscala; ctx.stroke();

      ctx.font = `bold ${12*factorEscala}px Arial`; 
      ctx.textAlign='center'; ctx.textBaseline='middle'; 
      
      const wText = ctx.measureText(e.t).width;
      const hText = 16 * factorEscala;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillRect(pText.x - wText/2 - 4*factorEscala, pText.y - hText/2, wText + 8*factorEscala, hText);
      
      ctx.strokeStyle = e.c;
      ctx.lineWidth = 1 * factorEscala;
      ctx.strokeRect(pText.x - wText/2 - 4*factorEscala, pText.y - hText/2, wText + 8*factorEscala, hText);

      ctx.fillStyle = e.c;
      ctx.fillText(e.t, pText.x, pText.y);

      estado.ejesInteractivos.push({ x: pText.x, y: pText.y, dirKey: e.dirKey, etiqueta: e.t });
    });
  }

  dibujarIndicadorEjesEsquina(ctx, w, h, factorEscala);

  const carretesPorNum = new Map();
  calcularCarretesLimpios(estado.elementos, false).forEach(c => carretesPorNum.set(c.num, c));
  estado.ramalesTes.forEach(t => calcularCarretesLimpios(t.ramaElementos, true, t).forEach(c => carretesPorNum.set(c.num, c)));

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const dibujarLinea = (arr, esRama) => {
    for (let i = 0; i < arr.length; i++) {
      const el = arr[i];
      if (el.tipo !== 'tramo') continue;
      const prev = arr[i - 1];
      const d = DIRS[el.dirKey];
      let a = toScreen(el.inicio);
      const b = toScreen({ x: el.inicio.x + d.x * el.largo, y: el.inicio.y + d.y * el.largo, z: el.inicio.z + d.z * el.largo });

      if (prev && prev.tipo === 'reduccion') a = puntosReduccion(prev, toScreen, factorEscala).bVis;

      const col = colorDiam(el.diam);
      const lineWidth = esRama ? 2.5 * factorEscala : 3.5 * factorEscala; 

      ctx.globalAlpha = esRama ? 0.85 : 1.0;
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = lineWidth + (1 * factorEscala);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      ctx.strokeStyle = col; ctx.lineWidth = lineWidth;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();

      if (mostrarCotas) {
        const offsetCota = 18 * factorEscala;
        dibujarCota(ctx, a, b, offsetCota, `${Math.round(el.largo)}`, factorEscala, '#333', el.num);
        const info = carretesPorNum.get(el.num);
        if (info && Math.abs(info.limpio - el.largo) > 0.5) {
          dibujarCota(ctx, a, b, -offsetCota, `${Math.round(info.limpio)}`, factorEscala, '#0a7'); 
        }
      }

      const info = carretesPorNum.get(el.num);
      const limpio = info ? info.limpio : el.largo;
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;

      const dxL = b.x - a.x, dyL = b.y - a.y;
      const lenL = Math.hypot(dxL, dyL) || 1;
      const nxL = -dyL / lenL, nyL = dxL / lenL;
      const offsetNum = (mostrarCotas ? -32 : -18) * factorEscala;
      const cxNum = mx + nxL * offsetNum;
      const cyNum = my + nyL * offsetNum;

      ctx.beginPath(); ctx.arc(cxNum, cyNum, (esRama ? 9 : 11) * factorEscala, 0, Math.PI*2);
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1.5 * factorEscala; ctx.stroke();
      ctx.font = `bold ${(esRama ? 9 : 10)*factorEscala}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col;
      ctx.fillText(el.num, cxNum, cyNum - (esRama ? 2 : 3)*factorEscala);
      ctx.font = `${(esRama ? 7 : 8)*factorEscala}px Arial`;
      ctx.fillText(Math.round(limpio), cxNum, cyNum + (esRama ? 3 : 4)*factorEscala);
      
      if (el.texto) {
        ctx.font = `italic ${(esRama ? 8 : 9)*factorEscala}px Arial`;
        ctx.fillStyle = '#444';
        ctx.fillText(el.texto, cxNum, cyNum + (esRama ? 12 : 14)*factorEscala);
      }
      ctx.textBaseline = 'alphabetic';
    }
    ctx.globalAlpha = 1.0;
  };

  dibujarLinea(estado.elementos, false);
  estado.ramalesTes.forEach(t => dibujarLinea(t.ramaElementos, true));

  const dibujarAccesorios = (arr) => {
    for (const el of arr) {
      if (el.tipo === 'codo') {
        const p = toScreen(el.pos);
        const R = 8 * factorEscala;
        ctx.strokeStyle = '#c026d3'; ctx.lineWidth = 1.5 * factorEscala;
        ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 1.5); ctx.stroke();
        ctx.setLineDash([2 * factorEscala, 2 * factorEscala]);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + R, p.y); ctx.stroke(); ctx.setLineDash([]);
        if (mostrarCotas) dibujarCota(ctx, { x: p.x, y: p.y }, { x: p.x + R, y: p.y }, 10 * factorEscala, `R${el.radio}`, factorEscala, '#c026d3');
        if (el.texto) {
          ctx.font = `italic ${8 * factorEscala}px Arial`; ctx.fillStyle = '#c026d3'; ctx.textAlign = 'center';
          ctx.fillText(el.texto, p.x, p.y - 12 * factorEscala);
        }
      }

      if (el.tipo === 'reduccion') {
        const { a, bVis, ang, lenVis } = puntosReduccion(el, toScreen, factorEscala);
        const r1 = 8 * factorEscala, r2 = Math.max(2 * factorEscala, r1 * (el.d2 / Math.max(el.d1, 1)));
        ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(ang);
        ctx.strokeStyle = 'rgba(192,38,211,0.55)'; ctx.lineWidth = 0.8 * factorEscala;
        ctx.setLineDash([2 * factorEscala, 2 * factorEscala]); ctx.strokeRect(0, -r1, lenVis, 2 * r1); ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(0, -r1); ctx.lineTo(lenVis, -r2); ctx.lineTo(lenVis, r2); ctx.lineTo(0, r1); ctx.closePath();
        ctx.strokeStyle = '#c026d3'; ctx.lineWidth = 1.5 * factorEscala; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, 2 * factorEscala, r1, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(lenVis, 0, 1.2 * factorEscala, r2, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        if (mostrarCotas) dibujarCota(ctx, a, bVis, 14 * factorEscala, `L=${el.altura}`, factorEscala, '#c026d3');
        if (el.texto) {
          ctx.font = `italic ${8 * factorEscala}px Arial`; ctx.fillStyle = '#c026d3'; ctx.textAlign = 'center';
          ctx.fillText(el.texto, (a.x + bVis.x) / 2, (a.y + bVis.y) / 2 - 16 * factorEscala);
        }
      }

      if (el.tipo === 'simbolo') {
        // Si está conectado a un tramo, calculamos su posición 3D exacta usando tPos
        let anguloRotacion = null;
        if (el.tramoConectadoNum) {
          const rTramo = buscarTramoPorNum(el.tramoConectadoNum);
          if (rTramo) {
            const tr = rTramo.el;
            const dTr = DIRS[tr.dirKey];
            const pIni = tr.inicio;
            const pFin = { x: pIni.x + dTr.x * tr.largo, y: pIni.y + dTr.y * tr.largo, z: pIni.z + dTr.z * tr.largo };
            
            // Interpolar posición 3D según tPos
            el.pos = {
              x: pIni.x + (pFin.x - pIni.x) * (el.tPos ?? 0.5),
              y: pIni.y + (pFin.y - pIni.y) * (el.tPos ?? 0.5),
              z: pIni.z + (pFin.z - pIni.z) * (el.tPos ?? 0.5)
            };

            const pIniS = toScreen(pIni);
            const pFinS = toScreen(pFin);
            anguloRotacion = Math.atan2(pFinS.y - pIniS.y, pFinS.x - pIniS.x);
          }
        }

        const p = toScreen(el.pos);
        const imgObj = imagenesSvgCacheadas[el.ruta];
        const wSim = 100 * factorEscala;
        const hSim = 72 * factorEscala;

        ctx.save();
        ctx.translate(p.x, p.y);

        if (anguloRotacion !== null) {
          ctx.rotate(anguloRotacion);
        } else {
          const angIso = (Math.PI / 6) + (10 * Math.PI / 180); 
          if (el.plano === 'x') {
            ctx.transform(Math.cos(angIso), Math.sin(angIso), 0, 1, 0, 0);
          } else if (el.plano === 'y') {
            ctx.transform(Math.cos(-angIso), Math.sin(-angIso), 0, 1, 0, 0);
          } else {
            ctx.rotate(Math.PI / 2 + (10 * Math.PI / 180));
          }
        }

        if (imgObj && imgObj.complete) {
          ctx.drawImage(imgObj, -wSim / 2, -hSim / 2, wSim, hSim);
        } else {
          ctx.fillStyle = '#8e44ad';
          ctx.fillRect(-wSim / 4, -hSim / 4, wSim / 2, hSim / 2);
        }

        ctx.restore();

        if (el.mostrarTag) {
          ctx.save();
          ctx.font = `bold ${10 * factorEscala}px Arial`;
          ctx.fillStyle = '#8e44ad';
          ctx.textAlign = 'center';
          ctx.fillText(el.nombre + (el.texto ? ` (${el.texto})` : ''), p.x, p.y + (hSim / 2) + 12 * factorEscala);
          ctx.restore();
        }

        if (estado.simboloSeleccionado === el) {
          ctx.save();
          ctx.strokeStyle = '#ff0000';
          ctx.lineWidth = 2 * factorEscala;
          ctx.setLineDash([4 * factorEscala, 4 * factorEscala]);
          ctx.strokeRect(p.x - wSim/2 - 6, p.y - hSim/2 - 6, wSim + 12, hSim + (el.mostrarTag ? 28 : 12));
          ctx.restore();
        }

        if (interactivo) {
          estado.simbolosInteractivos.push({ x: p.x, y: p.y, w: wSim, h: hSim + (el.mostrarTag ? 20 : 0), elemento: el });
        }
      }

      if (el.tipo === 'te') {
        const infoTe = estado.ramalesTes.find(r => r.id === el.id);
        if (!infoTe) continue;
        
        const dirPrincipal = el.dir || { x:0,y:0,z:1 };
        const dirRamal = infoTe.dirRamal;

        const pCenter = toScreen(el.pos);
        const lenVis = 12 * factorEscala;
        const pIn1 = toScreen({ x: el.pos.x - dirPrincipal.x * lenVis, y: el.pos.y - dirPrincipal.y * lenVis, z: el.pos.z - dirPrincipal.z * lenVis });
        const pOut1 = toScreen({ x: el.pos.x + dirPrincipal.x * lenVis, y: el.pos.y + dirPrincipal.y * lenVis, z: el.pos.z + dirPrincipal.z * lenVis });
        const pRama = toScreen({ x: el.pos.x + dirRamal.x * lenVis, y: el.pos.y + dirRamal.y * lenVis, z: el.pos.z + dirRamal.z * lenVis });

        const angMain = Math.atan2(pOut1.y - pIn1.y, pOut1.x - pIn1.x);
        const angRamal = Math.atan2(pRama.y - pCenter.y, pRama.x - pCenter.x);

        ctx.save();
        ctx.strokeStyle = '#c026d3';
        ctx.lineWidth = 3 * factorEscala;
        ctx.lineCap = 'round';
        
        ctx.beginPath();
        ctx.moveTo(pIn1.x, pIn1.y); ctx.lineTo(pOut1.x, pOut1.y);
        ctx.moveTo(pCenter.x, pCenter.y); ctx.lineTo(pRama.x, pRama.y);
        ctx.stroke();

        ctx.fillStyle = '#c026d3';
        const bW = 6 * factorEscala, bH = 10 * factorEscala;
        const dibujarBrida = (px, py, angulo) => {
          ctx.save(); ctx.translate(px, py); ctx.rotate(angulo);
          ctx.fillRect(-bW/2, -bH/2, bW, bH);
          ctx.restore();
        };

        dibujarBrida(pIn1.x, pIn1.y, angMain + Math.PI/2);
        dibujarBrida(pOut1.x, pOut1.y, angMain + Math.PI/2);
        dibujarBrida(pRama.x, pRama.y, angRamal + Math.PI/2);
        ctx.restore();

        ctx.font = `bold ${8 * factorEscala}px Arial`; ctx.fillStyle = '#c026d3'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        let lblTe = `T${el.id} DN${el.diam}`;
        if (el.texto) lblTe += ` (${el.texto})`;
        ctx.fillText(lblTe, pCenter.x + 12 * factorEscala, pCenter.y - 12 * factorEscala); 
        ctx.textBaseline = 'alphabetic';
      }
    }
  };
  dibujarAccesorios(estado.elementos);
  estado.ramalesTes.forEach(t => dibujarAccesorios(t.ramaElementos));

  const dibujarNodo = (pos3D_visual, id, nombre, dir3D, diam, pos3D_real, tipo) => {
    let p = pos3D_visual.__screen ? pos3D_visual.__screen : toScreen(pos3D_visual);
    let col = diam ? colorDiam(diam) : '#28a745';
    if (tipo === 'ramal') col = '#f59e0b'; 
    
    ctx.beginPath(); ctx.arc(p.x, p.y, 10*factorEscala, 0, Math.PI*2); ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x, p.y, 5*factorEscala, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5*factorEscala; ctx.stroke();
    if (interactivo) estado.nodosInteractivos.push({ x: p.x, y: p.y, id, nombre, pos3D: pos3D_real || pos3D_visual, dir3D, diam, tipo });
  };

  const renderNodoSiEsExtremo = (arr, idRama) => {
    for (let i = 0; i < arr.length; i++) {
        const el = arr[i];
        if (el.tipo === 'tramo') {
            dibujarNodo(el.inicio, idRama, `Inicio Tramo ${el.num}`, el.dirKey ? DIRS[el.dirKey] : null, el.diam);
            const next = arr[i+1];
            if (!next || next.tipo !== 'tramo') {
                const d = DIRS[el.dirKey];
                const posFin = { x: el.inicio.x + d.x * el.largo, y: el.inicio.y + d.y * el.largo, z: el.inicio.z + d.z * el.largo };
                dibujarNodo(posFin, idRama, `Fin Tramo ${el.num}`, d, el.diam);
            }
        }
    }
  };

  renderNodoSiEsExtremo(estado.elementos, 'principal');
  estado.ramalesTes.forEach(t => {
    renderNodoSiEsExtremo(t.ramaElementos, t.id);
    if (t.ramaElementos.length === 0) {
        dibujarNodo(t.pos, t.id, `Ramal T${t.id} (Libre)`, t.dirRamal, t.diam);
    }
  });

  const pIni = toScreen({x:0,y:0,z:0});
  ctx.beginPath(); ctx.arc(pIni.x, pIni.y, 6*factorEscala, 0, Math.PI*2); ctx.fillStyle = '#28a745'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5*factorEscala; ctx.stroke();
  ctx.font = `bold ${11*factorEscala}px Arial`; ctx.fillStyle = '#28a745'; ctx.textAlign = 'left'; ctx.fillText('INICIO', pIni.x + 8*factorEscala, pIni.y + 18*factorEscala);
}

const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');

function dibujar() {
  const cont = canvas.parentElement;
  const anchoPx = Math.max(300, cont.clientWidth - 4);
  const altoPx = Math.max(300, cont.clientHeight - 4);
  canvas.width = anchoPx;
  canvas.height = altoPx;
  renderizarLienzo(ctx, anchoPx, altoPx, 1, true);
}

let isDragging = false, lastX = 0, lastY = 0, hasMoved = false;
let arrastrandoSimbolo = null;

canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);

  let encontrado = null;
  for (const s of estado.simbolosInteractivos) {
    if (Math.abs(mx - s.x) <= s.w / 2 && Math.abs(my - s.y) <= s.h / 2) {
      encontrado = s.elemento;
      break;
    }
  }

  if (encontrado) {
    arrastrandoSimbolo = encontrado;
    estado.simboloSeleccionado = encontrado;
    isDragging = false;
    lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    dibujar();
    return;
  }

  estado.simboloSeleccionado = null;
  isDragging = true; hasMoved = false; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  dibujar();
});

canvas.addEventListener('pointermove', (e) => {
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;

  if (arrastrandoSimbolo) {
    const scaleFactor = canvas.width / canvas.getBoundingClientRect().width;
    const sX = dx * scaleFactor;
    const sY = dy * scaleFactor;

    // Si el símbolo está conectado a un tramo, deslizarlo estrictamente sobre la línea
    if (arrastrandoSimbolo.tramoConectadoNum) {
      const rTramo = buscarTramoPorNum(arrastrandoSimbolo.tramoConectadoNum);
      if (rTramo) {
        const tr = rTramo.el;
        const dTr = DIRS[tr.dirKey];
        const pIniS = proyectar(tr.inicio.x, tr.inicio.y, tr.inicio.z);
        const pFinS = proyectar(tr.inicio.x + dTr.x * tr.largo, tr.inicio.y + dTr.y * tr.largo, tr.inicio.z + dTr.z * tr.largo);
        
        // Vector en pantalla del tramo
        const vx = pFinS.sx - pIniS.sx;
        const vy = pFinS.sy - pIniS.sy;
        const lenScreen = Math.hypot(vx, vy);

        if (lenScreen > 1) {
          const ux = vx / lenScreen;
          const uy = vy / lenScreen;
          // Proyectar movimiento del ratón sobre la dirección de la línea
          const deltaScreen = sX * ux + sY * uy;
          const deltaT = deltaScreen / lenScreen;

          arrastrandoSimbolo.tPos = Math.max(0, Math.min(1, (arrastrandoSimbolo.tPos ?? 0.5) + deltaT));
        }
      }
    }

    lastX = e.clientX; lastY = e.clientY;
    dibujar();
    return;
  }

  if (!isDragging) return;
  lastX = e.clientX; lastY = e.clientY;
});

canvas.addEventListener('pointerup', (e) => {
  if (arrastrandoSimbolo) {
    arrastrandoSimbolo = null;
    isDragging = false;
    return;
  }

  if (!isDragging) return;
  isDragging = false;
  
  if (!hasMoved) {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    const esTactil = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const margen = esTactil ? 25 : 18;

    if (estado.ejesInteractivos) {
      for (const eje of estado.ejesInteractivos) {
        if (Math.hypot(eje.x - mx, eje.y - my) <= margen) {
          agregarTramo(eje.dirKey);
          return;
        }
      }
    }
    
    let cotaElegida = null;
    for (const c of estado.cotasInteractivas) {
      if (Math.hypot(c.x - mx, c.y - my) <= margen) { cotaElegida = c; break; }
    }
    if (cotaElegida) {
      const nuevo = parseFloat(prompt(`Editar distancia del carrete ${cotaElegida.idTramo} (mm):`, cotaElegida.valorActual));
      if (!isNaN(nuevo) && nuevo > 0) actualizarLargoTramo(cotaElegida.idTramo, nuevo);
      return;
    }

    let nodoElegido = null;
    for (const n of estado.nodosInteractivos) {
      if (Math.hypot(n.x - mx, n.y - my) <= margen) { nodoElegido = n; break; }
    }
    if (nodoElegido) {
      if (nodoElegido.nombre.includes('T') && (nodoElegido.tipo === 'ramal' || nodoElegido.tipo === 'longitudinal')) {
        const teId = nodoElegido.id;
        const opcion = prompt(`La Te T${teId} tiene dos conexiones disponibles.\n¿A cuál quieres conectarte?\n1. Continuar línea principal (longitudinal)\n2. Ramal vertical`, nodoElegido.tipo === 'ramal' ? '2' : '1');
        if (opcion === null) return;
        const infoTe = estado.ramalesTes.find(r => r.id === teId);
        if (!infoTe) return;
        if (opcion === '1') {
          estado.ramaActivaId = null;
          estado.posActual = { ...nodoElegido.pos3D };
          estado.dirActual = infoTe.dirPrincipal;
          estado.tubActual.diam = infoTe.diam;
        } else if (opcion === '2') {
          estado.ramaActivaId = teId;
          estado.posActual = { ...nodoElegido.pos3D };
          estado.dirActual = infoTe.dirRamal;
          estado.tubActual.diam = infoTe.diam;
          infoTe.usado = true;
        }
        dibujar(); actualizarEstado();
        alert(`Conectado a T${teId}. Puedes seguir trazando.`);
        return;
      }

      estado.ramaActivaId = nodoElegido.id;
      estado.posActual = { ...nodoElegido.pos3D };
      estado.dirActual = nodoElegido.dir3D;
      estado.tubActual.diam = nodoElegido.diam;
      if (nodoElegido.id !== 'principal') { const te = estado.ramalesTes.find(t => t.id === seleccion.id); if (te) te.usado = true; }
      dibujar(); actualizarEstado();
      alert(`Has conectado al nodo: ${nodoElegido.nombre}. Puedes seguir trazando.`);
      return;
    }
  }
});

// Evento de Clic Derecho (Contextmenu) sobre símbolos
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);

  for (const s of estado.simbolosInteractivos) {
    if (Math.abs(mx - s.x) <= s.w / 2 && Math.abs(my - s.y) <= s.h / 2) {
      const el = s.elemento;
      estado.simboloSeleccionado = el;
      dibujar();

      const opcion = prompt(
        `Opciones para el símbolo "${el.nombre}":\n1. ${el.mostrarTag ? 'Ocultar Tag / Nombre' : 'Mostrar Tag / Nombre'}\n2. Editar Tag o Etiqueta\n3. Conectar / Alinear a tramo de tubería`,
        '1'
      );

      if (opcion === '1') {
        el.mostrarTag = !el.mostrarTag;
      } else if (opcion === '2') {
        const nuevoTexto = prompt('Introduce el nuevo tag o texto editable:', el.texto || el.nombre);
        if (nuevoTexto !== null) {
          el.texto = nuevoTexto;
          el.mostrarTag = true;
        }
      } else if (opcion === '3') {
        const todosTramos = [];
        const recolectarTramos = (arr) => {
          arr.forEach(item => { if (item.tipo === 'tramo') todosTramos.push(item); });
        };
        recolectarTramos(estado.elementos);
        estado.ramalesTes.forEach(t => { if (t.ramaElementos) recolectarTramos(t.ramaElementos); });

        if (todosTramos.length === 0) {
          alert('No hay tramos de tubería disponibles en el plano.');
        } else {
          const listaStr = todosTramos.map(t => `• Tramo Nº ${t.num} (DN${Math.round(t.diam)})`).join('\n');
          const numTramoStr = prompt(`Selecciona el número de tramo al que deseas conectar y alinear el símbolo:\n\n${listaStr}`, todosTramos[0].num);
          if (numTramoStr !== null) {
            const numTramo = parseInt(numTramoStr);
            const tramoSel = todosTramos.find(t => t.num === numTramo);
            if (tramoSel) {
              el.tramoConectadoNum = tramoSel.num;
              el.tPos = 0.5; // Se coloca al centro inicialmente
              alert(`¡Símbolo conectado y alineado al Tramo Nº ${tramoSel.num}! Ahora puedes arrastrarlo para deslizarlo por la línea.`);
            } else {
              alert('Número de tramo inválido.');
            }
          }
        }
      }
      dibujar();
      actualizarEstado();
      return;
    }
  }
});

window.addEventListener('keydown', (e) => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && estado.simboloSeleccionado) {
    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    
    const objetivo = estado.simboloSeleccionado;
    let idx = estado.elementos.indexOf(objetivo);
    if (idx > -1) {
      estado.elementos.splice(idx, 1);
    } else {
      estado.ramalesTes.forEach(t => {
        if (t.ramaElementos) {
          let iRama = t.ramaElementos.indexOf(objetivo);
          if (iRama > -1) t.ramaElementos.splice(iRama, 1);
        }
      });
    }
    estado.simboloSeleccionado = null;
    dibujar();
    actualizarEstado();
  }
});

canvas.addEventListener('pointercancel', () => { isDragging = false; arrastrandoSimbolo = null; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  camara.zoom = Math.max(0.3, Math.min(6, camara.zoom * factor));
  dibujar();
}, { passive: false });

function nuevoProyecto() {
  if (cambiosSinGuardar && (estado.elementos.length > 0 || estado.ramalesTes.length > 0)) {
    if (!confirm("Tienes cambios sin guardar. ¿Deseas crear un nuevo proyecto y descartar el actual?")) {
      return;
    }
  }
  estado.elementos = [];
  estado.posActual = { x:0, y:0, z:0 };
  estado.dirActual = null;
  estado.requiereNuevoCodo = false;
  estado.ramalesTes = [];
  estado.contadorTes = 0;
  estado.ramaActivaId = null;
  estado.contadorCarretes = 0;
  estado.nodosInteractivos = [];
  estado.cotasInteractivas = [];
  estado.simboloSeleccionado = null;
  archivoHandleActual = null;
  cambiosSinGuardar = false;

  camara.rotX = vistaFija.rotX;
  camara.rotY = vistaFija.rotY;
  camara.zoom = vistaFija.zoom;
  resetSliders();
  
  estado.rotacionBloqueada = false;
  const btnRot = document.getElementById('btnToggleRot');
  btnRot.textContent = '🔓 Rotación Libre';
  btnRot.classList.remove('locked');

  colorPorDiam.clear();

}

async function guardarComoProyecto() {
  const datosProyecto = {
    codoActual: estado.codoActual,
    teActual: estado.teActual,
    tubActual: estado.tubActual,
    elementos: estado.elementos,
    ramalesTes: estado.ramalesTes,
    contadorTes: estado.contadorTes,
    contadorCarretes: estado.contadorCarretes
  };
  const data = JSON.stringify(datosProyecto, null, 2);
  
  if ('showSaveFilePicker' in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'esquema_tuberia.isoin',
        types: [{
          description: 'Archivo de Tubería Isométrica (*.isoin)',
          accept: { 'application/json': ['.json', '.isoin'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
      archivoHandleActual = handle;
      cambiosSinGuardar = false;
      alert("Proyecto guardado correctamente.");
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }

  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'esquema_tuberia.isoin';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  cambiosSinGuardar = false;
}

async function guardarProyecto() {
  if (archivoHandleActual && 'showSaveFilePicker' in window) {
    try {
      const datosProyecto = {
        codoActual: estado.codoActual,
        teActual: estado.teActual,
        tubActual: estado.tubActual,
        elementos: estado.elementos,
        ramalesTes: estado.ramalesTes,
        contadorTes: estado.contadorTes,
        contadorCarretes: estado.contadorCarretes
      };
      const data = JSON.stringify(datosProyecto, null, 2);
      const writable = await archivoHandleActual.createWritable();
      await writable.write(data);
      await writable.close();
      cambiosSinGuardar = false;
      alert("Proyecto guardado.");
      return;
    } catch (err) {}
  }
  guardarComoProyecto();
}

function abrirProyecto() {
  if (cambiosSinGuardar && (estado.elementos.length > 0 || estado.ramalesTes.length > 0)) {
    if (!confirm("Tienes cambios sin guardar. ¿Deseas abrir otro archivo y descartar los cambios actuales?")) {
      return;
    }
  }
  document.getElementById('input-archivo').click();
}

function cargarArchivoProyecto(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const json = JSON.parse(e.target.result);
      if (!json.elementos) throw new Error("Formato inválido");

      estado.codoActual = json.codoActual || { diam: 100, radio: 150 };
      estado.teActual = json.teActual || { diam: 100 };
      estado.tubActual = json.tubActual || { diam: 100 };
      estado.elementos = json.elementos || [];
      estado.ramalesTes = json.ramalesTes || [];
      estado.contadorTes = json.contadorTes || 0;
      estado.contadorCarretes = json.contadorCarretes || 0;
      estado.ramaActivaId = null;
      estado.requiereNuevoCodo = false;
      estado.simboloSeleccionado = null;

      document.getElementById('defDiam').value = estado.codoActual.diam;
      document.getElementById('defRadio').value = estado.codoActual.radio;
      document.getElementById('defTe').value = estado.teActual.diam;
      document.getElementById('defTub').value = estado.tubActual.diam;

      reconstruirPosiciones();
      dibujar();
      actualizarEstado();
      cambiosSinGuardar = false;
      archivoHandleActual = null;
      alert("Proyecto cargado con éxito.");
    } catch (err) {
      alert("Error al leer el archivo.");
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function aplicarRotacionSliders() {
  let rx = vistaFija.rotX;
  let ry = vistaFija.rotY;

  rx += rotacionEjes.x;
  ry += rotacionEjes.y;
  rx += rotacionEjes.z * 0.5;
  ry += rotacionEjes.z * 0.5;

  rx = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, rx));

  camara.rotX = rx;
  camara.rotY = ry;
  dibujar();
}

function resetSliders() {

  document.getElementById('sliderX').value = 0;

  document.getElementById('sliderZ').value = 0;
  document.getElementById('valorX').textContent = '0°';

function conectarTe() {
  const tesLibres = estado.ramalesTes.filter(t => !t.usado);
  if (tesLibres.length === 0) { alert('No hay ramales libres.'); return; }
  const idStr = prompt(`¿A qué Te conectar?\n${tesLibres.map(t => `T${t.id} (DN${t.diam})`).join(', ')}`, tesLibres[0].id);
  if (idStr === null) return;
  const te = tesLibres.find(t => t.id === parseInt(idStr));
  if (!te) { alert('Inválido.'); return; }
  te.usado = true; estado.ramaActivaId = te.id; estado.posActual = { ...te.pos }; estado.dirActual = te.dirRamal; estado.tubActual.diam = te.diam;
  dibujar(); actualizarEstado();
}

function retomarTuberia() {
  const abiertos = [];
  if (estado.elementos.length > 0) abiertos.push({ id: 'principal', nombre: 'Línea Principal', pos: { ...estado.posActual }, dir: estado.dirActual ? { ...estado.dirActual } : null, diam: estado.tubActual.diam });
  estado.ramalesTes.forEach(t => {
    if (t.ramaElementos && t.ramaElementos.length > 0) {
      let posFin = { ...t.pos }, dirFin = t.dirRamal, diamFin = t.diam;
      t.ramaElementos.forEach(el => {
        if (el.tipo === 'tramo') { const d = DIRS[el.dirKey]; posFin = { x: el.inicio.x + d.x * el.largo, y: el.inicio.y + d.y * el.largo, z: el.inicio.z + d.z * el.largo }; dirFin = d; diamFin = el.diam; }
        else if (el.tipo === 'reduccion') { const d = el.dir; posFin = { x: el.pos.x + d.x * el.altura, y: el.pos.y + d.y * el.altura, z: el.pos.z + d.z * el.altura }; diamFin = el.d2; }
      });
      abiertos.push({ id: t.id, nombre: `Ramal T${t.id}`, pos: posFin, dir: dirFin, diam: diamFin });
    } else {
      abiertos.push({ id: t.id, nombre: `Ramal T${t.id} (Libre)`, pos: { ...t.pos }, dir: { ...t.dirRamal }, diam: t.diam });
    }
  });
  if (abiertos.length === 0) { alert('No hay tuberías abiertas.'); return; }
  const selStr = prompt(`¿Qué tubería retomar?\n${abiertos.map((a, i) => `${i+1}. ${a.nombre}`).join('\n')}`, '1');
  if (selStr === null) return;
  const idx = parseInt(selStr) - 1;
  if (isNaN(idx) || idx < 0 || idx >= abiertos.length) return;
  const seleccion = abiertos[idx];
  estado.ramaActivaId = seleccion.id; estado.posActual = { ...seleccion.pos }; estado.dirActual = seleccion.dir; estado.tubActual.diam = seleccion.diam;
  if (seleccion.id !== 'principal') { const te = estado.ramalesTes.find(t => t.id === seleccion.id); if (te) te.usado = true; }
  dibujar(); actualizarEstado();
}

function agregarTramo(dirKeySel) {
  if (estado.requiereNuevoCodo) { alert('Define un nuevo codo.'); return; }
  const largo = parseFloat(prompt(`Medida del tramo ${DIR_LABEL[dirKeySel]} (mm):`, '200'));
  if (isNaN(largo) || largo <= 0) return;
  const texto = prompt('Texto opcional para la tubería (vacío para omitir):', '') || '';

  const dir = DIRS[dirKeySel];
  const targetArr = (estado.ramaActivaId && estado.ramaActivaId !== 'principal') ? estado.ramalesTes.find(t=>t.id===estado.ramaActivaId).ramaElementos : estado.elementos;
  const ultimoElem = targetArr[targetArr.length - 1];
  const dirPreviaKey = (ultimoElem && ultimoElem.tipo === 'tramo') ? ultimoElem.dirKey : dirKey(estado.dirActual);
  
  if (ultimoElem && ultimoElem.tipo === 'tramo' && dirPreviaKey !== dirKeySel) {
    targetArr.push({ tipo: 'codo', diam: estado.codoActual.diam, radio: estado.codoActual.radio, pos: { ...estado.posActual } });
  }
  
  estado.contadorCarretes++;
  targetArr.push({ tipo: 'tramo', num: estado.contadorCarretes, dirKey: dirKeySel, largo, diam: estado.tubActual.diam, texto, inicio: { ...estado.posActual } });
  estado.posActual = { x: estado.posActual.x + dir.x * largo, y: estado.posActual.y + dir.y * largo, z: estado.posActual.z + dir.z * largo };
  estado.dirActual = dir;
  dibujar(); actualizarEstado();
}

function pedirDireccionRamal(mensaje, def) {
  const opc = prompt(`${mensaje}\n1. +Z\n2. -Z\n3. +X\n4. -X\n5. +Y\n6. -Y`, def || '1');
  if (opc === '1') return 'z+'; if (opc === '2') return 'z-'; if (opc === '3') return 'x+'; if (opc === '4') return 'x-'; if (opc === '5') return 'y+'; if (opc === '6') return 'y-'; return null;
}

function agregarTe() {
  if (estado.requiereNuevoCodo) { alert('Primero define un nuevo codo.'); return; }
  const diam = parseFloat(prompt('Ø de la Te (mm):', estado.teActual.diam));
  if (isNaN(diam)) return;
  const texto = prompt('Texto opcional para la Te (vacío para omitir):', '') || '';

  estado.teActual.diam = diam;
  let defOp = '1'; if (estado.dirActual) { if (Math.abs(estado.dirActual.x) > 0.9) defOp = '1'; else if (Math.abs(estado.dirActual.z) > 0.9) defOp = '3'; else defOp = '3'; }
  const dirRamalKey = pedirDireccionRamal('Dirección de salida del ramal:', defOp);
  if (!dirRamalKey) return;
  estado.contadorTes++;
  const idTe = estado.contadorTes;
  const targetArr = (estado.ramaActivaId && estado.ramaActivaId !== 'principal') ? estado.ramalesTes.find(t=>t.id===estado.ramaActivaId).ramaElementos : estado.elementos;
  targetArr.push({ tipo: 'te', id: idTe, diam, texto, pos: { ...estado.posActual }, dir: estado.dirActual ? { ...estado.dirActual } : { x:0,y:0,z:1 } });
  estado.ramalesTes.push({ id: idTe, pos: { ...estado.posActual }, dirPrincipal: estado.dirActual ? { ...estado.dirActual } : { x:0,y:0,z:1 }, dirRamal: DIRS[dirRamalKey], diam, texto, usado: false, ramaElementos: [] });
  dibujar(); actualizarEstado();
}

function editarOrientacionTe() {
  const todasTes = []; const extraer = (arr) => { for (const el of arr) if (el.tipo === 'te') todasTes.push(el.id); };
  extraer(estado.elementos); estado.ramalesTes.forEach(t => extraer(t.ramaElementos));
  if (todasTes.length === 0) { alert('No hay Tes.'); return; }
  const id = parseInt(prompt(`¿Qué Te editar? (${todasTes.join(', ')})`, todasTes[0]));
  const ramal = estado.ramalesTes.find(r => r.id === id); if (!ramal) return;
  const actualKey = dirKey(ramal.dirRamal);
  const defOp = actualKey === 'z+' ? '1' : actualKey === 'z-' ? '2' : actualKey === 'x+' ? '3' : actualKey === 'x-' ? '4' : actualKey === 'y+' ? '5' : '6';
  const nuevaDirKey = pedirDireccionRamal(`Nueva dirección T${id}:`, defOp);
  
  if (nuevaDirKey) {
    ramal.dirRamal = DIRS[nuevaDirKey];
    const nuevoTexto = prompt(`Texto para Te T${id}:`, ramal.texto || '');
    if (nuevoTexto !== null) {
      ramal.texto = nuevoTexto;
      const teElem = estado.elementos.find(e => e.tipo === 'te' && e.id === id);
      if (teElem) teElem.texto = nuevoTexto;
    }
    dibujar(); actualizarEstado();
  }
}

function agregarReduccion() {
  if (estado.requiereNuevoCodo) { alert('Primero define un nuevo codo.'); return; }
  const d1 = parseFloat(prompt('Ø entrada (mm):', estado.tubActual.diam)); if (isNaN(d1)) return;
  const d2 = parseFloat(prompt('Ø salida (mm):', Math.max(20, d1 - 20))); if (isNaN(d2)) return;
  const altura = parseFloat(prompt('Longitud (mm):', '80')); if (isNaN(altura) || altura <= 0) return;
  const texto = prompt('Texto opcional para la reducción (vacío para omitir):', '') || '';

  const dir = estado.dirActual || DIRS['z+'];
  const targetArr = (estado.ramaActivaId && estado.ramaActivaId !== 'principal') ? estado.ramalesTes.find(t=>t.id===estado.ramaActivaId).ramaElementos : estado.elementos;
  targetArr.push({ tipo: 'reduccion', d1, d2, altura, texto, pos: { ...estado.posActual }, dir: { ...dir } });
  estado.posActual = { x: estado.posActual.x + dir.x * altura, y: estado.posActual.y + dir.y * altura, z: estado.posActual.z + dir.z * altura };
  estado.requiereNuevoCodo = true; estado.tubActual.diam = d2;
  dibujar(); actualizarEstado();
  const diam = parseFloat(prompt(`Nuevo codo tras reducción — Ø (mm):`, estado.tubActual.diam)); if (isNaN(diam)) return;
  const radio = parseFloat(prompt(`Nuevo codo — Radio (mm):`, estado.codoActual.radio)); if (isNaN(radio)) return;
  const textoCodo = prompt('Texto opcional para el nuevo codo (vacío para omitir):', '') || '';
  estado.codoActual = { diam, radio, texto: textoCodo }; estado.requiereNuevoCodo = false; actualizarEstado(); dibujar();
}

function deshacer() {
  const targetArr = (estado.ramaActivaId && estado.ramaActivaId !== 'principal') ? estado.ramalesTes.find(t=>t.id===estado.ramaActivaId).ramaElementos : estado.elementos;
  if (targetArr.length === 0) return;
  const ultimo = targetArr.pop();
  if (ultimo.tipo === 'te') { estado.ramalesTes = estado.ramalesTes.filter(t => t.id !== ultimo.id); estado.contadorTes--; }
  if (ultimo.tipo === 'tramo') estado.contadorCarretes--;
  if (ultimo.tipo === 'reduccion') estado.requiereNuevoCodo = false;
  reconstruirPosiciones(); dibujar(); actualizarEstado();
}

function guardarSVG() {
  const w = canvas.width;
  const h = canvas.height;
  const factorHD = 2; 

  const cAux = document.createElement('canvas');
  cAux.width = w * factorHD;
  cAux.height = h * factorHD;
  const ctxAux = cAux.getContext('2d');

  renderizarLienzo(ctxAux, w * factorHD, h * factorHD, factorHD, false);

  const imgData = cAux.toDataURL('image/png');
  const svgContent = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w * factorHD} ${h * factorHD}">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <image href="${imgData}" width="${w * factorHD}" height="${h * factorHD}"/>
</svg>`;

  const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'esquema_tuberia.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('btnGuardarSVG').addEventListener('click', guardarSVG);
