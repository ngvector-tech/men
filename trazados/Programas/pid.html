<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor P&ID - MEN</title>
    <!-- JointJS CSS & JS Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@joint/core@4.1.0/dist/joint.css" />
    <script src="https://cdn.jsdelivr.net/npm/@joint/core@4.1.0/dist/joint.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* Estilos Header Superior */
        #header-nativo {
            background-color: #1a252f;
            color: white;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            width: 100%;
            flex-shrink: 0;
            border-bottom: 2px solid #3498db;
        }
        #header-nativo .logo-text { font-size: 24px; font-weight: 900; color: #3498db; margin-right: 15px; letter-spacing: 1px; }
        #header-nativo .empresa-text { font-size: 13px; font-weight: bold; color: #ecf0f1; margin-right: 20px; }
        #header-nativo .autor-text { font-size: 10px; color: #7f8c8d; }
        
        /* Botones de navegación superior */
        .nav-links { margin-left: auto; display: flex; gap: 8px; }
        .btn-navegacion {
            padding: 5px 10px;
            background: #34495e;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #4e6d8c;
            transition: background 0.2s;
        }
        .btn-navegacion:hover { background: #3498db; }

        /* Barra de Herramientas Principal */
        #toolbar { background: #2c3e50; color: white; padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100; flex-wrap: wrap; flex-shrink: 0; }
        .tool-group { display: flex; align-items: center; gap: 6px; border-right: 1px solid #555; padding-right: 12px; }
        .tool-group:last-child { border-right: none; padding-right: 0; }
        .btn-tool { padding: 6px 10px; background: #3498db; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; transition: background 0.2s; }
        .btn-tool:hover { background: #2980b9; }
        .btn-tool.active { background: #e74c3c; box-shadow: inset 0 3px 5px rgba(0,0,0,0.3); }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; }
        .btn-warning:hover { background: #d68910; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-archivo { background: #8e44ad; }
        .btn-archivo:hover { background: #71368a; }
        .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; cursor: pointer; transition: transform 0.1s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.seleccionado { border: 3px solid #f1c40f; transform: scale(1.2); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        
        .grosor-btn { padding: 4px 8px; background: #34495e; border: 1px solid #555; color: white; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .grosor-btn:hover { background: #e67e22; }
        .grosor-btn.seleccionado { background: #e67e22; border-color: #fff; }

        /* Barra Secundaria de Categorías */
        #barra-categorias {
            background: #34495e;
            color: white;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #2c3e50;
            z-index: 90;
            flex-wrap: wrap;
        }
        .btn-categoria {
            background: #2DB01E;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-categoria:hover, .btn-categoria.active { background: #3498db; border-color: #2980b9; }
        #input-buscador {
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            width: 200px;
        }

        /* Área Central Lienzo */
        #main { display: flex; flex: 1; width: 100%; overflow: hidden; position: relative; }
        #lienzo { flex: 1; background: #f9f9f9; position: relative; overflow: hidden; cursor: default; height: 100%; transition: background 0.3s; }
        #lienzo.sin-rejilla { background: white; }

        /* Modal Símbolos */
        #modal-simbolos {
            position: absolute;
            top: 100px;
            left: 50px;
            width: 400px;
            height: 400px;
            min-width: 250px;
            min-height: 200px;
            background: white;
            border: 2px solid #3498db;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            z-index: 1000;
            resize: both;
            overflow: hidden;
        }
        #modal-header {
            background: #3498db;
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            cursor: move;
        }
        #modal-header span { font-size: 14px; }
        #modal-header button {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        #modal-contenido {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .simbolo-card {
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .simbolo-card:hover { border-color: #3498db; background: #f1f2f6; transform: scale(1.05); }
        .simbolo-card img { width: 80px; height: 60px; object-fit: contain; pointer-events: none; }
        .simbolo-card span { font-size: 11px; font-weight: bold; color: #333; text-align: center; line-height: 1.2; }

        /* Menú Contextual */
        #menu-contextual { position: absolute; display: none; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); border-radius: 4px; z-index: 2000; padding: 5px 0; min-width: 180px; }
        #menu-contextual > div { padding: 8px 15px; cursor: pointer; font-size: 13px; color: #333; display: flex; align-items: center; gap: 8px; }
        #menu-contextual > div:hover { background-color: #f1f2f6; color: #3498db; }
        .menu-colores { display: flex; gap: 5px; padding: 8px 15px; border-top: 1px solid #eee; flex-wrap: wrap; width: 140px; }
        .menu-colores .color-btn { width: 20px; height: 20px; border: 2px solid #ccc; }

        #caja-impresion { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; }
        #caja-impresion svg { width: 100% !important; height: 100% !important; }

        /* Visibilidad y Estilos de Puertos SVG en Pantalla */
        .joint-port {
            opacity: 0.75;
            transition: opacity 0.2s, transform 0.2s;
        }
        .joint-port:hover, .joint-element:hover .joint-port {
            opacity: 1;
        }
        .joint-port circle {
            fill: #3498db !important;
            stroke: #ffffff !important;
            stroke-width: 1.5px !important;
            cursor: crosshair !important;
            r: 5px !important;
        }
        .joint-port circle:hover {
            fill: #e74c3c !important;
            r: 7px !important;
        }

        /* Tiradores/Nodos Discretos para las Líneas */
        .joint-link-tools, .joint-tool-segments, .joint-tools, .joint-tools-layer {
            z-index: 999 !important;
        }
        .joint-link-tools .handle,
        .joint-tool-segments .handle,
        .joint-tools .handle,
        .joint-link-tools circle,
        .joint-tool-segments circle,
        .joint-tools circle {
            r: 3.5px !important;
            fill: #3498db !important;
            stroke: #ffffff !important;
            stroke-width: 1.5px !important;
            cursor: pointer !important;
            transition: transform 0.15s ease, fill 0.15s ease;
        }
        .joint-link-tools circle:hover,
        .joint-tool-segments circle:hover,
        .joint-tools circle:hover {
            fill: #e74c3c !important;
            transform: scale(1.4);
        }

        /* Reglas de Impresión Estrictas */
        @media print {
            @page { size: landscape; margin: 0; }
            html, body { width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; background: white !important; }
            body * { visibility: hidden !important; }
            #caja-impresion, #caja-impresion * { visibility: visible !important; }
            #caja-impresion {
                display: flex !important;
                align-items: center;
                justify-content: center;
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                z-index: 99999 !important;
            }
            .joint-port, .joint-tools, .joint-link-tools, .joint-tool-segments, .joint-grid {
                display: none !important;
                visibility: hidden !important;
            }
        }

        @media (max-width: 768px) {
            .btn-tool { padding: 5px 8px; font-size: 11px; }
            .color-btn { width: 18px; height: 18px; }
            #modal-simbolos { width: 90%; left: 5%; top: 150px; }
            #input-buscador { width: 100px; }
            #barra-categorias { gap: 5px; padding: 5px; }
            .btn-categoria { padding: 4px 8px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div id="header-nativo">
        <span class="logo-text">MEN</span>
        <span class="empresa-text">Montajes Industriales S. L.</span>
        <span class="autor-text">Creado por: J.N.G</span>
        <div class="nav-links">
            <a href="isometrico.html" class="btn-navegacion">📐 Isométrico</a>
            <a href="editor puertos pid.html" class="btn-navegacion">🔌 Editor Puertos P&ID</a>
        </div>
    </div>

    <div id="toolbar">
        <!-- Grupo Archivo: Nuevo, Abrir, Guardar y Guardar Como -->
        <div class="tool-group">
            <button class="btn-tool btn-archivo" style="background: #27ae60;" onclick="nuevoProyecto()">📄 Nuevo</button>
            <button class="btn-tool btn-archivo" onclick="abrirProyecto()">📂 Abrir</button>
            <button class="btn-tool btn-archivo" onclick="guardarProyecto()">💾 Guardar</button>
            <button class="btn-tool btn-archivo" onclick="guardarComoProyecto()">💾 Guardar como...</button>
            <input type="file" id="input-archivo" accept=".json,.pid" style="display: none;" onchange="cargarArchivoProyecto(event)">
        </div>

        <div class="tool-group">
            <button class="btn-tool btn-danger" onclick="eliminarSeleccionado()">🗑️ Borrar</button>
            <button class="btn-tool btn-warning" onclick="rotar90()">🔄 Girar 90°</button>
            <button class="btn-tool" onclick="prepararImpresion()" style="background: #16a085;">🖨️ Guardar / Imprimir PDF</button>
        </div>
        
        <div class="tool-group">
            <span style="font-size: 11px; font-weight: bold; opacity: 0.8;">Color:</span>
            <div class="color-btn seleccionado" style="background: #000;" onclick="setColor('#000', this)"></div>
            <div class="color-btn" style="background: #e74c3c;" onclick="setColor('#e74c3c', this)"></div>
            <div class="color-btn" style="background: #3498db;" onclick="setColor('#3498db', this)"></div>
            <div class="color-btn" style="background: #2ecc71;" onclick="setColor('#2ecc71', this)"></div>
            <div class="color-btn" style="background: #e67e22;" onclick="setColor('#e67e22', this)"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="setColor('#9b59b6', this)"></div>
            <div class="color-btn" style="background: #f1c40f;" onclick="setColor('#f1c40f', this)"></div>
            <div class="color-btn" style="background: #7f8c8d;" onclick="setColor('#7f8c8d', this)"></div>
        </div>

        <div class="tool-group">
            <span style="font-size: 11px; font-weight: bold; opacity: 0.8;">Grosor:</span>
            <div class="grosor-btn" onclick="setGrosor(1, this)">1px</div>
            <div class="grosor-btn seleccionado" onclick="setGrosor(2, this)">2px</div>
            <div class="grosor-btn" onclick="setGrosor(4, this)">4px</div>
            <div class="grosor-btn" onclick="setGrosor(6, this)">6px</div>
            <div class="grosor-btn" onclick="setGrosor(8, this)">8px</div>
        </div>

        <div class="tool-group">
            <button class="btn-tool" id="btn-linea" onclick="toggleLinea()">📐 Línea Ortogonal</button>
            <button class="btn-tool" id="btn-texto" onclick="toggleTexto()">📝 Añadir Texto</button>
            <button class="btn-tool btn-success" onclick="toggleNombreSimbolo()">🏷️ Nombre Símbolo</button>
        </div>
        <div class="tool-group">
            <button class="btn-tool" style="background: #27ae60;" onclick="centrarDibujo()">🎯 Centrar Dibujo</button>
            <button class="btn-tool" style="background: #8e44ad;" onclick="toggleRejilla(this)" id="btn-rejilla">📐 Rejilla ON</button>
        </div>
    </div>

    <div id="barra-categorias">
        <span style="font-size: 11px; font-weight: bold; opacity: 0.8;">Biblioteca:</span>
        <div id="botones-categorias" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
        
        <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
            <input type="text" id="input-buscador" placeholder="🔍 Buscar..." oninput="buscarSimbolos()">
        </div>
    </div>

    <div id="main">
        <div id="lienzo"></div>
    </div>

    <div id="modal-simbolos">
        <div id="modal-header">
            <span id="modal-titulo">Símbolos</span>
            <button onclick="cerrarModal()">✖</button>
        </div>
        <div id="modal-contenido"></div>
    </div>

    <div id="menu-contextual">
        <div onclick="copiarElemento(event)">📄 Copiar</div>
        <div onclick="pegarElemento(event)">📋 Pegar</div>
        <div id="menu-editar" onclick="editarTextoMenu(event)" style="display:none; border-top: 1px solid #eee;">✏️ Editar Texto</div>
        <div id="menu-paleta" class="menu-colores" style="display:none;">
            <div class="color-btn" style="background: #000;" onclick="setColorMenu('#000', event)"></div>
            <div class="color-btn" style="background: #e74c3c;" onclick="setColorMenu('#e74c3c', event)"></div>
            <div class="color-btn" style="background: #3498db;" onclick="setColorMenu('#3498db', event)"></div>
            <div class="color-btn" style="background: #2ecc71;" onclick="setColorMenu('#2ecc71', event)"></div>
            <div class="color-btn" style="background: #e67e22;" onclick="setColorMenu('#e67e22', event)"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="setColorMenu('#9b59b6', event)"></div>
            <div class="color-btn" style="background: #f1c40f;" onclick="setColorMenu('#f1c40f', event)"></div>
            <div class="color-btn" style="background: #7f8c8d;" onclick="setColorMenu('#7f8c8d', event)"></div>
            <div class="color-btn" style="background: #795548;" onclick="setColorMenu('#795548', event)"></div>
        </div>
    </div>

    <div id="caja-impresion"></div>

    <script>
        const graph = new joint.dia.Graph({}, { cellNamespace: joint.shapes });
        let currentScale = 1;
        let grosorActual = 2; 
        let rejillaActiva = true;
        let catalogoGlobal = {};
        
        let cambiosSinGuardar = false;
        let archivoHandleActual = null;

        graph.on('all', function(eventName) {
            if (eventName.startsWith('add') || eventName.startsWith('remove') || eventName.startsWith('change')) {
                cambiosSinGuardar = true;
            }
        });

        window.addEventListener('beforeunload', function (e) {
            if (cambiosSinGuardar && graph.getCells().length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        const configuracionRouter = {
            name: 'manhattan',
            args: {
                step: 10,
                padding: 20,
                maxDirections: 4,
                startDirections: ['top', 'bottom', 'left', 'right'],
                endDirections: ['top', 'bottom', 'left', 'right']
            }
        };

        const paper = new joint.dia.Paper({
            el: document.getElementById('lienzo'), 
            model: graph, 
            width: '100%', height: '100%',
            gridSize: 10, 
            drawGrid: true, 
            cellViewNamespace: joint.shapes,
            interactive: {
                linkMove: true,
                labelMove: false,
                arrowheadMove: true,
                vertexMove: true,
                vertexAdd: true,
                vertexRemove: true,
                useLinkTools: false
            },
            magnetThreshold: 'onleave',
            linkPinning: false, 
            snapLinks: { radius: 25 }, 
            sortViews: true, 
            elementView: joint.dia.ElementView.extend({
                renderMarkup: function() {
                    joint.dia.ElementView.prototype.renderMarkup.apply(this, arguments);
                    this.el.style.overflow = 'visible';
                }
            }),
            defaultLink: new joint.shapes.standard.Link({
                router: configuracionRouter,
                connector: { name: 'jumpover', args: { size: 10 } },
                attrs: { 
                    line: { 
                        stroke: '#000', 
                        strokeWidth: 2, 
                        targetMarker: null 
                    } 
                }
            })
        });

        paper.on('element:pointerup', function(elementView) {
            if (rejillaActiva) {
                const model = elementView.model;
                const pos = model.position();
                const snappedX = Math.round(pos.x / 10) * 10;
                const snappedY = Math.round(pos.y / 10) * 10;
                model.position(snappedX, snappedY);
            }
        });

        let portapapeles = null;
        let elementoBajoClicDerecho = null;
        let colorActual = '#000000';
        let modoLinea = false;
        let modoTexto = false;
        let lineaEnCurso = null;
        let puntosLinea = [];
        let ultimoClicTiempo = 0;
        let elementoClicAnterior = null;

        const CustomImageShape = joint.dia.Element.define('custom.ImageShape', {
            size: { width: 100, height: 60 },
            attrs: {
                body: { refWidth: '100%', refHeight: '100%', fill: 'transparent', stroke: 'none' },
                image: { refWidth: '100%', refHeight: '100%', 'xlink:href': '' }
            },
            ports: {
                groups: {
                    port: { 
                        position: { name: 'absolute' }, 
                        attrs: { 
                            circle: { 
                                r: 5, 
                                magnet: true, 
                                stroke: '#ffffff', 
                                strokeWidth: 1.5, 
                                fill: '#3498db', 
                                cursor: 'crosshair' 
                            } 
                        } 
                    }
                },
                items: []
            }
        }, {
            markup: [
                { tagName: 'rect', selector: 'body' },
                { tagName: 'image', selector: 'image' }
            ]
        });

        let configPuertos = {};

        async function cargarConfigPuertos() {
            const urlSinCache = './config_puertos.json?t=' + new Date().getTime();
            try {
                const res = await fetch(urlSinCache);
                if (res.ok) {
                    configPuertos = await res.json();
                }
            } catch (e) { 
                setTimeout(cargarConfigPuertos, 1000);
            }
        }
        cargarConfigPuertos();

        async function cargarPaleta() {
            try {
                const res = await fetch('./catalogo.json?t=' + new Date().getTime());
                catalogoGlobal = await res.json();
                
                const contenedorBotones = document.getElementById('botones-categorias');
                contenedorBotones.innerHTML = '';

                const categoriasOrdenadas = Object.keys(catalogoGlobal).sort((a, b) => a.localeCompare(b));

                categoriasOrdenadas.forEach(categoria => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-categoria';
                    btn.innerText = categoria;
                    btn.onclick = () => abrirCategoria(categoria, btn);
                    contenedorBotones.appendChild(btn);
                });
            } catch (error) { 
                console.error("Error catálogo:", error);
            }
        }

        function abrirCategoria(categoria, btn) {
            document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const modal = document.getElementById('modal-simbolos');
            const titulo = document.getElementById('modal-titulo');
            const contenido = document.getElementById('modal-contenido');

            titulo.innerText = categoria;
            contenido.innerHTML = '';

            const simbolos = catalogoGlobal[categoria] || [];

            simbolos.forEach(archivo => {
                const card = document.createElement('div');
                card.className = 'simbolo-card';
                card.innerHTML = `<img src="${archivo.ruta}"><span>${archivo.nombre}</span>`;
                
                card.onclick = () => {
                    insertarSimboloEnCentro(archivo.ruta, archivo.nombre);
                    cerrarModal();
                };
                contenido.appendChild(card);
            });

            modal.style.display = 'flex';
        }

        function buscarSimbolos() {
            const termino = document.getElementById('input-buscador').value.toLowerCase().trim();
            const modal = document.getElementById('modal-simbolos');
            const titulo = document.getElementById('modal-titulo');
            const contenido = document.getElementById('modal-contenido');

            if (termino === '') { cerrarModal(); return; }

            titulo.innerText = `Resultados: "${termino}"`;
            contenido.innerHTML = '';
            
            let encontrados = 0;
            Object.keys(catalogoGlobal).forEach(categoria => {
                catalogoGlobal[categoria].forEach(archivo => {
                    if (archivo.nombre.toLowerCase().includes(termino)) {
                        encontrados++;
                        const card = document.createElement('div');
                        card.className = 'simbolo-card';
                        card.innerHTML = `<img src="${archivo.ruta}"><span>${archivo.nombre}</span>`;
                        card.onclick = () => {
                            insertarSimboloEnCentro(archivo.ruta, archivo.nombre);
                            cerrarModal();
                        };
                        contenido.appendChild(card);
                    }
                });
            });

            if (encontrados === 0) {
                contenido.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#999;">No se encontraron símbolos.</p>';
            }
            modal.style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-simbolos').style.display = 'none';
            document.getElementById('input-buscador').value = '';
            document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('active'));
        }

        async function procesarImagenSVG(ruta) {
            const res = await fetch(ruta);
            const svgTexto = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgTexto, "image/svg+xml");
            const svgElement = doc.querySelector('svg');
            
            if (svgElement.getAttribute('fill') === '#fff' || svgElement.getAttribute('fill') === '#ffffff') {
                svgElement.setAttribute('fill', 'none');
            }
            svgElement.querySelectorAll('rect[fill="#fff"], rect[fill="#ffffff"]').forEach(f => f.setAttribute('fill', 'none'));

            let minX = 0, minY = 0, anchoReal = 100, altoReal = 60;
            const viewBox = svgElement.getAttribute('viewBox');
            if (viewBox) {
                const partes = viewBox.trim().split(/\s+/);
                if (partes.length === 4) {
                    minX = parseFloat(partes[0]);
                    minY = parseFloat(partes[1]);
                    anchoReal = parseFloat(partes[2]);
                    altoReal = parseFloat(partes[3]);
                }
            }

            svgElement.setAttribute('width', anchoReal);
            svgElement.setAttribute('height', altoReal);
            svgElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');

            const svgLimpio = new XMLSerializer().serializeToString(svgElement);
            const blob = new Blob([svgLimpio], {type: 'image/svg+xml'});
            return {
                url: URL.createObjectURL(blob),
                minX, minY, anchoReal, altoReal
            };
        }

        async function insertarSimboloEnCentro(ruta, nombreMostrado) {
            const rect = document.getElementById('lienzo').getBoundingClientRect();
            const localPoint = paper.clientToLocalPoint({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });

            const nombreArchivo = ruta.split('/').pop().replace('.svg', '');
            const nombreBusqueda = nombreArchivo.toLowerCase().replace(/\s+/g, '_').normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            try {
                const datosSvg = await procesarImagenSVG(ruta);
                const escala = 2; 
                const targetWidth = datosSvg.anchoReal * escala;
                const targetHeight = datosSvg.altoReal * escala;

                let puertosItems = [];
                let claveEncontrada = null;
                for (const clave in configPuertos) {
                    if (clave.replace(/\s+/g, '_').toLowerCase() === nombreBusqueda) {
                        claveEncontrada = clave;
                        break;
                    }
                }

                if (claveEncontrada) {
                    puertosItems = configPuertos[claveEncontrada].map(p => {
                        return {
                            group: 'port',
                            id: p.id,
                            args: { 
                                x: (p.x - datosSvg.minX) * escala, 
                                y: (p.y - datosSvg.minY) * escala 
                            }
                        };
                    });
                } else {
                    puertosItems = [
                        { group: 'port', id: 'p_left', args: { x: 0, y: targetHeight / 2 } },
                        { group: 'port', id: 'p_right', args: { x: targetWidth, y: targetHeight / 2 } }
                    ];
                }

                const elemento = new CustomImageShape();
                const posX = Math.round((localPoint.x - (targetWidth/2)) / 10) * 10;
                const posY = Math.round((localPoint.y - (targetHeight/2)) / 10) * 10;
                elemento.position(posX, posY);
                elemento.resize(targetWidth, targetHeight);
                
                elemento.attr('image/xlink:href', datosSvg.url);
                elemento.prop('ports/items', puertosItems);
                
                elemento.set('rutaOriginal', ruta);
                elemento.set('simboloNombre', nombreBusqueda);
                elemento.set('simboloLabel', nombreMostrado);
                elemento.set('mostrarNombre', false);
                elemento.set('anchoReal', datosSvg.anchoReal);
                elemento.set('altoReal', datosSvg.altoReal);
                elemento.addTo(graph);
            } catch (err) {
                console.error("Error al cargar SVG: ", err);
            }
        }

        async function guardarComoProyecto() {
            const data = JSON.stringify(graph.toJSON(), null, 2);
            
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'esquema_PID.pid.json',
                        types: [{
                            description: 'Archivo P&ID (*.pid.json)',
                            accept: { 'application/json': ['.json', '.pid.json'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(data);
                    await writable.close();
                    archivoHandleActual = handle;
                    cambiosSinGuardar = false;
                    alert("Proyecto guardado correctamente.");
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    console.warn("Fallo al usar showSaveFilePicker, recurriendo a descarga clásica:", err);
                }
            }

            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'esquema_PID.pid.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            cambiosSinGuardar = false;
        }

        function cargarArchivoProyecto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    graph.fromJSON(json);
                    
                    const elementos = graph.getElements();
                    for (const el of elementos) {
                        const ruta = el.get('rutaOriginal');
                        if (ruta) {
                            try {
                                const datosSvg = await procesarImagenSVG(ruta);
                                el.attr('image/xlink:href', datosSvg.url);
                            } catch (err) {
                                console.error("No se pudo volver a cargar la imagen SVG desde:", ruta, err);
                            }
                        }

                        const etiquetaId = el.get('etiquetaId');
                        if (etiquetaId) {
                            const etiqueta = graph.getCell(etiquetaId);
                            if (etiqueta) {
                                etiqueta.listenTo(el, 'change:position', function() {
                                    const p = el.position();
                                    const t = el.size();
                                    etiqueta.position(p.x + (t.width / 2) - 100, p.y + t.height + 6);
                                });
                            }
                        }
                    }

                    centrarDibujo();
                    cambiosSinGuardar = false;
                    archivoHandleActual = null;
                    alert("Proyecto cargado con éxito.");
                } catch (err) {
                    alert("Error al leer el archivo. Asegúrate de que sea un JSON de P&ID válido.");
                    console.error(err);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function actualizarRutaOrtogonalManual(destino) {
            if (!lineaEnCurso || puntosLinea.length === 0) return;

            const vertices = [];
            for (let i = 1; i < puntosLinea.length; i++) {
                const anterior = puntosLinea[i - 1];
                const actual = puntosLinea[i];
                vertices.push({ x: Math.round(actual.x / 10) * 10, y: Math.round(anterior.y / 10) * 10 });
                vertices.push({ x: Math.round(actual.x / 10) * 10, y: Math.round(actual.y / 10) * 10 });
            }

            const ultimo = puntosLinea[puntosLinea.length - 1];

            if (destino) {
                vertices.push({ x: Math.round(destino.x / 10) * 10, y: Math.round(ultimo.y / 10) * 10 });
                lineaEnCurso.target({ x: Math.round(destino.x / 10) * 10, y: Math.round(destino.y / 10) * 10 });
            } else {
                lineaEnCurso.target({ x: Math.round(ultimo.x / 10) * 10, y: Math.round(ultimo.y / 10) * 10 });
            }

            lineaEnCurso.vertices(vertices);
        }

            const elementoSeleccionado = paper.model.getElements().find(el => el.get('selected'));
            if (!elementoSeleccionado) return alert("Selecciona un símbolo primero.");
            let estadoActual = elementoSeleccionado.get('mostrarNombre') || false;
            estadoActual = !estadoActual; elementoSeleccionado.set('mostrarNombre', estadoActual);
            const etiquetaId = elementoSeleccionado.get('etiquetaId');
            if (estadoActual) {
                if (etiquetaId) { const viejaEtiqueta = graph.getCell(etiquetaId); if (viejaEtiqueta) viejaEtiqueta.remove(); }
                const nombreLabel = elementoSeleccionado.get('simboloLabel') || "Símbolo";
                const pos = elementoSeleccionado.position(); const tam = elementoSeleccionado.size();
                const etiqueta = new joint.shapes.standard.Rectangle();
                etiqueta.position(pos.x + (tam.width / 2) - 100, pos.y + tam.height + 6); etiqueta.resize(200, 24);
                etiqueta.attr({ body: { fill: 'transparent', stroke: 'none' }, label: { text: nombreLabel, fontSize: 11, fontWeight: 'bold', fill: colorActual, textAnchor: 'middle', textVerticalAnchor: 'middle' } });
                etiqueta.addTo(graph);
                etiqueta.listenTo(elementoSeleccionado, 'change:position', function() { const p = elementoSeleccionado.position(); const t = elementoSeleccionado.size(); etiqueta.position(p.x + (t.width / 2) - 100, p.y + t.height + 6); });
                elementoSeleccionado.set('etiquetaId', etiqueta.id);
            } else {
                if (etiquetaId) { const etiquetaExistente = graph.getCell(etiquetaId); if (etiquetaExistente) etiquetaExistente.remove(); elementoSeleccionado.unset('etiquetaId'); }
            }
        };

// Hacer la ventana modal movible y redimensionable por los bordes
(function configurarModalInteractivo() {
    const modal = document.getElementById('modal-simbolos');
    const header = document.getElementById('modal-header');

    // 1. Mover la ventana desde el header
    let isDragging = false, startX, startY, initialLeft, initialTop;

    header.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = modal.offsetLeft;
        initialTop = modal.offsetTop;
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    });

    function onMouseMove(e) {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        modal.style.left = `${initialLeft + dx}px`;
        modal.style.top = `${initialTop + dy}px`;
    }

    function onMouseUp() {
        isDragging = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
    }

    // 2. Redimensionar desde los bordes (Detectando proximidad al borde inferior/derecho/esquina)
    let isResizing = false, resizeDir = '', startW, startH, startClientX, startClientY;
    const borderThreshold = 10; // Margen en píxeles para detectar el borde

    modal.addEventListener('mousemove', (e) => {
        if (isResizing) return;
        const rect = modal.getBoundingClientRect();
        const edgeRight = rect.right - e.clientX;
        const edgeBottom = rect.bottom - e.clientY;

        if (edgeRight < borderThreshold && edgeBottom < borderThreshold) {
            modal.style.cursor = 'se-resize';
            resizeDir = 'se';
        } else if (edgeRight < borderThreshold) {
            modal.style.cursor = 'e-resize';
            resizeDir = 'e';
        } else if (edgeBottom < borderThreshold) {
            modal.style.cursor = 's-resize';
            resizeDir = 's';
        } else {
            modal.style.cursor = 'default';
            resizeDir = '';
        }
    });

    modal.addEventListener('mousedown', (e) => {
        if (!resizeDir) return;
        isResizing = true;
        startClientX = e.clientX;
        startClientY = e.clientY;
        startW = modal.offsetWidth;
        startH = modal.offsetHeight;

        document.addEventListener('mousemove', onResizeMove);
        document.addEventListener('mouseup', onResizeUp);
        e.preventDefault();
    });

    function onResizeMove(e) {
        if (!isResizing) return;
        const dx = e.clientX - startClientX;
        const dy = e.clientY - startClientY;

        if (resizeDir === 'se' || resizeDir === 'e') {
            modal.style.width = `${Math.max(250, startW + dx)}px`;
        }
        if (resizeDir === 'se' || resizeDir === 's') {
            modal.style.height = `${Math.max(200, startH + dy)}px`;
        }
    }

    function onResizeUp() {
        isResizing = false;
        document.removeEventListener('mousemove', onResizeMove);
        document.removeEventListener('mouseup', onResizeUp);
        modal.style.cursor = 'default';
    }
})();
