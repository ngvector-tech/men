<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor P&ID - MEN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@joint/core@4.1.0/dist/joint.css" />
    <script src="https://cdn.jsdelivr.net/npm/@joint/core@4.1.0/dist/joint.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; font-family: Arial, sans-serif; overflow: hidden; }
        
        #header-nativo {
            background-color: #1a252f; color: white; height: 40px;
            display: flex; align-items: center; padding: 0 15px;
            box-sizing: border-box; width: 100%; flex-shrink: 0;
            border-bottom: 2px solid #3498db;
        }
        #header-nativo .logo-text { font-size: 24px; font-weight: 900; color: #3498db; margin-right: 15px; letter-spacing: 1px; }
        #header-nativo .empresa-text { font-size: 13px; font-weight: bold; color: #ecf0f1; margin-right: 20px; }
        #header-nativo .autor-text { font-size: 10px; color: #7f8c8d; }
        
        .nav-links { margin-left: auto; display: flex; gap: 8px; }
        .btn-navegacion {
            padding: 5px 10px; background: #34495e; color: white;
            text-decoration: none; border-radius: 4px; font-size: 11px;
            font-weight: bold; border: 1px solid #4e6d8c; transition: background 0.2s;
        }
        .btn-navegacion:hover { background: #3498db; }

        #toolbar { background: #2c3e50; color: white; padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100; flex-wrap: wrap; flex-shrink: 0; }
        .tool-group { display: flex; align-items: center; gap: 6px; border-right: 1px solid #555; padding-right: 12px; }
        .tool-group:last-child { border-right: none; padding-right: 0; }
        .btn-tool { padding: 6px 10px; background: #3498db; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; transition: background 0.2s; }
        .btn-tool:hover { background: #2980b9; }
        .btn-tool.active { background: #e74c3c; box-shadow: inset 0 3px 5px rgba(0,0,0,0.3); }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #F58B27; }
        .btn-warning:hover { background: #d68910; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-archivo { background: #8e44ad; }
        .btn-archivo:hover { background: #71368a; }
        .btn-pid { background: #8e44ad; }
        .btn-pid:hover { background: #71368a; }
        .btn-sombreado { background: #16a085; }
        .btn-sombreado:hover { background: #117a65; }
        
        .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; cursor: pointer; transition: transform 0.1s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.seleccionado { border: 3px solid #f1c40f; transform: scale(1.2); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        
        .grosor-btn { padding: 4px 8px; background: #34495e; border: 1px solid #555; color: white; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .grosor-btn:hover { background: #e67e22; }
        .grosor-btn.seleccionado { background: #e67e22 !important; border-color: #fff !important; }
        .grosor-btn.grosor-tuberia { background: linear-gradient(135deg, #16a085, #2c3e50); border: 1px solid #1abc9c; }
        .grosor-btn.grosor-tuberia:hover { background: linear-gradient(135deg, #1abc9c, #34495e); }

        #main { display: flex; flex: 1; width: 100%; overflow: hidden; position: relative; }
        #lienzo { flex: 1; background: #f9f9f9; position: relative; overflow: hidden; cursor: default; height: 100%; transition: background 0.3s; }
        #lienzo.sin-rejilla { background: white; }

        /* --- MODAL SÍMBOLOS --- */
        #modal-simbolos {
            position: absolute; top: 100px; left: 50px;
            width: 500px; height: 480px;
            min-width: 300px; min-height: 250px;
            background: white; border: 2px solid #3498db;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none; flex-direction: column;
            z-index: 1000; 
            resize: both;
            overflow: hidden;
        }
        #modal-simbolos.modo-sombreado { border-color: #16a085; }

        #modal-header {
            background: #3498db; color: white; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; border-top-left-radius: 6px; border-top-right-radius: 6px;
            cursor: grab; flex-shrink: 0; user-select: none;
        }
        #modal-header:active { cursor: grabbing; }
        #modal-simbolos.modo-sombreado #modal-header { background: #16a085; }
        #modal-header span { font-size: 14px; }
        #modal-header button {
            background: transparent; border: none; color: white;
            font-size: 18px; cursor: pointer; font-weight: bold;
        }

        #modal-toolbar {
            background: #2c3e50; padding: 8px 10px;
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0;
        }
        #modal-simbolos.modo-sombreado #modal-toolbar { background: #0e6655; }
        
        #modal-toolbar select {
            padding: 4px 8px; font-size: 12px; border-radius: 4px;
            border: 1px solid #555; background: #34495e; color: #fff;
            font-weight: bold; cursor: pointer; outline: none;
        }
        #modal-simbolos.modo-sombreado #modal-toolbar select { background: #1abc9c; border-color: #1abc9c; }
        
        #modal-buscador {
            padding: 4px 8px; font-size: 12px; flex: 1;
            border-radius: 4px; border: 1px solid #ccc;
        }

        #modal-contenido {
            padding: 15px; overflow-y: auto; flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .simbolo-card {
            border: 1px solid #eee; padding: 10px; border-radius: 4px;
            background: #fff; cursor: pointer; display: flex;
            flex-direction: column; align-items: center; gap: 5px;
            transition: all 0.2s;
        }
        .simbolo-card:hover { border-color: #3498db; background: #f1f2f6; transform: scale(1.05); }
        #modal-simbolos.modo-sombreado .simbolo-card:hover { border-color: #16a085; background: #e8f8f5; }
        .simbolo-card img { width: 80px; height: 60px; object-fit: contain; pointer-events: none; }
        .simbolo-card span { font-size: 11px; font-weight: bold; color: #333; text-align: center; line-height: 1.2; }

        .resize-handle {
            position: absolute;
            bottom: 0; right: 0;
            width: 16px; height: 16px;
            cursor: se-resize;
            background: linear-gradient(135deg, transparent 50%, #3498db 50%);
            border-bottom-right-radius: 6px;
            z-index: 10;
        }
        #modal-simbolos.modo-sombreado .resize-handle { background: linear-gradient(135deg, transparent 50%, #16a085 50%); }

        #menu-contextual { position: absolute; display: none; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); border-radius: 4px; z-index: 2000; padding: 5px 0; min-width: 180px; }
        #menu-contextual > div { padding: 8px 15px; cursor: pointer; font-size: 13px; color: #333; display: flex; align-items: center; gap: 8px; }
        #menu-contextual > div:hover { background-color: #f1f2f6; color: #3498db; }
        .menu-colores { display: flex; gap: 5px; padding: 8px 15px; border-top: 1px solid #eee; flex-wrap: wrap; width: 140px; }
        .menu-colores .color-btn { width: 20px; height: 20px; border: 2px solid #ccc; }

        #caja-impresion { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; }
        
        #caja-impresion svg { 
            width: 100% !important; 
            height: 100% !important; 
            max-width: 100vw;
            max-height: 100vh;
        }

        .joint-port { opacity: 0.75; transition: opacity 0.2s, transform 0.2s; }
        .joint-port:hover, .joint-element:hover .joint-port { opacity: 1; }
        .joint-port circle { fill: #3498db !important; stroke: #ffffff !important; stroke-width: 1.5px !important; cursor: crosshair !important; r: 5px !important; }
        .joint-port circle:hover { fill: #e74c3c !important; r: 7px !important; }

        .joint-link-tools, .joint-tool-segments, .joint-tools, .joint-tools-layer { z-index: 999 !important; }
        .joint-link-tools .handle, .joint-tool-segments .handle, .joint-tools .handle,
        .joint-link-tools circle, .joint-tool-segments circle, .joint-tools circle {
            r: 3.5px !important; fill: #3498db !important; stroke: #ffffff !important;
            stroke-width: 1.5px !important; cursor: pointer !important;
            transition: transform 0.15s ease, fill 0.15s ease;
        }
        .joint-link-tools circle:hover, .joint-tool-segments circle:hover, .joint-tools circle:hover {
            fill: #e74c3c !important; transform: scale(1.4);
        }

        .joint-element.elemento-seleccionado rect[joint-selector="body"] {
            stroke: #3498db !important; stroke-width: 2px !important; stroke-dasharray: 4 4 !important;
        }

        /* --- REGLAS DE IMPRESIÓN MEJORADAS --- */
        @media print {
            @page { 
                size: landscape; 
                margin: 0; /* Margen 0 para que el SVG ocupe todo y no se desplace */
            }
            html, body { 
                width: 100% !important; 
                height: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                overflow: hidden !important; 
                background: white !important; 
            }
            body * { 
                visibility: hidden !important; 
            }
            #caja-impresion, #caja-impresion * { 
                visibility: visible !important; 
            }
            #caja-impresion {
                display: flex !important; 
                align-items: center; 
                justify-content: center;
                position: fixed !important; 
                left: 0 !important; 
                top: 0 !important;
                width: 100vw !important; 
                height: 100vh !important;
                margin: 0 !important; 
                padding: 0 !important;
                background: white !important; 
                z-index: 99999 !important;
            }
        }

        @media (max-width: 768px) {
            .btn-tool { padding: 5px 8px; font-size: 11px; }
            .color-btn { width: 18px; height: 18px; }
            #modal-simbolos { width: 90%; left: 5%; top: 150px; }
        }
    </style>
</head>
<body>

    <div id="header-nativo">
        <span class="logo-text">MEN</span>
        <span class="empresa-text">Montajes Industriales S. L.</span>
        <span class="autor-text">Creado por: J.N.G</span>
        <div class="nav-links">
            <a href="pid.html" class="btn-navegacion">📶 P&ID</a>
            <a href="isometrico.html" class="btn-navegacion">📶 Isométrico</a>
            <a href="editor puertos pid.html" class="btn-navegacion">📶 Editor Puertos</a>
        </div>
    </div>

    <div id="toolbar">
        <div class="tool-group">
            <button class="btn-tool btn-archivo" onclick="nuevoProyecto()">📄 Nuevo proyecto</button>
            <button class="btn-tool btn-archivo" onclick="abrirProyecto()">📂 Abrir proyecto</button>
            <button class="btn-tool btn-archivo" onclick="guardarProyecto()">💾 Guardar proyecto</button>
            <button class="btn-tool btn-archivo" onclick="guardarComoProyecto()">🖼️ Exportar SVG...</button>
            <button class="btn-tool btn-archivo" onclick="prepararImpresion()">🖨️ Imprimir</button>
            <input type="file" id="input-archivo" accept=".json,.pid" style="display: none;" onchange="cargarArchivoProyecto(event)">
        </div>

        <div class="tool-group">
            <button class="btn-tool btn-pid" onclick="abrirModalPID()" title="Biblioteca P&ID (catalogo.json + svg-procesados)">➕ Símbolo P&ID</button>
            <button class="btn-tool btn-sombreado" onclick="abrirModalSombreados()" title="Biblioteca Sombreados (s_catalogo.json + s-procesados)">🌑 Símbolo Sombreado</button>
        </div>

        <div class="tool-group">
            <button class="btn-tool btn-danger" onclick="eliminarSeleccionado()">🗑️ Borrar</button>
            <button class="btn-tool btn-warning" onclick="rotar90()">🔄 Girar 90°</button>
            <button class="btn-tool btn-warning" onclick="cambiarTamano(1.2)" title="Aumentar tamaño">➕</button>
            <button class="btn-tool btn-warning" onclick="cambiarTamano(0.8)" title="Reducir tamaño">➖</button>
        </div>
        
        <div class="tool-group">
            <span style="font-size: 11px; font-weight: bold; opacity: 0.8;">Color:</span>
            <div class="color-btn seleccionado" style="background: #000;" onclick="setColor('#000', this)"></div>
            <div class="color-btn" style="background: #e74c3c;" onclick="setColor('#e74c3c', this)"></div>
            <div class="color-btn" style="background: #3498db;" onclick="setColor('#3498db', this)"></div>
            <div class="color-btn" style="background: #2ecc71;" onclick="setColor('#2ecc71', this)"></div>
            <div class="color-btn" style="background: #e67e22;" onclick="setColor('#e67e22', this)"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="setColor('#9b59b6', this)"></div>
            <div class="color-btn" style="background: #f1c40f;" onclick="setColor('#f1c40f', this)"></div>
            <div class="color-btn" style="background: #7f8c8d;" onclick="setColor('#7f8c8d', this)"></div>
        </div>

        <div class="tool-group">
            <span style="font-size: 11px; font-weight: bold; opacity: 0.8;">Grosor:</span>
            <div class="grosor-btn" onclick="setGrosor(1, this, false)">1px</div>
            <div class="grosor-btn seleccionado" onclick="setGrosor(2, this, false)">2px</div>
            <div class="grosor-btn" onclick="setGrosor(4, this, false)">4px</div>
            <div class="grosor-btn" onclick="setGrosor(6, this, false)">6px</div>
            <div class="grosor-btn" onclick="setGrosor(8, this, false)">8px</div>
            <div class="grosor-btn" onclick="setGrosor(12, this, false)">12px</div>
            <div class="grosor-btn grosor-tuberia" onclick="setGrosor(8, this, true)">8px 🌫️</div>
            <div class="grosor-btn grosor-tuberia" onclick="setGrosor(12, this, true)">12px 🌫️</div>
            <div class="grosor-btn grosor-tuberia" onclick="setGrosor(16, this, true)">16px 🌫️</div>
            <div class="grosor-btn grosor-tuberia" onclick="setGrosor(20, this, true)">20px 🌫️</div>
        </div>

        <div class="tool-group">
            <button class="btn-tool" id="btn-linea" onclick="toggleLinea()">📐 Dibujar linea libre</button>
            <button class="btn-tool" id="btn-texto" onclick="toggleTexto()">📝 Añadir Texto</button>
            <button class="btn-tool" onclick="toggleNombreSimbolo()">🏷️ Nombre Símbolo</button>
        </div>
        <div class="tool-group">
            <button class="btn-tool" onclick="centrarDibujo()">🎯 Centrar Dibujo</button>
            <button class="btn-tool" onclick="toggleRejilla(this)" id="btn-rejilla">📐 Rejilla ON</button>
        </div>
    </div>

    <div id="main">
        <div id="lienzo"></div>
    </div>

    <!-- Modal Símbolos -->
    <div id="modal-simbolos">
        <div id="modal-header">
            <span id="modal-titulo">Símbolos</span>
            <button onclick="cerrarModal()">✖</button>
        </div>
        
        <div id="modal-toolbar">
            <select id="selectCategoria" onchange="cambiarCategoriaModal(this.value)"></select>
            <input type="text" id="modal-buscador" placeholder="🔍 Buscar..." oninput="filtrarModal()">
        </div>

        <div id="modal-contenido"></div>
        
        <div class="resize-handle"></div>
    </div>

    <div id="menu-contextual">
        <div onclick="copiarElemento(event)">📄 Copiar</div>
        <div onclick="pegarElemento(event)">📋 Pegar</div>
        <div onclick="cambiarTamano(1.2, event)">➕ Aumentar Tamaño</div>
        <div onclick="cambiarTamano(0.8, event)">➖ Reducir Tamaño</div>
        <div id="menu-editar" onclick="editarTextoMenu(event)" style="display:none; border-top: 1px solid #eee;">✏️ Editar Texto</div>
        <div id="menu-paleta" class="menu-colores" style="display:none;">
            <div class="color-btn" style="background: #000;" onclick="setColorMenu('#000', event)"></div>
            <div class="color-btn" style="background: #e74c3c;" onclick="setColorMenu('#e74c3c', event)"></div>
            <div class="color-btn" style="background: #3498db;" onclick="setColorMenu('#3498db', event)"></div>
            <div class="color-btn" style="background: #2ecc71;" onclick="setColorMenu('#2ecc71', event)"></div>
            <div class="color-btn" style="background: #e67e22;" onclick="setColorMenu('#e67e22', event)"></div>
            <div class="color-btn" style="background: #9b59b6;" onclick="setColorMenu('#9b59b6', event)"></div>
            <div class="color-btn" style="background: #f1c40f;" onclick="setColorMenu('#f1c40f', event)"></div>
            <div class="color-btn" style="background: #7f8c8d;" onclick="setColorMenu('#7f8c8d', event)"></div>
            <div class="color-btn" style="background: #795548;" onclick="setColorMenu('#795548', event)"></div>
        </div>
    </div>

    <div id="caja-impresion"></div>

    <script>
        const graph = new joint.dia.Graph({}, { cellNamespace: joint.shapes });
        let currentScale = 1;
        let grosorActual = 2; 
        let esTuberiaDegradada = false;
        let rejillaActiva = true;
        let catalogoGlobal = {};
        let catalogoSombreados = {};
        let colorActual = '#000000';
        let modoModalActual = 'pid';
        let categoriaActivaModal = '';
        
        let cambiosSinGuardar = false;
        let archivoHandleActual = null;

        graph.on('all', function(eventName) {
            if (eventName.startsWith('add') || eventName.startsWith('remove') || eventName.startsWith('change')) {
                cambiosSinGuardar = true;
            }
        });

        window.addEventListener('beforeunload', function (e) {
            if (cambiosSinGuardar && graph.getCells().length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        const configuracionRouter = {
            name: 'manhattan',
            args: {
                step: 10, padding: 20, maxDirections: 4,
                startDirections: ['top', 'bottom', 'left', 'right'],
                endDirections: ['top', 'bottom', 'left', 'right']
            }
        };

        function obtenerStrokeLinea(grosor, colorBase, esDegradado) {
            if (esDegradado) return 'url(#tuberia-gradient)';
            return colorBase;
        }

        const paper = new joint.dia.Paper({
            el: document.getElementById('lienzo'), 
            model: graph, 
            width: '100%', height: '100%',
            gridSize: 10, drawGrid: true, cellViewNamespace: joint.shapes,
            interactive: function(cellView) {
                if (cellView.model.isLink()) {
                    return { linkMove: true, labelMove: false, arrowheadMove: true, vertexMove: true, vertexAdd: true, vertexRemove: true, useLinkTools: false };
                }
                return { elementMove: true };
            },
            magnetThreshold: 'onleave', linkPinning: false, snapLinks: { radius: 25 }, sortViews: true, 
            elementView: joint.dia.ElementView.extend({
                renderMarkup: function() {
                    joint.dia.ElementView.prototype.renderMarkup.apply(this, arguments);
                    this.el.style.overflow = 'visible';
                }
            }),
            defaultLink: new joint.shapes.standard.Link({
                router: configuracionRouter,
                connector: { name: 'jumpover', args: { size: 10 } },
                attrs: { line: { stroke: '#000000', strokeWidth: 2, targetMarker: null } }
            })
        });

        function registrarDegradadoTuberia() {
            const svgDefs = paper.svg.querySelector('defs') || paper.svg.appendChild(
                document.createElementNS('http://www.w3.org/2000/svg', 'defs')
            );
            if (!document.getElementById('tuberia-gradient')) {
                const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradient.setAttribute('id', 'tuberia-gradient');
                gradient.setAttribute('x1', '0%'); gradient.setAttribute('y1', '0%');
                gradient.setAttribute('x2', '0%'); gradient.setAttribute('y2', '100%');
                gradient.innerHTML = `
                    <stop offset="0%" stop-color="#7f8c8d" />
                    <stop offset="35%" stop-color="#bdc3c7" />
                    <stop offset="70%" stop-color="#ecf0f1" />
                    <stop offset="100%" stop-color="#34495e" />
                `;
                svgDefs.appendChild(gradient);
            }
        }
        registrarDegradadoTuberia();

        let portapapeles = null;
        let elementoBajoClicDerecho = null;
        let modoLinea = false;
        let modoTexto = false;
        let lineaEnCurso = null;
        let puntosLinea = [];
        let ultimoClicTiempo = 0;
        let elementoClicAnterior = null;

        const CustomImageShape = joint.dia.Element.define('custom.ImageShape', {
            size: { width: 100, height: 60 },
            attrs: {
                body: { refWidth: '100%', refHeight: '100%', fill: 'transparent', stroke: 'none' },
                image: { refWidth: '100%', refHeight: '100%', 'xlink:href': '' }
            },
            ports: {
                groups: {
                    port: { 
                        position: { name: 'absolute' }, 
                        attrs: { circle: { r: 5, magnet: true, stroke: '#ffffff', strokeWidth: 1.5, fill: '#3498db', cursor: 'crosshair' } } 
                    }
                },
                items: []
            }
        }, {
            markup: [ { tagName: 'rect', selector: 'body' }, { tagName: 'image', selector: 'image' } ]
        });

        let configPuertos = {};
        let configPuertosSombreados = {};

        async function cargarConfigPuertos() {
            try {
                const res = await fetch('./config_puertos.json?t=' + new Date().getTime());
                if (res.ok) configPuertos = await res.json();
                else console.warn('config_puertos.json no encontrado');
            } catch (e) { setTimeout(cargarConfigPuertos, 1000); }
        }
        cargarConfigPuertos();

        async function cargarConfigPuertosSombreados() {
            try {
                const res = await fetch('./s_config_puertos.json?t=' + new Date().getTime());
                if (res.ok) configPuertosSombreados = await res.json();
                else console.warn('s_config_puertos.json no encontrado');
            } catch (e) { setTimeout(cargarConfigPuertosSombreados, 1000); }
        }
        cargarConfigPuertosSombreados();

        async function cargarCatalogoPID() {
            try {
                const res = await fetch('./catalogo.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error('No se pudo cargar catalogo.json');
                catalogoGlobal = await res.json();
            } catch (e) { 
                console.error("Error catálogo P&ID:", e);
                catalogoGlobal = {};
            }
        }

        async function cargarCatalogoSombreados() {
            try {
                const res = await fetch('./s_catalogo.json?t=' + new Date().getTime());

        async function procesarImagenSVG(ruta) {
            const res = await fetch(ruta);
            const svgTexto = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgTexto, "image/svg+xml");
            const svgElement = doc.querySelector('svg');
            
            if (!svgElement) return { dataUri: ruta, minX: 0, minY: 0, anchoReal: 100, altoReal: 60 };

            if (svgElement.getAttribute('fill') === '#fff' || svgElement.getAttribute('fill') === '#ffffff') {
                svgElement.setAttribute('fill', 'none');
            }
            svgElement.querySelectorAll('rect[fill="#fff"], rect[fill="#ffffff"]').forEach(f => f.setAttribute('fill', 'none'));

            let minX = 0, minY = 0, anchoReal = 100, altoReal = 60;
            const viewBox = svgElement.getAttribute('viewBox');
            if (viewBox) {
                const partes = viewBox.trim().split(/[\s,]+/);
                if (partes.length === 4) {
                    minX = parseFloat(partes[0]) || 0;
                    minY = parseFloat(partes[1]) || 0;
                    anchoReal = parseFloat(partes[2]) || 100;
                    altoReal = parseFloat(partes[3]) || 60;
                }
            } else {
                const wAttr = parseFloat(svgElement.getAttribute('width'));
                const hAttr = parseFloat(svgElement.getAttribute('height'));
                if (wAttr && hAttr) { anchoReal = wAttr; altoReal = hAttr; }
                svgElement.setAttribute('viewBox', `0 0 ${anchoReal} ${altoReal}`);
            }
            svgElement.setAttribute('width', anchoReal);
            svgElement.setAttribute('height', altoReal);
            svgElement.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            if (!svgElement.getAttribute('xmlns')) svgElement.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

            const svgLimpio = new XMLSerializer().serializeToString(svgElement);
            const base64Data = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgLimpio)));
            return { dataUri: base64Data, minX, minY, anchoReal, altoReal };
        }

        async function insertarSimboloEnCentro(ruta, nombreMostrado) {
            const rect = document.getElementById('lienzo').getBoundingClientRect();
            const localPoint = paper.clientToLocalPoint({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });
            const nombreArchivo = ruta.split('/').pop().replace('.svg', '');
            const nombreBusqueda = nombreArchivo.toLowerCase().replace(/\s+/g, '_').normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            try {
                const datosSvg = await procesarImagenSVG(ruta);
                const escala = 2;
                const targetWidth = datosSvg.anchoReal * escala;
                const targetHeight = datosSvg.altoReal * escala;

                let puertosItems = [];
                let claveEncontrada = null;
                for (const clave in configPuertos) {
                    if (clave.replace(/\s+/g, '_').toLowerCase() === nombreBusqueda) { claveEncontrada = clave; break; }
                }

                if (claveEncontrada) {
                    puertosItems = configPuertos[claveEncontrada].map(p => ({
                        group: 'port', id: p.id,
                        args: { x: (p.x - datosSvg.minX) * escala, y: (p.y - datosSvg.minY) * escala }
                    }));
                } else {
                    puertosItems = [
                        { group: 'port', id: 'p_left', args: { x: 0, y: targetHeight / 2 } },
                        { group: 'port', id: 'p_right', args: { x: targetWidth, y: targetHeight / 2 } }
                    ];
                }

                const elemento = new CustomImageShape();
                const posX = Math.round((localPoint.x - (targetWidth/2)) / 10) * 10;
                const posY = Math.round((localPoint.y - (targetHeight/2)) / 10) * 10;
                elemento.position(posX, posY);
                elemento.resize(targetWidth, targetHeight);
                elemento.attr('image/xlink:href', datosSvg.dataUri);
                elemento.attr('image/href', datosSvg.dataUri);
                elemento.prop('ports/items', puertosItems);
                elemento.set('rutaOriginal', ruta);
                elemento.set('simboloNombre', nombreBusqueda);
                elemento.set('simboloLabel', nombreMostrado);
                elemento.set('mostrarNombre', false);
                elemento.set('anchoReal', datosSvg.anchoReal);
                elemento.set('altoReal', datosSvg.altoReal);
                elemento.set('esSombreado', false);
                elemento.addTo(graph);
            } catch (err) { console.error("Error al cargar SVG:", err); }
        }

        async function guardarComoProyecto() {
            const bbox = graph.getBBox();
            if (!bbox || bbox.width === 0 || bbox.height === 0) { alert("No hay elementos en el lienzo."); return; }
            const padding = 80;
            const minX = bbox.x - padding, minY = bbox.y - padding;
            const w = bbox.width + padding * 2, h = bbox.height + padding * 2;
            const svgClon = paper.svg.cloneNode(true);
            svgClon.setAttribute('viewBox', `${minX} ${minY} ${w} ${h}`);
            svgClon.setAttribute('width', '100%'); svgClon.setAttribute('height', '100%');
            svgClon.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            svgClon.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            svgClon.querySelectorAll('.joint-grid').forEach(el => el.remove());
            svgClon.querySelectorAll('.joint-port').forEach(el => el.remove());
            svgClon.querySelectorAll('.joint-link-tools, .joint-tools, .joint-tool-segments, .joint-marker-layer').forEach(el => el.remove());
            svgClon.querySelectorAll('.joint-link path').forEach(el => { if (!el.getAttribute('stroke')) el.setAttribute('stroke', '#000'); });
            const rectFondo = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rectFondo.setAttribute('x', minX); rectFondo.setAttribute('y', minY);
            rectFondo.setAttribute('width', w); rectFondo.setAttribute('height', h);
            rectFondo.setAttribute('fill', '#ffffff');
            svgClon.insertBefore(rectFondo, svgClon.firstChild);
            const svgTexto = new XMLSerializer().serializeToString(svgClon);
            const blob = new Blob([svgTexto], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'esquema_PID.svg';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            cambiosSinGuardar = false;
        }

        function cargarArchivoProyecto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    graph.fromJSON(json);
                    const elementos = graph.getElements();
                    for (const el of elementos) {
                        const ruta = el.get('rutaOriginal');
                        if (ruta) {
                            try {
                                const datosSvg = await procesarImagenSVG(ruta);
                                el.attr('image/xlink:href', datosSvg.dataUri);
                                el.attr('image/href', datosSvg.dataUri);
                            } catch (err) { console.error("No se pudo recargar SVG:", ruta, err); }
                        }
                        const etiquetaId = el.get('etiquetaId');
                        if (etiquetaId) {
                            const etiqueta = graph.getCell(etiquetaId);
                            if (etiqueta) {
                                etiqueta.listenTo(el, 'change:position', function() {
                                    const p = el.position(); const t = el.size();
                                    etiqueta.position(p.x + (t.width / 2) - 100, p.y + t.height + 6);
                                });
                            }
                        }
                    }
                    centrarDibujo();
                    cambiosSinGuardar = false;
                    archivoHandleActual = null;
                    alert("Proyecto cargado con éxito.");
                } catch (err) {
                    alert("Error al leer el archivo JSON.");
                    console.error(err);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        document.getElementById('lienzo').addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            let newScale = e.deltaY < 0 ? currentScale * zoomFactor : currentScale / zoomFactor;
            newScale = Math.max(0.2, Math.min(5, newScale)); 
            paper.scale(newScale, newScale, e.offsetX, e.offsetY);
            currentScale = newScale;
        }, { passive: false });

        let isPanning = false, startPanX = 0, startPanY = 0;
        document.getElementById('lienzo').addEventListener('mousedown', (e) => {
            if (e.button === 1 || e.button === 2) { isPanning = true; startPanX = e.clientX; startPanY = e.clientY; e.preventDefault(); }
        });
        document.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            const dx = e.clientX - startPanX; const dy = e.clientY - startPanY;
            startPanX = e.clientX; startPanY = e.clientY;
            const translate = paper.translate();
            paper.translate(translate.tx + dx, translate.ty + dy);
        });
        document.addEventListener('mouseup', () => { isPanning = false; });
        document.getElementById('lienzo').addEventListener('contextmenu', e => e.preventDefault());

            const elementos = graph.getElements();
            if (elementos.length === 0) { paper.scale(1, 1); paper.translate(0, 0); currentScale = 1; return; }
            paper.scaleContentToFit({ padding: 50, minScale: 0.2, maxScale: 2 });
            currentScale = paper.scale().sx;

        // --- FUNCIÓN DE IMPRESIÓN CORREGIDA Y AJUSTADA A LA HOJA ---
        window.prepararImpresion = function() {
            const caja = document.getElementById('caja-impresion'); 
            caja.innerHTML = ''; 
            
            const bbox = graph.getBBox();
            if (!bbox || bbox.width === 0 || bbox.height === 0) { 
                alert("No hay nada que imprimir."); 
                return; 
            }
            
            // Añadimos un margen blanco alrededor del dibujo
            const margen = 40; 
            const anchoTotal = bbox.width + (margen * 2); 
            const altoTotal = bbox.height + (margen * 2);
            
            // Creamos un nuevo SVG desde cero
            const svgImpresion = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            
            // El viewBox enmarca exactamente el dibujo con su margen
            svgImpresion.setAttribute('viewBox', `${bbox.x - margen} ${bbox.y - margen} ${anchoTotal} ${altoTotal}`);
            
            // Forzamos a que ocupe el 100% disponible sin deformarse
            svgImpresion.setAttribute('width', '100%'); 
            svgImpresion.setAttribute('height', '100%'); 
            svgImpresion.setAttribute('preserveAspectRatio', 'xMidYMid meet'); 
            svgImpresion.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            
            // Copiamos las definiciones (gradientes, filtros, etc.)
            const defs = paper.svg.querySelector('defs');
            if (defs) svgImpresion.appendChild(defs.cloneNode(true));

            // Copiamos los elementos del dibujo (capas)
            const viewport = paper.svg.querySelector('.joint-viewport');
            if (viewport) {
                const clonViewport = viewport.cloneNode(true);
                
                // Limpiamos todo lo que no queremos que salga en la impresión
                clonViewport.querySelectorAll('.joint-grid, .joint-port, .joint-link-tools, .joint-tools, .joint-tool-segments, .joint-marker-layer').forEach(el => el.remove());
                
                // Aseguramos que las líneas tengan color visible
                clonViewport.querySelectorAll('.joint-link path').forEach(el => { 
                    if (!el.getAttribute('stroke')) el.setAttribute('stroke', '#000'); 
                });
                
                svgImpresion.appendChild(clonViewport);
            }
            
            // Añadimos un fondo blanco puro para que no salga el fondo gris de la pantalla
            const rectFondo = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rectFondo.setAttribute('x', bbox.x - margen); 
            rectFondo.setAttribute('y', bbox.y - margen);
            rectFondo.setAttribute('width', anchoTotal); 
            rectFondo.setAttribute('height', altoTotal);
            rectFondo.setAttribute('fill', '#ffffff');
            svgImpresion.insertBefore(rectFondo, svgImpresion.firstChild);
            
            // Lo inyectamos en la caja de impresión
            caja.appendChild(svgImpresion);
            
            // Lanzamos la impresión
            setTimeout(() => { 
                window.print(); 
                setTimeout(() => { caja.innerHTML = ''; }, 500); 
            }, 250);
        };

        window.cambiarTamano = function(factor, event) {
            if (event) { event.stopPropagation(); event.preventDefault(); }
            const seleccionado = elementoBajoClicDerecho || paper.model.getElements().find(el => el.get('selected'));
            if (!seleccionado || seleccionado.get('tipo') === 'texto') {
                if (!event) alert("Selecciona un símbolo primero.");
                return;
            }
            const tamanoActual = seleccionado.size();
            const nuevoAncho = Math.max(20, Math.round(tamanoActual.width * factor));
            const nuevoAlto = Math.max(20, Math.round(tamanoActual.height * factor));
            seleccionado.resize(nuevoAncho, nuevoAlto);
            const puertos = seleccionado.prop('ports/items') || [];
            if (puertos.length > 0) {
                const factorX = nuevoAncho / tamanoActual.width;
                const factorY = nuevoAlto / tamanoActual.height;
                seleccionado.prop('ports/items', puertos.map(p => ({ ...p, args: { x: Math.round(p.args.x * factorX), y: Math.round(p.args.y * factorY) } })));
            }
            document.getElementById('menu-contextual').style.display = 'none';
        };

        window.toggleLinea = function() {
            modoLinea = !modoLinea; if (modoLinea) modoTexto = false;
            document.getElementById('btn-linea').classList.toggle('active', modoLinea);
            document.getElementById('btn-texto').classList.remove('active');
            document.getElementById('lienzo').style.cursor = modoLinea ? 'crosshair' : 'default';
            if (!modoLinea && lineaEnCurso) { lineaEnCurso.remove(); lineaEnCurso = null; puntosLinea = []; }
        };

        window.toggleTexto = function() {
            modoTexto = !modoTexto; if (modoTexto) modoLinea = false;
            document.getElementById('btn-texto').classList.toggle('active', modoTexto);
            document.getElementById('btn-linea').classList.remove('active');
            document.getElementById('lienzo').style.cursor = modoTexto ? 'text' : 'default';
        };

        function actualizarRutaOrtogonalManual(destino) {
            if (!lineaEnCurso || puntosLinea.length === 0) return;
            const vertices = [];
            for (let i = 1; i < puntosLinea.length; i++) {
                const anterior = puntosLinea[i - 1];
                const actual = puntosLinea[i];
                vertices.push({ x: Math.round(actual.x / 10) * 10, y: Math.round(anterior.y / 10) * 10 });
                vertices.push({ x: Math.round(actual.x / 10) * 10, y: Math.round(actual.y / 10) * 10 });
            }
            const ultimo = puntosLinea[puntosLinea.length - 1];
            if (destino) {
                vertices.push({ x: Math.round(destino.x / 10) * 10, y: Math.round(ultimo.y / 10) * 10 });
                lineaEnCurso.target({ x: Math.round(destino.x / 10) * 10, y: Math.round(destino.y / 10) * 10 });
            } else {
                lineaEnCurso.target({ x: Math.round(ultimo.x / 10) * 10, y: Math.round(ultimo.y / 10) * 10 });
            }
            lineaEnCurso.vertices(vertices);
        }

        paper.on('blank:pointerdown', function(evt, x, y) {
            const snappedX = Math.round(x / 10) * 10;
            const snappedY = Math.round(y / 10) * 10;
            if (modoTexto) {
                const texto = prompt("Escribe el texto:");
                if (texto && texto.trim() !== '') {
                    const etiqueta = new joint.shapes.standard.TextBlock();
                    etiqueta.position(snappedX, snappedY);
                    etiqueta.resize(Math.max(100, texto.length * 8), 30);
                    etiqueta.attr({ body: { fill: 'transparent', stroke: 'none' }, label: { text: texto, fontSize: 14, fontWeight: 'bold', fill: colorActual } });
                    etiqueta.set('tipo', 'texto');
                    etiqueta.addTo(graph);
                }
                toggleTexto();
                return;
            }
            if (modoLinea) {
                const punto = { x: snappedX, y: snappedY };
                if (!lineaEnCurso) {
                    puntosLinea = [punto];
                    lineaEnCurso = new joint.shapes.standard.Link({
                        source: { x: snappedX, y: snappedY },
                        target: { x: snappedX, y: snappedY },
                        router: configuracionRouter,
                        connector: { name: 'jumpover', args: { size: 10 } },
                        attrs: { line: { stroke: obtenerStrokeLinea(grosorActual, colorActual, esTuberiaDegradada), strokeWidth: grosorActual, targetMarker: null } }
                    });
                    lineaEnCurso.set('esTuberiaDegradada', esTuberiaDegradada);
                    lineaEnCurso.addTo(graph);
                } else {
                    puntosLinea.push(punto);
                    actualizarRutaOrtogonalManual(punto);
                    lineaEnCurso = null;
                    puntosLinea = [];
                    toggleLinea(); 
                }
            }
        });

        paper.on('blank:pointermove', function(evt, x, y) {
            if (modoLinea && lineaEnCurso) actualizarRutaOrtogonalManual({ x: x, y: y });
        });

        paper.on('blank:pointerdblclick', function() { 
            if (modoLinea && lineaEnCurso) { lineaEnCurso = null; puntosLinea = []; toggleLinea(); } 
        });

        window.eliminarSeleccionado = function() {
            const seleccionados = paper.model.getElements().filter(el => el.get('selected'));
            const enlaces = paper.model.getLinks().filter(link => link.get('selected'));
            if (seleccionados.length === 0 && enlaces.length === 0) return;
            seleccionados.forEach(el => { paper.removeTools(); el.remove(); }); 
            enlaces.forEach(link => { paper.removeTools(); link.remove(); });
        };

        window.rotar90 = function() {
            const seleccionado = paper.model.getElements().find(el => el.get('selected'));
            if (!seleccionado || seleccionado.get('tipo') === 'texto') return;

            let anguloActual = seleccionado.angle() || 0;
            let nuevoAngulo = anguloActual + 90;
            
            if (nuevoAngulo >= 360) {
                nuevoAngulo = nuevoAngulo - 360;
            }

            seleccionado.rotate(nuevoAngulo);
            seleccionado.set('angle', nuevoAngulo);
        };

        paper.on('element:pointerdown', function(elementView, evt) {
            if (modoLinea || modoTexto) return;
            const el = elementView.model; const ahora = new Date().getTime();
            if (ahora - ultimoClicTiempo < 300 && elementoClicAnterior === el.id) {
                if (el.get('tipo') === 'texto') {
                    const nuevoTexto = prompt("Editar texto:", el.attr('label/text'));
                    if (nuevoTexto && nuevoTexto.trim() !== '') { el.attr('label/text', nuevoTexto); el.resize(Math.max(100, nuevoTexto.length * 8), 30); }
                }
                ultimoClicTiempo = 0; elementoClicAnterior = null; return;
            }
            ultimoClicTiempo = ahora; elementoClicAnterior = el.id;
            paper.model.getElements().forEach(otherEl => { 
                otherEl.unset('selected'); 
                const v = paper.findViewByModel(otherEl);
                if (v && v.el) v.el.classList.remove('elemento-seleccionado');
                if (otherEl.get('tipo') === 'texto') otherEl.attr('body/stroke', 'none'); 
            });
            paper.model.getLinks().forEach(l => l.unset('selected'));
            paper.removeTools();
            el.set('selected', true);
            if (elementView && elementView.el) elementView.el.classList.add('elemento-seleccionado');
            if (el.get('tipo') === 'texto') { 
                el.attr('body/stroke', '#3498db'); el.attr('body/strokeWidth', 1); el.attr('body/strokeDasharray', '5, 5'); 
            }
        });

        paper.on('link:pointerdown', function(linkView) {
            paper.model.getElements().forEach(el => {
                el.unset('selected');
                const v = paper.findViewByModel(el);
                if (v && v.el) v.el.classList.remove('elemento-seleccionado');
            });
            paper.model.getLinks().forEach(link => link.unset('selected'));
            paper.removeTools();
            const enlace = linkView.model;
            enlace.set('selected', true);
            const herramientas = new joint.dia.ToolsView({
                tools: [
                    new joint.linkTools.Vertices({ snapRadius: 10, redundancyRemoval: true }),
                    new joint.linkTools.Segments({
                        redundancyRemoval: true, segmentLengthThreshold: 10, snapRadius: 10,
                        markup: [{ tagName: 'circle', selector: 'handle', attributes: { 'r': 3.5, 'fill': '#3498db', 'stroke': '#ffffff', 'stroke-width': 1.5, 'cursor': 'pointer' } }]
                    })
                ]
            });
            linkView.addTools(herramientas);
        });

        paper.on('blank:pointerdown', function() {
            if (modoLinea || modoTexto) return;
            paper.model.getElements().forEach(el => { 
                el.unset('selected'); 
                const v = paper.findViewByModel(el);
                if (v && v.el) v.el.classList.remove('elemento-seleccionado');
                if (el.get('tipo') === 'texto') el.attr('body/stroke', 'none'); 
            });
            paper.model.getLinks().forEach(l => l.unset('selected'));
            paper.removeTools();
            document.getElementById('menu-contextual').style.display = 'none';
            ultimoClicTiempo = 0; elementoClicAnterior = null;
        });

        window.addEventListener('keydown', function(e) { if (e.key === 'Delete' || e.key === 'Backspace') { eliminarSeleccionado(); e.preventDefault(); } });

        const menuContextual = document.getElementById('menu-contextual');
        
        document.getElementById('lienzo').addEventListener('contextmenu', function(evt) {
            evt.preventDefault(); evt.stopPropagation();
            const localPoint = paper.clientToLocalPoint({ x: evt.clientX, y: evt.clientY });
            const elementos = paper.model.getElements();
            elementoBajoClicDerecho = null;
            for (let i = elementos.length - 1; i >= 0; i--) {
                const bbox = elementos[i].getBBox();
                if (localPoint.x >= bbox.x && localPoint.x <= bbox.x + bbox.width && localPoint.y >= bbox.y && localPoint.y <= bbox.y + bbox.height) {
                    elementoBajoClicDerecho = elementos[i]; break;
                }
            }
            if (elementoBajoClicDerecho) {
                paper.model.getElements().forEach(el => {
                    el.unset('selected');
                    const v = paper.findViewByModel(el);
                    if (v && v.el) v.el.classList.remove('elemento-seleccionado');
                });
                elementoBajoClicDerecho.set('selected', true);
                const v = paper.findViewByModel(elementoBajoClicDerecho);
                if (v && v.el) v.el.classList.add('elemento-seleccionado');
                document.getElementById('menu-editar').style.display = elementoBajoClicDerecho.get('tipo') === 'texto' ? 'flex' : 'none';
                document.getElementById('menu-paleta').style.display = 'flex';
                menuContextual.style.display = 'block';
                menuContextual.style.left = evt.clientX + 'px'; menuContextual.style.top = evt.clientY + 'px';
                menuContextual.querySelectorAll('div')[0].style.display = 'flex';
                menuContextual.querySelectorAll('div')[1].style.display = portapapeles ? 'flex' : 'none';
            } else {
                elementoBajoClicDerecho = null;
                if (portapapeles) {
                    menuContextual.style.display = 'block';
                    menuContextual.style.left = evt.clientX + 'px'; menuContextual.style.top = evt.clientY + 'px';
                    document.getElementById('menu-editar').style.display = 'none';
                    document.getElementById('menu-paleta').style.display = 'none';
                    menuContextual.querySelectorAll('div')[0].style.display = 'none';
                    menuContextual.querySelectorAll('div')[1].style.display = 'flex';
                } else { menuContextual.style.display = 'none'; }
            }
        });

        paper.on('link:contextmenu', function(linkView, evt) {
            evt.preventDefault(); evt.stopPropagation();
            paper.model.getElements().forEach(el => {
                el.unset('selected');
                const v = paper.findViewByModel(el);
                if (v && v.el) v.el.classList.remove('elemento-seleccionado');
            });
            paper.model.getLinks().forEach(link => link.unset('selected'));
            linkView.model.set('selected', true);
            elementoBajoClicDerecho = linkView.model;
            document.getElementById('menu-editar').style.display = 'none';
            document.getElementById('menu-paleta').style.display = 'flex';
            menuContextual.style.display = 'block';
            menuContextual.style.left = evt.clientX + 'px'; menuContextual.style.top = evt.clientY + 'px';
            menuContextual.querySelectorAll('div')[0].style.display = 'none';
        });

        document.addEventListener('mousedown', function(e) {
            if (e.button === 0 && !menuContextual.contains(e.target)) {
                menuContextual.style.display = 'none';
            }
        });
        
        window.copiarElemento = function(event) { 
            if (event) event.stopPropagation(); if (!elementoBajoClicDerecho) return; 
            portapapeles = elementoBajoClicDerecho.clone(); menuContextual.style.display = 'none'; 
        };
        
        window.pegarElemento = function(event) { 
            if (event) event.stopPropagation(); if (!portapapeles) return; 
            const nuevoElemento = portapapeles.clone(); const pos = nuevoElemento.position(); 
            nuevoElemento.position(Math.round((pos.x + 20) / 10) * 10, Math.round((pos.y + 20) / 10) * 10); 
            nuevoElemento.addTo(graph); 
            nuevoElemento.set('selected', true); portapapeles = nuevoElemento.clone(); menuContextual.style.display = 'none'; 
        };

        window.toggleNombreSimbolo = function() {
            const elementoSeleccionado = paper.model.getElements().find(el => el.get('selected'));
            if (!elementoSeleccionado) return alert("Selecciona un símbolo primero.");
            let estadoActual = elementoSeleccionado.get('mostrarNombre') || false;
            estadoActual = !estadoActual; elementoSeleccionado.set('mostrarNombre', estadoActual);
            const etiquetaId = elementoSeleccionado.get('etiquetaId');
            if (estadoActual) {
                if (etiquetaId) { const viejaEtiqueta = graph.getCell(etiquetaId); if (viejaEtiqueta) viejaEtiqueta.remove(); }
                const nombreLabel = elementoSeleccionado.get('simboloLabel') || "Símbolo";
                const pos = elementoSeleccionado.position(); const tam = elementoSeleccionado.size();
                const etiqueta = new joint.shapes.standard.Rectangle();
                etiqueta.position(pos.x + (tam.width / 2) - 100, pos.y + tam.height + 6); etiqueta.resize(200, 24);
                etiqueta.attr({ body: { fill: 'transparent', stroke: 'none' }, label: { text: nombreLabel, fontSize: 11, fontWeight: 'bold', fill: colorActual, textAnchor: 'middle', textVerticalAnchor: 'middle' } });
                etiqueta.addTo(graph);
                etiqueta.listenTo(elementoSeleccionado, 'change:position', function() { const p = elementoSeleccionado.position(); const t = elementoSeleccionado.size(); etiqueta.position(p.x + (t.width / 2) - 100, p.y + t.height + 6); });
                elementoSeleccionado.set('etiquetaId', etiqueta.id);
            } else {
                if (etiquetaId) { const etiquetaExistente = graph.getCell(etiquetaId); if (etiquetaExistente) etiquetaExistente.remove(); elementoSeleccionado.unset('etiquetaId'); }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const btnEditorPuertos = document.querySelector('a[href="editor puertos pid.html"]');
            if (btnEditorPuertos) {
                btnEditorPuertos.addEventListener('click', (e) => {
                    const seleccionado = paper.model.getElements().find(el => el.get('selected') && el.get('tipo') !== 'texto');
                    if (seleccionado) {
                        const infoSimbolo = {
                            ruta: seleccionado.get('rutaOriginal'),
                            nombre: seleccionado.get('simboloNombre') || seleccionado.get('simboloLabel')
                        };
                        localStorage.setItem('simboloSeleccionadoPID', JSON.stringify(infoSimbolo));
                    } else {
                        localStorage.removeItem('simboloSeleccionadoPID');
                    }
                });
            }
        });

        (function configurarModalInteractivo() {
            const modal = document.getElementById('modal-simbolos');
            const header = document.getElementById('modal-header');
            let isDragging = false, startX, startY, initialLeft, initialTop;

            header.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.classList.contains('resize-handle')) return;
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                initialLeft = modal.offsetLeft; initialTop = modal.offsetTop;
                modal.dataset.arrastrado = 'true';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            function onMouseMove(e) {
                if (!isDragging) return;
                const dx = e.clientX - startX, dy = e.clientY - startY;
                modal.style.left = `${initialLeft + dx}px`;
                modal.style.top = `${initialTop + dy}px`;
            }
            function onMouseUp() {
                isDragging = false;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        })();

        (async () => {
            try { await cargarCatalogoPID(); } catch(e) { console.error("P&ID:", e); }
            try { await cargarCatalogoSombreados(); } catch(e) { console.error("Sombreados:", e); }
        })();
    </script>
</body>
</html>
