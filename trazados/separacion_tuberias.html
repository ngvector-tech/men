<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Separación entre Tuberías</title>
<style>
  /* ============ ESTILOS BASE ============ */
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;
    color: #222;
  }

  /* ============ CONTENEDOR PRINCIPAL ÚNICO ============ */
  .container {
    max-width: 413px;
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;
  }

  /* ============ CABECERA UNIFICADA (LA ÚNICA BARRA NEGRA) ============ */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #17212b;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 700;
    color: #1e5fa8;
    background: #fff;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .brand-sub {
    font-size: 13px;
    color: #d9e1e7;
    font-weight: 600;
  }
  .brand-author {
    font-size: 11px;
    color: #89949e;
  }
  .header-right h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: #e8f0fa;
    background: transparent;
    padding: 0;
    text-align: right;
    line-height: 1.2;
  }

  /* ============ CONTENIDO INTERNO ============ */
  .tubo-block {
    background: #f9fafb;
    border: 1px solid #e6e9eb;
    border-radius: 5px;
    padding: 11px 12px;
    margin-bottom: 11px;
  }
  .tubo-block h2 {
    font-size: 9px;
    margin: 0 0 8px;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .fields-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .field { flex: 1; margin-bottom: 9px; min-width: 93px; }
  .field label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: #444;
    margin-bottom: 3px;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 6px 7px;
    font-size: 10px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    background: #fff;
  }
  select:focus, input:focus { outline: none; border-color: #4a90d9; }

  .radio-group {
    display: flex;
    gap: 7px;
  }
  .radio-group label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 7px;
    background: #fff;
    border: 2px solid #cbd5e1;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 9px;
    color: #0f172a;
    transition: all 0.15s;
  }
  .radio-group input[type="radio"] { display: none; }
  .radio-group label:has(input:checked) {
    background: #0284c7;
    border-color: #0284c7;
    color: #fff;
  }

  .sub-bloque {
    padding-left: 8px;
    border-left: 3px solid #e2e8f0;
    margin-top: 5px;
  }

  #resultBox {
    margin-top: 15px;
    padding: 12px;
    border-radius: 5px;
    background: #eef7ee;
    border: 1px solid #cfe8cf;
    text-align: center;
  }
  #resultBox .label {
    font-size: 9px;
    color: #5a8a5a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  #resultBox .value {
    font-size: 20px;
    font-weight: 700;
    color: #1c5c1c;
  }
  #notaCalculo {
    margin-top: 7px;
    font-size: 8px;
    color: #64748b;
  }

  /* ============ BOTÓN VOLVER ============ */
  .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #ecf0f1;
      color: #34495e;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: Arial, sans-serif;
  }
  .btn-volver:hover {
      background-color: #e0e6ed;
      border-color: #95a5a6;
      color: #2c3e50;
  }
  .btn-volver:active {
      transform: scale(0.98);
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- BARRA OSCURA UNIFICADA -->
  <div class="header-top">
    <div class="header-left">
      <span class="brand-title">MEN</span>
      <span class="brand-sub">Montajes Industriales S. L.</span>
      <span class="brand-author">Creado por: J.N.G</span>
    </div>
    <div class="header-right">
      <h1>Separación entre<br>Tuberías</h1>
    </div>
  </div>

  <!-- CONTENIDO -->
  <a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>

  <!-- ================= TUBERÍA 1 ================= -->
  <div class="tubo-block">
    <h2>Tubería 1</h2>

    <div class="field">
      <label for="dn1">DN</label>
      <select id="dn1"></select>
    </div>

    <div class="field">
      <label>¿Tiene brida?</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="brida1" value="si" id="brida1_si">
          <span>Sí</span>
        </label>
        <label>
          <input type="radio" name="brida1" value="no" id="brida1_no" checked>
          <span>No</span>
        </label>
      </div>
    </div>

    <div class="sub-bloque" id="subAislante1">
      <div class="field">
        <label>¿Tiene aislante?</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="aisla1" value="si" id="aisla1_si">
            <span>Sí</span>
          </label>
          <label>
            <input type="radio" name="aisla1" value="no" id="aisla1_no" checked>
            <span>No</span>
          </label>
        </div>
      </div>
      <div class="field" id="aisla1_mm_wrap" style="display:none;">
        <label for="aisla1_mm">Espesor aislamiento (mm)</label>
        <input type="number" id="aisla1_mm" value="30" min="0" step="0.1">
      </div>
    </div>
  </div>

  <!-- ================= TUBERÍA 2 ================= -->
  <div class="tubo-block">
    <h2>Tubería 2</h2>

    <div class="field">
      <label for="dn2">DN</label>
      <select id="dn2"></select>
    </div>

    <div class="field">
      <label>¿Tiene brida?</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="brida2" value="si" id="brida2_si">
          <span>Sí</span>
        </label>
        <label>
          <input type="radio" name="brida2" value="no" id="brida2_no" checked>
          <span>No</span>
        </label>
      </div>
    </div>

    <div class="sub-bloque" id="subAislante2">
      <div class="field">
        <label>¿Tiene aislante?</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="aisla2" value="si" id="aisla2_si">
            <span>Sí</span>
          </label>
          <label>
            <input type="radio" name="aisla2" value="no" id="aisla2_no" checked>
            <span>No</span>
          </label>
        </div>
      </div>
      <div class="field" id="aisla2_mm_wrap" style="display:none;">
        <label for="aisla2_mm">Espesor aislamiento (mm)</label>
        <input type="number" id="aisla2_mm" value="30" min="0" step="0.1">
      </div>
    </div>
  </div>

  <!-- ================= HOLGURA ================= -->
  <div class="field">
    <label for="clearance">Holgura / Clearance (mm)</label>
    <input type="number" id="clearance" value="25" min="0" step="0.1">
  </div>

  <!-- ================= RESULTADO ================= -->
  <div id="resultBox">
    <div class="label">Distancia entre ejes</div>
    <div class="value" id="resultValue">-</div>
    <div id="notaCalculo"></div>
  </div>
</div>

<script>
const TABLA_ASME = {
  "DN15":  {"od": 21.3,  "fod": 90.0},
  "DN20":  {"od": 26.7,  "fod": 100.0},
  "DN25":  {"od": 33.4,  "fod": 110.0},
  "DN32":  {"od": 42.2,  "fod": 115.0},
  "DN40":  {"od": 48.3,  "fod": 125.0},
  "DN50":  {"od": 60.3,  "fod": 150.0},
  "DN65":  {"od": 73.0,  "fod": 180.0},
  "DN80":  {"od": 88.9,  "fod": 190.0},
  "DN90":  {"od": 101.6, "fod": 210.0},
  "DN100": {"od": 114.3, "fod": 230.0},
  "DN125": {"od": 141.3, "fod": 255.0},
  "DN150": {"od": 168.3, "fod": 280.0},
  "DN200": {"od": 219.1, "fod": 345.0},
  "DN250": {"od": 273.0, "fod": 405.0},
  "DN300": {"od": 323.8, "fod": 485.0},
  "DN350": {"od": 355.6, "fod": 535.0},
  "DN400": {"od": 406.4, "fod": 595.0},
  "DN450": {"od": 457.0, "fod": 635.0},
  "DN500": {"od": 508.0, "fod": 700.0},
  "DN600": {"od": 610.0, "fod": 815.0}
};

const DNS_ORDEN = [
  "DN15", "DN20", "DN25", "DN32", "DN40", "DN50", "DN65", "DN80",
  "DN90", "DN100", "DN125", "DN150", "DN200", "DN250", "DN300",
  "DN350", "DN400", "DN450", "DN500", "DN600"
];

const dn1Select      = document.getElementById('dn1');
const dn2Select      = document.getElementById('dn2');
const subAislante1   = document.getElementById('subAislante1');
const subAislante2   = document.getElementById('subAislante2');
const aisla1MMWrap   = document.getElementById('aisla1_mm_wrap');
const aisla2MMWrap   = document.getElementById('aisla2_mm_wrap');
const aisla1MMInput  = document.getElementById('aisla1_mm');
const aisla2MMInput  = document.getElementById('aisla2_mm');
const clearanceInput = document.getElementById('clearance');
const resultValue    = document.getElementById('resultValue');
const notaCalculo    = document.getElementById('notaCalculo');

DNS_ORDEN.forEach(dn => {
  const o1 = document.createElement('option');
  o1.value = dn; o1.textContent = dn;
  dn1Select.appendChild(o1);

  const o2 = document.createElement('option');
  o2.value = dn; o2.textContent = dn;
  dn2Select.appendChild(o2);
});

dn1Select.value = 'DN100';
dn2Select.value = 'DN150';

function leerTubo(numero) {
  const dn = document.getElementById('dn' + numero).value;
  const tieneBrida = document.getElementById('brida' + numero + '_si').checked;

  if (tieneBrida) {
    return { dn, tieneBrida: true, tieneAislante: false, espesor: 0 };
  }

  const tieneAislante = document.getElementById('aisla' + numero + '_si').checked;
  let espesor = 0;

  if (tieneAislante) {
    espesor = parseFloat(document.getElementById('aisla' + numero + '_mm').value) || 0;
  }

  return { dn, tieneBrida: false, tieneAislante, espesor };
}

function radioEfectivo(t, tubo) {
  if (tubo.tieneBrida) {
    return t.fod / 2.0;
  }
  return t.od / 2.0 + (tubo.tieneAislante ? tubo.espesor : 0);
}

function calcular() {
  const tubo1 = leerTubo(1);
  const tubo2 = leerTubo(2);
  const clearance = parseFloat(clearanceInput.value) || 0;

  const t1 = TABLA_ASME[tubo1.dn];
  const t2 = TABLA_ASME[tubo2.dn];

  if (!t1 || !t2) {
    resultValue.textContent = '-';
    notaCalculo.textContent = '';
    return;
  }

  const radio1 = radioEfectivo(t1, tubo1);
  const radio2 = radioEfectivo(t2, tubo2);

  const total = radio1 + radio2 + clearance;
  resultValue.textContent = total.toFixed(1) + ' mm';

  const desc1 = tubo1.tieneBrida
    ? `T1: brida Ø${t1.fod} → R=${radio1.toFixed(1)}`
    : (tubo1.tieneAislante
        ? `T1: tubo Ø${t1.od} + aisl. ${tubo1.espesor}mm → R=${radio1.toFixed(1)}`
        : `T1: tubo Ø${t1.od} → R=${radio1.toFixed(1)}`);

  const desc2 = tubo2.tieneBrida
    ? `T2: brida Ø${t2.fod} → R=${radio2.toFixed(1)}`
    : (tubo2.tieneAislante
        ? `T2: tubo Ø${t2.od} + aisl. ${tubo2.espesor}mm → R=${radio2.toFixed(1)}`
        : `T2: tubo Ø${t2.od} → R=${radio2.toFixed(1)}`);

  notaCalculo.textContent = `${desc1}  ·  ${desc2}  ·  Holgura ${clearance} mm`;
}

function alCambiarBrida(numero) {
  const tieneBrida   = document.getElementById('brida' + numero + '_si').checked;
  const subAislante  = document.getElementById('subAislante' + numero);
  const aislaMMWrap  = document.getElementById('aisla' + numero + '_mm_wrap');
  const aislaMMInput = document.getElementById('aisla' + numero + '_mm');
  const aislaNoRadio = document.getElementById('aisla' + numero + '_no');
  const aislaSiRadio = document.getElementById('aisla' + numero + '_si');

  if (tieneBrida) {
    aislaNoRadio.checked = true;
    aislaSiRadio.checked = false;
    aislaMMInput.value = '';
    subAislante.style.display = 'none';
    aislaMMWrap.style.display = 'none';
  } else {
    subAislante.style.display = 'block';
    const tieneAislante = aislaSiRadio.checked;
    aislaMMWrap.style.display = tieneAislante ? 'block' : 'none';
    if (tieneAislante && !aislaMMInput.value) {
      aislaMMInput.value = 30;
    }
  }

  calcular();
}

function alCambiarAislante(numero) {
  const aislaSiRadio = document.getElementById('aisla' + numero + '_si');
  const aislaMMWrap  = document.getElementById('aisla' + numero + '_mm_wrap');
  const aislaMMInput = document.getElementById('aisla' + numero + '_mm');

  if (aislaSiRadio.checked) {
    aislaMMWrap.style.display = 'block';
    if (!aislaMMInput.value) aislaMMInput.value = 30;
  } else {
    aislaMMWrap.style.display = 'none';
    aislaMMInput.value = '';
  }

  calcular();
}

document.getElementById('brida1_si').addEventListener('change', () => alCambiarBrida(1));
document.getElementById('brida1_no').addEventListener('change', () => alCambiarBrida(1));
document.getElementById('brida2_si').addEventListener('change', () => alCambiarBrida(2));
document.getElementById('brida2_no').addEventListener('change', () => alCambiarBrida(2));

document.getElementById('aisla1_si').addEventListener('change', () => alCambiarAislante(1));
document.getElementById('aisla1_no').addEventListener('change', () => alCambiarAislante(1));
document.getElementById('aisla2_si').addEventListener('change', () => alCambiarAislante(2));
document.getElementById('aisla2_no').addEventListener('change', () => alCambiarAislante(2));

[dn1Select, dn2Select, aisla1MMInput, aisla2MMInput, clearanceInput]
  .forEach(el => el.addEventListener('input', calcular));

alCambiarBrida(1);
alCambiarBrida(2);
calcular();
</script>

</body>
</html>
