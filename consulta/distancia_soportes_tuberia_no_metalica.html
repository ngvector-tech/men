Object.keys(DATA).forEach(function(key) {
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = DATA[key].nombre;
  materialSelect.appendChild(opt);
});

// Al cambiar material -> llenar diámetros
materialSelect.addEventListener('change', function() {
  diametroSelect.innerHTML = '<option value="">- Seleccione -</option>';
  temperaturaSelect.innerHTML = '<option value="">- Seleccione -</option>';
  resultBox.classList.remove('show', 'warning');

  const material = materialSelect.value;
  if (!material || !DATA[material]) return;

  Object.keys(DATA[material].diametros).forEach(function(d) {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d + ' pulgadas';
    diametroSelect.appendChild(opt);
  });
});

// Al cambiar diámetro -> llenar temperaturas
diametroSelect.addEventListener('change', function() {
  temperaturaSelect.innerHTML = '<option value="">- Seleccione -</option>';
  resultBox.classList.remove('show', 'warning');

  const material = materialSelect.value;
  const diametro = diametroSelect.value;
  if (!material || !diametro) return;

  Object.keys(DATA[material].diametros[diametro]).forEach(function(t) {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t + ' °C';
    temperaturaSelect.appendChild(opt);
  });
});

// Al cambiar temperatura -> mostrar resultado
temperaturaSelect.addEventListener('change', function() {
  const material = materialSelect.value;
  const diametro = diametroSelect.value;
  const temperatura = temperaturaSelect.value;

  if (!material || !diametro || !temperatura) {
    resultBox.classList.remove('show', 'warning');
    return;
  }

  const valor = DATA[material].diametros[diametro][temperatura];
  if (valor === undefined) {
    resultValue.textContent = 'Dato no disponible';
    resultBox.classList.add('show', 'warning');
    return;
  }

  resultValue.textContent = valor.toFixed(2) + ' metros';
  materialName.textContent = DATA[material].nombre;
  resultBox.classList.remove('warning');
  resultBox.classList.add('show');
});
</script>
