<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultor de Dimensiones de Válvulas (EN 558)</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;             /* ⬅️ antes 24 16 60 */
    color: #222;
  }

  .container {
    max-width: 600px;                   /* ⬅️ antes 900 (≈ 2/3) */
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;                 /* ⬅️ antes 10 */
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;            /* ⬅️ antes 24 28 32 */
  }

  h1 {
    text-align: center;
    font-size: 13px;                    /* ⬅️ antes 20 */
    background: #111;
    color: #fff;
    padding: 8px 11px;                  /* ⬅️ antes 12 16 */
    border-radius: 4px;                 /* ⬅️ antes 6 */
    margin: 0 0 5px;                    /* ⬅️ antes 8 */
  }

  .subtitulo {
    text-align: center;
    font-size: 9px;                     /* ⬅️ antes 13 */
    color: #666;
    margin: 0 0 15px;                   /* ⬅️ antes 22 */
  }

  /* ===== Layout en dos columnas ===== */
  .layout {
    display: grid;
    grid-template-columns: 253px 1fr;   /* ⬅️ antes 380px 1fr */
    gap: 13px;                          /* ⬅️ antes 20 */
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ===== Panel de selección ===== */
  .panel {
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 5px;                 /* ⬅️ antes 8 */
    padding: 11px;                      /* ⬅️ antes 16 */
  }
  .panel h2 {
    font-size: 9px;                     /* ⬅️ antes 14 */
    margin: 0 0 8px;                    /* ⬅️ antes 12 */
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field { margin-bottom: 11px; }       /* ⬅️ antes 16 */

  .field label {
    display: block;
    font-size: 9px;                     /* ⬅️ antes 13 */
    font-weight: 600;
    color: #444;
    margin-bottom: 3px;                 /* ⬅️ antes 5 */
  }

  select {
    width: 100%;
    padding: 6px 7px;                   /* ⬅️ antes 9 10 */
    font-size: 10px;                    /* ⬅️ antes 15 */
    border: 1px solid #c7ccd1;
    border-radius: 4px;                 /* ⬅️ antes 6 */
    background: #fff;
    color: #222;
  }
  select:focus { outline: none; border-color: #4a90d9; }
  select:disabled { background: #f1f3f5; color: #999; cursor: not-allowed; }

  .nota {
    font-size: 8px;                     /* ⬅️ antes 12 */
    font-weight: 700;
    color: #b04a3f;
    margin-top: 9px;                    /* ⬅️ antes 14 */
    line-height: 1.4;
  }

  /* ===== Panel de resultado ===== */
  .resultado {
    background: #fff;
    border: 1px solid #e0e3e6;
    border-radius: 5px;                 /* ⬅️ antes 8 */
    padding: 11px;                      /* ⬅️ antes 16 */
    min-height: 173px;                  /* ⬅️ antes 260 */
  }
  .resultado h2 {
    font-size: 9px;                     /* ⬅️ antes 14 */
    margin: 0 0 8px;                    /* ⬅️ antes 12 */
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .imagen-area {
    text-align: center;
    min-height: 120px;                  /* ⬅️ antes 180 */
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 4px;                 /* ⬅️ antes 6 */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px;                       /* ⬅️ antes 10 */
    margin-bottom: 11px;                /* ⬅️ antes 16 */
  }
  .imagen-area img { max-width: 100%; max-height: 147px; }  /* ⬅️ antes 220 */
  .imagen-area p { color: #667085; font-size: 9px; }  /* ⬅️ antes 13 */

  .dato {
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 5px;                 /* ⬅️ antes 8 */
    padding: 12px;                      /* ⬅️ antes 18 */
    text-align: center;
    display: none;
  }
  .dato.visible { display: block; }

  .dato .label {
    font-size: 9px;                     /* ⬅️ antes 13 */
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;                 /* ⬅️ antes 6 */
  }
  .dato .valor {
    font-size: 19px;                    /* ⬅️ antes 28 */
    font-weight: 700;
    color: #111;
    display: block;
  }

  /* Tabla de dimensiones (si la usa valvulas.js) */
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 10px;                    /* ⬅️ antes 14 */
    margin-top: 7px;                    /* ⬅️ antes 10 */
  }
  th, td {
    border: 1px solid #e0e3e6;
    padding: 5px 9px;                   /* ⬅️ antes 8 14 */
    text-align: left;
  }
  th { background: #f4f6f8; font-weight: 600; color: #111; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="container">
  <h1>Consultor de Dimensiones de Válvulas y Accesorios</h1>
  <p class="subtitulo">Dimensiones según norma EN 558</p>

  <div class="layout">

    <!-- ================= PANEL IZQUIERDO ================= -->
    <section class="panel">
      <h2>Selección</h2>

      <div class="field">
        <label for="tipoValvula">Tipo de válvula</label>
        <select id="tipoValvula">
          <option value="">— Seleccione un tipo —</option>
          <option value="filtro">Filtro con brida (Serie 1)</option>
          <option value="retencion">Válvula antirretorno wafer (Serie 16)</option>
          <option value="bola">Válvula de bola con brida (Serie 14)</option>
          <option value="compuerta_serie14">Válvula de compuerta (Serie 14 - corta)</option>
          <option value="compuerta_serie15">Válvula de compuerta (Serie 15 - larga)</option>
          <option value="globo">Válvula de globo (Serie 1)</option>
          <option value="guillotina">Válvula de guillotina (Serie 20)</option>
          <option value="mariposa_lug">Válvula de mariposa Lug (Serie 20)</option>
          <option value="mariposa_wafer">Válvula de mariposa Wafer (Serie 20)</option>
          <option value="mariposa_sanitaria_hh">Válvula mariposa H-H DIN 11851</option>
          <option value="mariposa_sanitaria_mm">Válvula mariposa M-M DIN 11851</option>
          <option value="mariposa_sanitaria_ms">Válvula mariposa M-S DIN 11851</option>
          <option value="mariposa_sanitaria_s">Válvula mariposa S-S DIN 11851</option>
          <option value="mariposa_sanitaria_eb">Válvula mariposa entre brida DIN 11851</option>
          <option value="casquillo">Racor casquillo soldar DIN 11851</option>
          <option value="macho">Racor macho soldar DIN 11851</option>
        </select>
      </div>

      <div class="field">
        <label for="dn">DN — Diámetro nominal</label>
        <select id="dn" disabled>
          <option value="">— Seleccione DN —</option>
        </select>
      </div>

      <div class="field">
        <label for="pn">PN — Presión nominal</label>
        <select id="pn" disabled>
          <option value="">— Seleccione PN —</option>
        </select>
      </div>

      <p class="nota">
        Los valores mostrados son ejemplos orientativos. Confirme siempre con el catálogo del fabricante.
      </p>
    </section>

    <!-- ================= PANEL DERECHO ================= -->
    <section class="resultado">
      <h2>Resultado</h2>

      <div id="imagenArea" class="imagen-area">
        <p>Seleccione una válvula o accesorio para ver su imagen</p>
      </div>

      <div id="resultado" class="dato"></div>
    </section>

  </div>
</div>

<script src="valvulas.js"></script>
<link rel="stylesheet" href="men-header.css">
<script src="men-header.js" data-autor="Creado por: J.N.G"></script>
</body>
</html>
