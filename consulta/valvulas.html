<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultor de Dimensiones de Válvulas (EN 558)</title>
<style>
  /* ============ ESTILOS BASE ============ */
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;
    color: #222;
  }

  /* ============ CONTENEDOR PRINCIPAL ÚNICO ============ */
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;
    position: relative;
  }

  /* ============ CABECERA UNIFICADA (LA ÚNICA BARRA NEGRA) ============ */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #17212b;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 700;
    color: #1e5fa8;
    background: #fff;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .brand-sub {
    font-size: 13px;
    color: #d9e1e7;
    font-weight: 600;
  }
  .brand-author {
    font-size: 11px;
    color: #89949e;
  }
  .header-right h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: #e8f0fa;
    background: transparent;
    padding: 0;
    text-align: right;
    line-height: 1.2;
  }

  /* ============ CONTENIDO INTERNO ============ */
  .subtitulo {
    text-align: center;
    font-size: 9px;
    color: #666;
    margin: 0 0 15px;
  }

  .layout {
    display: grid;
    grid-template-columns: 253px 1fr;
    gap: 13px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 5px;
    padding: 11px;
  }
  .panel h2 {
    font-size: 9px;
    margin: 0 0 8px;
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field { margin-bottom: 11px; position: relative; }

  .field label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: #444;
    margin-bottom: 3px;
  }

  select {
    width: 100%;
    padding: 6px 7px;
    font-size: 10px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    background: #fff;
    color: #222;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: #4a90d9; }
  select:disabled { background: #f1f3f5; color: #999; cursor: not-allowed; }

  .nota {
    font-size: 8px;
    font-weight: 700;
    color: #b04a3f;
    margin-top: 9px;
    line-height: 1.4;
  }

  .resultado {
    background: #fff;
    border: 1px solid #e0e3e6;
    border-radius: 5px;
    padding: 11px;
    min-height: 173px;
  }
  .resultado h2 {
    font-size: 9px;
    margin: 0 0 8px;
    color: #111;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .imagen-area {
    text-align: center;
    min-height: 120px;
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px;
    margin-bottom: 11px;
  }
  .imagen-area img { max-width: 100%; max-height: 147px; object-fit: contain; }
  .imagen-area p { color: #667085; font-size: 9px; }

  .dato {
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 5px;
    padding: 12px;
    text-align: center;
    display: none;
  }
  .dato.visible { display: block; }

  .dato .label {
    font-size: 9px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .dato .valor {
    font-size: 19px;
    font-weight: 700;
    color: #111;
    display: block;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 10px;
    margin-top: 7px;
  }
  th, td {
    border: 1px solid #e0e3e6;
    padding: 5px 9px;
    text-align: left;
  }
  th { background: #f4f6f8; font-weight: 600; color: #111; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }

  /* ========================================================= */
  /* VENTANA FLOTANTE CON EL CATÁLOGO DE VÁLVULAS              */
  /* ========================================================= */
  #panelValvulasFlotante {
      position: absolute;
      z-index: 1000;
      background: #fff;
      border: 2px solid #0284c7;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      padding: 8px;
      display: none;
      width: 100%; 
      top: 100%;
      left: 0;
      margin-top: 5px;
      max-height: 250px; 
      overflow-y: auto;
  }
  #panelValvulasFlotante.activa { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  
  .valvula-opcion {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 5px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      background: #f8fafc;
      width: 70px;
      transition: background 0.2s, border-color 0.2s;
  }
  .valvula-opcion:hover { background: #e0f2fe; border-color: #38bdf8; }
  .valvula-opcion img { width: 50px; height: 40px; object-fit: contain; margin-bottom: 4px; }
  .valvula-opcion span { font-size: 8px; font-weight: bold; color: #333; text-align: center; text-transform: uppercase; line-height: 1.1; }

  /* ============ BOTÓN VOLVER ============ */
  .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #ecf0f1;
      color: #34495e;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: Arial, sans-serif;
  }
  .btn-volver:hover {
      background-color: #e0e6ed;
      border-color: #95a5a6;
      color: #2c3e50;
  }
  .btn-volver:active {
      transform: scale(0.98);
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- BARRA OSCURA UNIFICADA -->
  <div class="header-top">
    <div class="header-left">
      <span class="brand-title">MEN</span>
      <span class="brand-sub">Montajes Industriales S. L.</span>
      <span class="brand-author">Creado por: J.N.G</span>
    </div>
    <div class="header-right">
      <h1>Consultor de<br>Válvulas</h1>
    </div>
  </div>

  <!-- CONTENIDO -->
  <a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>

  <p class="subtitulo">Dimensiones según norma EN 558</p>

  <div class="layout">

    <!-- ================= PANEL IZQUIERDO ================= -->
    <section class="panel">
      <h2>Selección</h2>

      <div class="field">
        <label for="tipoValvula">Tipo de válvula</label>
        <select id="tipoValvula">
          <option value="">— Seleccione un tipo —</option>
          <option value="filtro">Filtro con brida (Serie 1)</option>
          <option value="retencion">Válvula antirretorno wafer (Serie 16)</option>
          <option value="bola">Válvula de bola con brida (Serie 14)</option>
          <option value="compuerta_serie14">Válvula de compuerta (Serie 14 - corta)</option>
          <option value="compuerta_serie15">Válvula de compuerta (Serie 15 - larga)</option>
          <option value="globo">Válvula de globo (Serie 1)</option>
          <option value="guillotina">Válvula de guillotina (Serie 20)</option>
          <option value="mariposa_lug">Válvula de mariposa Lug (Serie 20)</option>
          <option value="mariposa_wafer">Válvula de mariposa Wafer (Serie 20)</option>
          <option value="mariposa_sanitaria_hh">Válvula mariposa H-H DIN 11851</option>
          <option value="mariposa_sanitaria_mm">Válvula mariposa M-M DIN 11851</option>
          <option value="mariposa_sanitaria_ms">Válvula mariposa M-S DIN 11851</option>
          <option value="mariposa_sanitaria_s">Válvula mariposa S-S DIN 11851</option>
          <option value="mariposa_sanitaria_eb">Válvula mariposa entre brida DIN 11851</option>
          <option value="casquillo">Racor casquillo soldar DIN 11851</option>
          <option value="macho">Racor macho soldar DIN 11851</option>
        </select>
        
        <!-- Panel flotante de válvulas -->
        <div id="panelValvulasFlotante"></div>
      </div>

      <div class="field">
        <label for="dn">DN — Diámetro nominal</label>
        <select id="dn" disabled>
          <option value="">— Seleccione DN —</option>
        </select>
      </div>

      <div class="field">
        <label for="pn">PN — Presión nominal</label>
        <select id="pn" disabled>
          <option value="">— Seleccione PN —</option>
        </select>
      </div>

      <p class="nota">
        Los valores mostrados son ejemplos orientativos. Confirme siempre con el catálogo del fabricante.
      </p>
    </section>

    <!-- ================= PANEL DERECHO ================= -->
    <section class="resultado">
      <h2>Resultado</h2>

      <div id="imagenArea" class="imagen-area">
        <p>Seleccione una válvula o accesorio para ver su imagen</p>
      </div>

      <div id="resultado" class="dato"></div>
    </section>

  </div>
</div>

<script src="valvulas.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tipoSelect = document.getElementById('tipoValvula');
    const panel = document.getElementById('panelValvulasFlotante');
    const imagenArea = document.getElementById('imagenArea');
    const imgPlaceholder = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='40'><rect width='100%' height='100%' fill='%23f1f5f9'/><text x='50%' y='50%' font-family='Arial' font-size='8' fill='%2364748b' text-anchor='middle' dy='.3em'>?</text></svg>`;

    function crearEstructura() {
        const opciones = tipoSelect.options;
        panel.innerHTML = '';
        
        for (let i = 1; i < opciones.length; i++) {
            const valor = opciones[i].value;
            const texto = opciones[i].text;

            const div = document.createElement('div');
            div.className = 'valvula-opcion';
            
            div.onclick = function() {
                tipoSelect.value = valor;
                tipoSelect.dispatchEvent(new Event('change'));
                panel.classList.remove('activa');
            };

            div.innerHTML = `
                <img id="thumb_${valor}" src="${imgPlaceholder}" alt="${valor}">
                <span>${texto}</span>
            `;
            panel.appendChild(div);
        }
    }

    function extraerImagenes() {
        const opciones = tipoSelect.options;
        const seleccionOriginal = tipoSelect.value;
        panel.style.visibility = 'hidden';

        for (let i = 1; i < opciones.length; i++) {
            const valor = opciones[i].value;
            tipoSelect.value = valor;
            tipoSelect.dispatchEvent(new Event('change'));
            const imgReal = imagenArea.querySelector('img');
            if (imgReal && imgReal.src) {
                const thumb = document.getElementById(`thumb_${valor}`);
                if (thumb) thumb.src = imgReal.src;
            }
        }

        tipoSelect.value = seleccionOriginal;
        tipoSelect.dispatchEvent(new Event('change'));
        panel.style.visibility = 'visible';
    }

    tipoSelect.addEventListener('mousedown', function(e) {
        e.preventDefault(); 
        if (panel.classList.contains('activa')) {
            panel.classList.remove('activa');
        } else {
            panel.classList.add('activa');
        }
    });

    document.addEventListener('click', function(event) {
        if (panel.classList.contains('activa')) {
            if (event.target !== tipoSelect && !panel.contains(event.target)) {
                panel.classList.remove('activa');
            }
        }
    });

    crearEstructura();
    setTimeout(extraerImagenes, 1000); 
});
</script>

</body>
</html>
