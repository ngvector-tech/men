<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Símbolos</title>
<style>
  /* ============ ESTILOS BASE ============ */
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;
    color: #222;
  }

  /* ============ CONTENEDOR PRINCIPAL ÚNICO ============ */
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;
  }

  /* ============ CABECERA UNIFICADA (LA ÚNICA BARRA NEGRA) ============ */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #17212b;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 700;
    color: #1e5fa8;
    background: #fff;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .brand-sub {
    font-size: 13px;
    color: #d9e1e7;
    font-weight: 600;
  }
  .brand-author {
    font-size: 11px;
    color: #89949e;
  }
  .header-right h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: #e8f0fa;
    background: transparent;
    padding: 0;
    text-align: right;
    line-height: 1.2;
  }

  /* ============ CONTENIDO INTERNO ============ */
  .field { margin-bottom: 9px; }
  .field label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: #444;
    margin-bottom: 3px;
  }
  select {
    width: 100%;
    padding: 6px 7px;
    font-size: 10px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    background: #fff;
  }
  select:focus { outline: none; border-color: #4a90d9; }
  select:disabled { background: #f4f6f8; color: #aaa; cursor: not-allowed; }

  #btnLimpiar {
    background: #111;
    color: #fff;
    border: none;
    padding: 7px 12px;
    font-size: 9px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 7px;
    margin-bottom: 11px;
    width: 100%;
    transition: background 0.2s;
  }
  #btnLimpiar:hover { background: #333; }

  .titulo-galeria {
    font-size: 9px;
    font-weight: 600;
    color: #444;
    margin: 12px 0 4px;
  }

  /* Galería de miniaturas */
  .galeria {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(73px, 1fr));
    gap: 7px;
    margin: 0;
    max-height: 347px;
    overflow-y: auto;
    padding: 5px;
    background: #fafafa;
    border: 1px dashed #ccc;
    border-radius: 5px;
  }
  .galeria .miniatura {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 2px solid transparent;
    border-radius: 4px;
    padding: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .galeria .miniatura:hover {
    border-color: #4a90d9;
    background: #f0f7ff;
  }
  .galeria .miniatura.activa {
    border-color: #111;
    background: #eef6ff;
    box-shadow: 0 0 0 2px rgba(17,17,17,0.15);
  }
  .galeria .miniatura img {
    width: 100%;
    height: 47px;
    object-fit: contain;
    display: block;
  }
  .galeria .miniatura .nombre {
    font-size: 7px;
    color: #555;
    text-align: center;
    margin-top: 3px;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* Cuando la galería se reduce a una única miniatura */
  .galeria.solo-una {
    grid-template-columns: minmax(107px, 160px);
    justify-content: center;
    max-height: none;
    padding: 11px;
  }
  .galeria.solo-una .miniatura img {
    height: 107px;
  }
  .galeria.solo-una .miniatura .nombre {
    font-size: 9px;
    -webkit-line-clamp: 3;
  }

  .img-placeholder {
    font-size: 9px;
    color: #888;
    font-style: italic;
    display: inline-block;
    padding: 27px 7px;
  }

  /* ============ BOTÓN VOLVER ============ */
  .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #ecf0f1;
      color: #34495e;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: Arial, sans-serif;
  }
  .btn-volver:hover { background-color: #e0e6ed; border-color: #95a5a6; color: #2c3e50; }
  .btn-volver:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="container">
  
  <!-- BARRA OSCURA UNIFICADA -->
  <div class="header-top">
    <div class="header-left">
      <span class="brand-title">MEN</span>
      <span class="brand-sub">Montajes Industriales S. L.</span>
      <span class="brand-author">Creado por: J.N.G</span>
    </div>
    <div class="header-right">
      <h1>Buscador de<br>Símbolos</h1>
    </div>
  </div>

  <!-- CONTENIDO -->
  <a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>

  <div class="field">
    <label for="catSelect">1. Categoría</label>
    <select id="catSelect" disabled>
      <option value="">Cargando datos...</option>
    </select>
  </div>

  <div class="field">
    <label for="descSelect">2. Descripción</label>
    <select id="descSelect" disabled>
      <option value="">-- Selecciona Descripción --</option>
    </select>
  </div>

  <button type="button" id="btnLimpiar">Nueva consulta</button>

  <div class="titulo-galeria" id="tituloGaleria">Selecciona un símbolo haciendo clic en su dibujo:</div>
  <div class="galeria" id="galeria">
    <span class="img-placeholder" style="grid-column: 1/-1; text-align:center;">
      Elige una categoría para ver sus símbolos
    </span>
  </div>
</div>

<script>
let DATA = [];

const catSelect     = document.getElementById('catSelect');
const descSelect    = document.getElementById('descSelect');
const btnLimpiar    = document.getElementById('btnLimpiar');
const galeria       = document.getElementById('galeria');
const tituloGaleria = document.getElementById('tituloGaleria');

async function cargarDatos() {
  try {
    const respuesta = await fetch('simbolos.txt');
    if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
    const texto = await respuesta.text();
    DATA = parsearTXT(texto);
    initCategorias();
  } catch (error) {
    console.error('Error cargando simbolos.txt:', error.message);
    catSelect.innerHTML = '<option value="">Error al cargar datos</option>';
    galeria.innerHTML = `<span class="img-placeholder" style="grid-column:1/-1;text-align:center;">
      No se pudo cargar <strong>simbolos.txt</strong>.<br>${error.message}
    </span>`;
  }
}

function parsearTXT(texto) {
  return texto
    .split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0)
    .map(linea => {
      const partes = linea.match(/"([^"]*)"|([^,]+)/g) || [];
      const limpio = partes.map(p => p.replace(/^"|"$/g, '').trim());
      return [limpio[0] || '', limpio[1] || ''];
    })
    .filter(d => d[0] && d[1]);
}

function initCategorias() {
  const categorias = [...new Set(DATA.map(d => d[1]))].sort();
  catSelect.innerHTML = '<option value="">-- Selecciona Categoría --</option>';
  categorias.forEach(cat => {
    catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
  catSelect.disabled = false;
}

function rutaImagen(descripcion) {
  const nombreLimpio = descripcion.replace(/[\\/:*?"<>|]/g, '_');
  return `imagenes/${encodeURIComponent(nombreLimpio)}.png`;
}

function renderGaleria(categoria, descripcionFiltro) {
  if (!categoria) {
    galeria.classList.remove('solo-una');
    tituloGaleria.textContent = 'Selecciona un símbolo haciendo clic en su dibujo:';
    galeria.innerHTML = '<span class="img-placeholder" style="grid-column:1/-1;text-align:center;">Elige una categoría para ver sus símbolos</span>';
    return;
  }

  if (descripcionFiltro) {
    galeria.classList.add('solo-una');
    tituloGaleria.textContent = 'Símbolo seleccionado:';
    galeria.innerHTML = `
      <div class="miniatura activa"
           data-desc="${descripcionFiltro.replace(/"/g, '&quot;')}"
           title="${descripcionFiltro}">
        <img src="${rutaImagen(descripcionFiltro)}"
             alt="${descripcionFiltro}"
             onerror="this.style.opacity=0.2; this.title='Imagen no encontrada';">
        <div class="nombre">${descripcionFiltro}</div>
      </div>
    `;
    return;
  }

  const items = DATA
    .filter(d => d[1] === categoria)
    .map(d => d[0])
    .sort();

  galeria.classList.remove('solo-una');
  tituloGaleria.textContent = `Símbolos de la categoría "${categoria}" (${items.length}):`;

  if (items.length === 0) {
    galeria.innerHTML = '<span class="img-placeholder" style="grid-column:1/-1;text-align:center;">No hay símbolos en esta categoría</span>';
    return;
  }

  galeria.innerHTML = items.map(desc => `
    <div class="miniatura" data-desc="${desc.replace(/"/g, '&quot;')}" title="${desc}">
      <img src="${rutaImagen(desc)}" alt="${desc}" loading="lazy"
           onerror="this.style.opacity=0.2; this.title='Imagen no encontrada';">
      <div class="nombre">${desc}</div>
    </div>
  `).join('');

  galeria.querySelectorAll('.miniatura').forEach(el => {
    el.addEventListener('click', () => {
      const desc = el.dataset.desc;
      if (descSelect.value !== desc) {
        descSelect.value = desc;
      }
      descSelect.dispatchEvent(new Event('change'));
    });
  });
}

catSelect.addEventListener('change', function() {
  const cat = this.value;

  descSelect.innerHTML = '<option value="">-- Selecciona Descripción --</option>';
  descSelect.disabled = !cat;

  if (cat) {
    DATA.filter(d => d[1] === cat)
        .map(d => d[0])
        .sort()
        .forEach(desc => {
          descSelect.innerHTML += `<option value="${desc}">${desc}</option>`;
        });
  }

  renderGaleria(cat, '');
});

descSelect.addEventListener('change', function() {
  const desc = this.value;
  const cat  = catSelect.value;
  renderGaleria(cat, desc);
});

btnLimpiar.addEventListener('click', function() {
  catSelect.value = '';
  descSelect.innerHTML = '<option value="">-- Selecciona Descripción --</option>';
  descSelect.disabled = true;
  renderGaleria('', '');
});

cargarDatos();
</script>

</body>
</html>
