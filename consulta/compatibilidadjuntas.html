<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compatibilidad de Juntas</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;
    color: #222;
  }

  .container {
    max-width: 427px;
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;
  }

  h1 {
    text-align: center;
    font-size: 13px;
    background: #111;
    color: #fff;
    padding: 8px 11px;
    border-radius: 4px;
    margin: 0 0 12px;
  }

  .legend {
    font-size: 9px;
    line-height: 1.5;
    color: #333;
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 13px;
  }
  .legend b { color: #111; }

  .field { margin-bottom: 11px; }

  .field label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: #444;
    margin-bottom: 3px;
  }

  /* Casillas y desplegables */
  select, input[type="text"] {
    width: 100%;
    padding: 6px 7px;
    font-size: 10px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    background: #fff;
    color: #222;
  }

  /* Opciones del desplegable de temperatura */
  select option {
    font-size: 10px;
    padding: 2px 4px;
  }

  /* --- NUEVO DESPLEGABLE PERSONALIZADO PARA FLUIDOS --- */
  .custom-select-container {
    position: relative;
    width: 100%;
  }

  .custom-select-input {
    width: 100%;
    padding: 6px 7px;
    font-size: 10px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    background: #fff;
    color: #222;
    cursor: pointer;
  }
  .custom-select-input:focus { outline: none; border-color: #4a90d9; }

  .custom-select-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    max-height: 200px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 100;
    display: none;
    margin-top: 2px;
  }
  .custom-select-dropdown.active { display: block; }

  .custom-select-option {
    padding: 6px 8px;
    font-size: 10px; /* ⬅️ AQUÍ REDUCES EL TAMAÑO DE LOS TEXTOS DE LOS ACEITES */
    color: #333;
    cursor: pointer;
    transition: background 0.1s;
  }
  .custom-select-option:hover { background: #eef0f2; }

  select:focus, input:focus {
    outline: none;
    border-color: #4a90d9;
  }

  #btnLimpiar {
    background: #111;
    color: #fff;
    border: none;
    padding: 7px 12px;
    font-size: 9px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 7px;
    width: 100%;
    transition: background 0.2s;
  }
  #btnLimpiar:hover { background: #333; }

  #tempField { display: none; }

  #results { margin-top: 15px; }

  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 9px;
    margin-bottom: 4px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 10px;
  }
  .result-row .mat-name { font-weight: 700; }
  .result-row .mat-desc { font-weight: 500; font-size: 9px; }

  .letra-A { background: #6fbf4f; color: #fff; }
  .letra-B { background: #f2d232; color: #333; }
  .letra-C { background: #e05a4e; color: #fff; }
  .letra-D { background: #c9ccd0; color: #333; }
  .letra-E { background: #8b8f94; color: #fff; }

  .sin-dato {
    background: #f5f5f5;
    color: #999;
    font-style: italic;
    font-weight: 400;
  }

  .no-results {
    text-align: center;
    color: #888;
    font-size: 9px;
    padding: 13px 0;
  }

  .section-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #999;
    margin: 12px 0 5px;
  }

  .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #ecf0f1;
      color: #34495e;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: Arial, sans-serif;
  }
  .btn-volver:hover { background-color: #e0e6ed; border-color: #95a5a6; color: #2c3e50; }
  .btn-volver:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="container">
<a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>
  <h1>Compatibilidad de Juntas</h1>

  <div class="legend">
    <b>A</b> Buen comportamiento · 
    <b>B</b> Moderado deterioro · 
    <b>C</b> Alto deterioro · 
    <b>D</b> No existen datos, probablemente adecuado · 
    <b>E</b> No existen datos
  </div>

  <div class="field">
    <label for="fluidoInput">Fluido</label>
    <div class="custom-select-container">
      <input type="text" id="fluidoInput" class="custom-select-input"
             placeholder="Escribe o selecciona un fluido..." autocomplete="off">
      <div class="custom-select-dropdown" id="fluidoDropdown"></div>
    </div>

    <button type="button" id="btnLimpiar">Nueva consulta</button>
  </div>

  <div class="field" id="tempField">
    <label for="tempSelect">Temp °C</label>
    <select id="tempSelect"></select>
  </div>

  <div id="results"></div>
</div>

,"A","",""],["ACEITE TEXAS 1500","","A","A","C","B","","B","A","",""],["ACEITE TIDEWATER BEEDOL","","A","A","C","B","","B","A","",""],["ACEITE TIDEWATER MULTIGEAR 140 EP LUBE","","A","A","C","C","","B","A","",""],["ACEITE TIPO IV MIL-S-3136, BAJO HINCHAMIENTO","","A","A","C","A","","A","A","",""],["ACEITE TIPO V MIL-S-3136, MEDIO HINCHAMIENTO","","A","A","C","B","","B","A","",""],["ACEITE TIPO VI MIL-S-3136, ALTO HINCHAMIENTO","","A","A","C","B","","C","A","",""],["ACEITE VEGETAL","","A","A","B","A","","B","A","",""],["ACEITES LUBRICANTES SAE 10, 20, 30, 40, 50","","A","A","C","C","","B","A","","A"],["AGUA","100","A","A","A","B","A","B","D","A","A"],["AGUA","40","A","A","A","A","","A","D","","A"],["AGUA DE MAR","20","A","A","A","A","A","B","A","A","A"],["AGUA POTABLE","","A","A","A","A","","B","A","",""],["AIRE PURO","80","A","A","A","A","A","A","A","A","A"],["GAS NATURAL","20","A","A","C","A","A","A","C","A","A"],["HIDRÓGENO","60","A","A","A","A","","A","A","","A"],["NITRÓGENO","20","A","A","A","A","A","A","A","A","A"],["OXÍGENO FRIO","","B","A","A","A","","A","A","",""],["VAPOR","110","B","B","A","A","","C","A","C","A"]];

const fluidosUnicos = [...new Set(DATA.map(r => r[0]))].sort((a,b) => a.localeCompare(b, 'es'));

const fluidoInput = document.getElementById('fluidoInput');
const fluidoDropdown = document.getElementById('fluidoDropdown');
const tempField = document.getElementById('tempField');
const tempSelect = document.getElementById('tempSelect');
const resultsDiv = document.getElementById('results');

// --- LOGICA DEL DESPLEGABLE PERSONALIZADO ---
function renderDropdown(filtro = "") {
  fluidoDropdown.innerHTML = '';
  const filtrados = fluidosUnicos.filter(f => f.toLowerCase().includes(filtro.toLowerCase()));
  
  if (filtrados.length === 0) {
    fluidoDropdown.classList.remove('active');
    return;
  }

  filtrados.forEach(f => {
    const div = document.createElement('div');
    div.className = 'custom-select-option';
    div.textContent = f;
    // Usamos mousedown y preventDefault para evitar que el input pierda el foco antes de procesar el clic
    div.addEventListener('mousedown', (e) => {
      e.preventDefault(); 
      fluidoInput.value = f;
      fluidoDropdown.classList.remove('active');
      onFluidoChange();
    });
    fluidoDropdown.appendChild(div);
  });
}

fluidoInput.addEventListener('focus', () => {
  renderDropdown(fluidoInput.value.trim() === '' ? '' : fluidoInput.value);
  fluidoDropdown.classList.add('active');
});

fluidoInput.addEventListener('input', (e) => {
  renderDropdown(e.target.value);
  fluidoDropdown.classList.add('active');
  onFluidoChange();
});

document.addEventListener('click', (e) => {
  if (!fluidoInput.contains(e.target) && !fluidoDropdown.contains(e.target)) {
    fluidoDropdown.classList.remove('active');
  }
});
// ----------------------------------------------

function getRegistrosDeFluido(fluido) {
  return DATA.filter(r => r[0] === fluido);
}

function renderTempOptions(fluido) {
  const registros = getRegistrosDeFluido(fluido);
  const temps = [...new Set(registros.map(r => r[1]).filter(t => t !== ""))];

  if (temps.length === 0) {
    tempField.style.display = 'none';
    tempSelect.innerHTML = '';
    if (registros.length > 0) {
      renderResultados(registros[0]);
    } else {
      resultsDiv.innerHTML = '';
    }
    return;
  }

  temps.sort((a,b) => parseFloat(a) - parseFloat(b));
  tempSelect.innerHTML = '';
  temps.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t + ' °C';
    tempSelect.appendChild(opt);
  });
  tempField.style.display = 'block';

  const primerRegistro = registros.find(r => r[1] === temps[0]);
  renderResultados(primerRegistro);
}

function renderResultados(registro) {
  resultsDiv.innerHTML = '';
  if (!registro) {
    resultsDiv.innerHTML = '<div class="no-results">Sin datos para esta combinación.</div>';
    return;
  }

  const conValor = [];
  const sinValor = [];

  MATERIALES.forEach((mat, idx) => {
    const letra = registro[2 + idx];
    if (letra === "" || letra === undefined) {
      sinValor.push(mat);
    } else {
      conValor.push({ mat, letra });
    }
  });

  conValor.sort((a, b) => (ORDEN[a.letra] ?? 99) - (ORDEN[b.letra] ?? 99));

  conValor.forEach(({ mat, letra }) => {
    const row = document.createElement('div');
    row.className = 'result-row letra-' + letra;
    row.innerHTML = `<span class="mat-name">${mat}</span><span class="mat-desc">${DESCRIPCIONES[letra] || ''}</span>`;
    resultsDiv.appendChild(row);
  });

  if (sinValor.length > 0) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'Sin valorar';
    resultsDiv.appendChild(label);

    sinValor.forEach(mat => {
      const row = document.createElement('div');
      row.className = 'result-row sin-dato';
      row.innerHTML = `<span class="mat-name">${mat}</span><span class="mat-desc">Sin valorar</span>`;
      resultsDiv.appendChild(row);
    });
  }
}

function onFluidoChange() {
  const fluido = fluidoInput.value.trim();
  if (!fluidosUnicos.includes(fluido)) {
    tempField.style.display = 'none';
    resultsDiv.innerHTML = '';
    return;
  }
  renderTempOptions(fluido);
}

tempSelect.addEventListener('change', () => {
  const fluido = fluidoInput.value.trim();
  const temp = tempSelect.value;
  const registros = getRegistrosDeFluido(fluido);
  const registro = registros.find(r => r[1] === temp);
  renderResultados(registro);
});

document.getElementById('btnLimpiar').addEventListener('click', function() {
  fluidoInput.value = '';
  tempSelect.innerHTML = '';
  tempField.style.display = 'none';
  resultsDiv.innerHTML = '';
  fluidoDropdown.classList.remove('active');
  fluidoInput.focus();
});
</script>
