function colorCSS(nombre) {
  if (!nombre) return "#f0f0f0";
  const key = nombre.trim().toLowerCase();
  return COLORES_CSS[key] || "#cccccc";
}

// ============================================================================
// PARSEO
// ============================================================================
function parsearLinea(linea) {
  const campos = [];
  let actual = '';
  let dentro = false;
  for (let i = 0; i < linea.length; i++) {
    const ch = linea[i];
    if (ch === '"') {
      if (dentro && linea[i+1] === '"') { actual += '"'; i++; }
      else dentro = !dentro;
    } else if (ch === ',' && !dentro) {
      campos.push(actual.trim());
      actual = '';
    } else {
      actual += ch;
    }
  }
  campos.push(actual.trim());
  return campos;
}

const DATOS = DATOS_RAW.trim().split(/\r?\n/).filter(l => l.trim()).map(parsearLinea);
const DATOS_ORDENADOS = [...DATOS].sort((a, b) => a[0].localeCompare(b[0], 'es'));

// ELEMENTOS
// ============================================================================

const btnLimpiar = document.getElementById('btnLimpiar');
const resultsDiv = document.getElementById('results');

// Poblar select

  const opt = document.createElement('option');
  opt.value = idx;
  opt.textContent = fila[0];
  select.appendChild(opt);
});

// ============================================================================
// RENDERIZADO
// ============================================================================
function renderResultado() {
  const idx = select.value;
  if (idx === '') {
    resultsDiv.innerHTML = '';
    return;
  }

  const fila = DATOS_ORDENADOS[idx];
  const contenido = fila[0] || '';
  const codigo = fila[1] || '';
  const fondo = fila[2] || '';
  const banda1 = fila[3] || '';
  const banda2 = fila[4] || '';

  // Filas visibles solo si tienen datos
  let filasHtml = '';

  if (codigo) {
    filasHtml += `<tr><th>Código</th><td>${codigo}</td></tr>`;
  }
  if (fondo) {
    filasHtml += `<tr><th>Color de fondo</th><td>${fondo}</td></tr>`;
  }
  if (banda1) {
    filasHtml += `<tr><th>Primera banda de color</th><td>${banda1}</td></tr>`;
  }
  if (banda2) {
    filasHtml += `<tr><th>Segunda banda de color</th><td>${banda2}</td></tr>`;
  }

  // Construir franjas de la barra (solo las que tienen color)
  let barraHtml = '';
  const colores = [
    { nombre: fondo, flex: 2 },
    { nombre: banda1, flex: 1 },
    { nombre: banda2, flex: 1 }
  ];
  colores.forEach(c => {
    if (c.nombre && c.nombre.trim()) {
      const estiloFlex = c.flex === 2 ? 'flex:2;' : 'flex:1;max-width:45px;';
      barraHtml += `<div class="franja" style="background:${colorCSS(c.nombre)};${estiloFlex}" title="${c.nombre}"></div>`;
    }
  });

  // Solo añadir la fila "Barra" si hay al menos una franja
  if (barraHtml) {
    filasHtml += `<tr><th>Tuberia</th><td><div class="barra-colores">${barraHtml}</div></td></tr>`;
  }

  // Si no hay ninguna fila, mostrar mensaje
  if (!filasHtml) {
    filasHtml = `<tr><td colspan="2" class="no-results">Sin datos disponibles para este contenido.</td></tr>`;
  }

  resultsDiv.innerHTML = `
    <div class="card-result">
      <div class="card-title">${contenido}</div>
      <table class="data-table">
        ${filasHtml}
      </table>
    </div>
  `;
}

select.addEventListener('change', renderResultado);

btnLimpiar.addEventListener('click', function() {
  select.value = '';
  resultsDiv.innerHTML = '';
});
</script>
