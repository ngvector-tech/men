<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compatibilidad de Metales</title>
<style>
  /* ============ ESTILOS BASE ============ */
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 16px 11px 40px;
    color: #222;
  }

  /* ============ CONTENEDOR PRINCIPAL ÚNICO ============ */
  .container {
    max-width: 427px;
    margin: 0 auto;
    background: #fff;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    padding: 16px 19px 21px;
  }

  /* ============ CABECERA UNIFICADA (LA ÚNICA BARRA NEGRA) ============ */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #17212b;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand-title {
    font-size: 15px;
    font-weight: 700;
    color: #1e5fa8;
    background: #fff;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .brand-sub {
    font-size: 13px;
    color: #d9e1e7;
    font-weight: 600;
  }
  .brand-author {
    font-size: 11px;
    color: #89949e;
  }
  .header-right h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: #e8f0fa;
    background: transparent;
    padding: 0;
    text-align: right;
    line-height: 1.2;
  }

  /* ============ CONTENIDO INTERNO ============ */
  .legend {
    font-size: 9px;
    line-height: 1.5;
    color: #333;
    background: #f4f6f8;
    border: 1px solid #e0e3e6;
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 13px;
  }
  .legend b { color: #111; }
  .field { margin-bottom: 11px; }
  .field label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: #444;
    margin-bottom: 3px;
  }
  input[type="text"] {
    width: 100%;
    padding: 6px 7px;
    font-size: 10px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    background: #fff;
  }
  input:focus { outline: none; border-color: #4a90d9; }

  /* --- DESPLEGABLE PERSONALIZADO --- */
  .custom-select-container {
    position: relative;
    width: 100%;
  }
  .custom-select-input {
    width: 100%;
    padding: 6px 7px;
    font-size: 10px;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    background: #fff;
    color: #222;
    cursor: pointer;
  }
  .custom-select-input:focus { outline: none; border-color: #4a90d9; }

  .custom-select-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    max-height: 200px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #c7ccd1;
    border-radius: 4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 100;
    display: none;
    margin-top: 2px;
  }
  .custom-select-dropdown.active { display: block; }

  .custom-select-option {
    padding: 6px 8px;
    font-size: 10px;
    color: #333;
    cursor: pointer;
    transition: background 0.1s;
  }
  .custom-select-option:hover { background: #eef0f2; }

  #results { margin-top: 15px; }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 9px;
    margin-bottom: 4px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 10px;
  }
  .result-row .mat-name { font-weight: 700; }
  .result-row .mat-desc { font-weight: 500; font-size: 9px; }
  .nivel-excelente { background: #2e7d32; color: #fff; }
  .nivel-bueno     { background: #a5d6a7; color: #1b5e20; }
  .nivel-pobre     { background: #ffb74d; color: #7a3e00; }
  .nivel-nousar    { background: #c62828; color: #fff; }
  .sin-dato {
    background: #f5f5f5;
    color: #999;
    font-style: italic;
    font-weight: 400;
  }
  .no-results {
    text-align: center;
    color: #888;
    font-size: 9px;
    padding: 13px 0;
  }
  .section-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #999;
    margin: 12px 0 5px;
  }
  #btnLimpiar {
    background: #111;
    color: #fff;
    border: none;
    padding: 7px 12px;
    font-size: 9px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 5px;
    margin-bottom: 11px;
    width: 100%;
    transition: background 0.2s;
  }
  #btnLimpiar:hover {
    background: #333;
  }

  /* ============ BOTÓN VOLVER ============ */
  .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #ecf0f1;
      color: #34495e;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: Arial, sans-serif;
  }
  .btn-volver:hover { background-color: #e0e6ed; border-color: #95a5a6; color: #2c3e50; }
  .btn-volver:active { transform: scale(0.98); }
</style>
</head>
<body>

<div class="container">
  
  <!-- BARRA OSCURA UNIFICADA -->
  <div class="header-top">
    <div class="header-left">
      <span class="brand-title">MEN</span>
      <span class="brand-sub">Montajes Industriales S. L.</span>
      <span class="brand-author">Creado por: J.N.G</span>
    </div>
    <div class="header-right">
      <h1>Compatibilidad<br>de Metales</h1>
    </div>
  </div>

  <!-- CONTENIDO -->
  <a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>

  <div class="legend">
    <b>Excelente</b> · <b>Bueno</b> · <b>Pobre</b> · <b>No usar</b><br>
    Selecciona un ingrediente para ver la compatibilidad con cada metal.
  </div>

  <!-- CAMPO CON EL DESPLEGABLE PERSONALIZADO -->
  <div class="field">
    <label for="ingredienteInput">Ingrediente</label>
    <div class="custom-select-container">
      <input type="text" id="ingredienteInput" class="custom-select-input"
             placeholder="Escribe o selecciona un ingrediente..." autocomplete="off">
      <div class="custom-select-dropdown" id="ingredienteDropdown"></div>
    </div>
    <button type="button" id="btnLimpiar">Nueva consulta</button>
  </div>

  <div id="results"></div>
</div>

<script>
const METALES = [
  "Acero al carbono",
  "Acero inoxidable 17_4PH",
  "Acero inoxidable 316",
  "Acero inoxidable Alloy 20",
  "Hastelloy C",
  "Hierro ducti_hierro fundido",
  "Laton_bronce",
  "Metal _A",
  "Metal _G",
  "Monel"
];

const ORDEN = { "Excelente": 0, "Bueno": 1, "Pobre": 2, "No usar": 3 };
const CLASE = {
  "Excelente": "nivel-excelente",
  "Bueno": "nivel-bueno",
  "Pobre": "nivel-pobre",
  "No usar": "nivel-nousar"
};

// (Se mantiene tu array DATA original completo. 
// En este ejemplo recortado, asegúrate de pegar tu DATA completo).
const DATA = [
["Aceite Crudo, agrio","Bueno","","Excelente","Excelente","","Pobre","Pobre","Excelente","Excelente","Bueno"],
["Aceite Crudo, dulce","Bueno","","Excelente","Excelente","","Bueno","Bueno","Excelente","Excelente","Excelente"],
["Aceite de Alquitran","Excelente","Excelente","Excelente","Excelente","","Excelente","Excelente","Excelente","Excelente","Excelente"],
["Aceite de Castor","Bueno","","Excelente","Excelente","Excelente","Bueno","Excelente","Excelente","Excelente","Excelente"],
["Aceite de Cocina","Bueno","","Excelente","Excelente","","Bueno","Bueno","Excelente","Bueno","Excelente"],
["Aceite de Coco","Pobre","","Bueno","Excelente","","Pobre","Bueno","Bueno","Bueno","Bueno"],
["Aceite de Creosota","Bueno","Bueno","Bueno","Excelente","Bueno","Bueno","Bueno","Bueno","Bueno","Bueno"],
["Aceite de Grasa de Cerdo","Pobre","","Bueno","Excelente","","Pobre","Bueno","Bueno","Bueno","Bueno"],
["Aceite de Linaza","Excelente","","Excelente","Excelente","","Excelente","Bueno","Excelente","Excelente","Bueno"],
["Aceite de Madera China","Pobre","","Excelente","Excelente","Excelente","Pobre","Pobre","Excelente","Excelente","Excelente"]
];

const ingredientesUnicos = [...new Set(DATA.map(r => r[0]))].sort((a,b) => a.localeCompare(b, 'es'));

const ingredienteInput = document.getElementById('ingredienteInput');
const ingredienteDropdown = document.getElementById('ingredienteDropdown');
const resultsDiv = document.getElementById('results');

// --- LÓGICA DEL DESPLEGABLE PERSONALIZADO ---
function renderIngredienteDropdown(filtro = "") {
  ingredienteDropdown.innerHTML = '';
  const filtrados = ingredientesUnicos.filter(i => i.toLowerCase().includes(filtro.toLowerCase()));

  if (filtrados.length === 0) {
    ingredienteDropdown.classList.remove('active');
    return;
  }

  filtrados.forEach(i => {
    const div = document.createElement('div');
    div.className = 'custom-select-option';
    div.textContent = i;
    
    div.addEventListener('mousedown', (e) => {
      e.preventDefault(); // Evita que el input pierda el foco
      ingredienteInput.value = i;
      ingredienteDropdown.classList.remove('active');
      onIngredienteChange();
    });
    ingredienteDropdown.appendChild(div);
  });
}

ingredienteInput.addEventListener('focus', () => {
  renderIngredienteDropdown(ingredienteInput.value.trim() === '' ? '' : ingredienteInput.value);
  ingredienteDropdown.classList.add('active');
});

ingredienteInput.addEventListener('input', (e) => {
  renderIngredienteDropdown(e.target.value);
  ingredienteDropdown.classList.add('active');
  onIngredienteChange();
});

document.addEventListener('click', (e) => {
  if (!ingredienteInput.contains(e.target) && !ingredienteDropdown.contains(e.target)) {
    ingredienteDropdown.classList.remove('active');
  }
});
// ----------------------------------------------

function renderResultados(registro) {
  resultsDiv.innerHTML = '';
  if (!registro) {
    resultsDiv.innerHTML = '<div class="no-results">Sin datos para este ingrediente.</div>';
    return;
  }

  const conValor = [];
  const sinValor = [];

  METALES.forEach((metal, idx) => {
    const letra = registro[1 + idx];
    if (letra === "" || letra === undefined) {
      sinValor.push(metal);
    } else {
      conValor.push({ metal, letra });
    }
  });

  conValor.sort((a, b) => (ORDEN[a.letra] ?? 99) - (ORDEN[b.letra] ?? 99));

  conValor.forEach(({ metal, letra }) => {
    const row = document.createElement('div');
    row.className = 'result-row ' + (CLASE[letra] || '');
    row.innerHTML = `<span class="mat-name">${metal}</span><span class="mat-desc">${letra}</span>`;
    resultsDiv.appendChild(row);
  });

  if (sinValor.length > 0) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'Sin valorar';
    resultsDiv.appendChild(label);

    sinValor.forEach(metal => {
      const row = document.createElement('div');
      row.className = 'result-row sin-dato';
      row.innerHTML = `<span class="mat-name">${metal}</span><span class="mat-desc">Sin valorar</span>`;
      resultsDiv.appendChild(row);
    });
  }
}

function onIngredienteChange() {
  const ing = ingredienteInput.value.trim();
  if (!ingredientesUnicos.includes(ing)) {
    resultsDiv.innerHTML = '';
    return;
  }
  const registro = DATA.find(r => r[0] === ing);
  renderResultados(registro);
}

document.getElementById('btnLimpiar').addEventListener('click', function() {
  ingredienteInput.value = '';
  ingredienteDropdown.classList.remove('active');
  resultsDiv.innerHTML = '';
  ingredienteInput.focus();
});
</script>

</body>
</html>
