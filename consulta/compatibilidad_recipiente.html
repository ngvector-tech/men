    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 5px;
  }

    width: 100%;
    padding: 9px 10px;
    font-size: 15px;
    border: 1px solid #c7ccd1;
    border-radius: 6px;
    background: #fff;
  }
  input:focus { outline: none; border-color: #4a90d9; }
  #results { margin-top: 22px; }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 6px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 15px;
  }
  .result-row .mat-name { font-weight: 700; }
  .result-row .mat-desc { font-weight: 500; font-size: 13px; }
  .nivel-excelente { background: #2e7d32; color: #fff; }
  .nivel-bueno     { background: #a5d6a7; color: #1b5e20; }
  .nivel-pobre     { background: #ffb74d; color: #7a3e00; }
  .nivel-nousar    { background: #c62828; color: #fff; }
  .sin-dato {
    background: #f5f5f5;
    color: #999;
    font-style: italic;
    font-weight: 400;
  }
  .no-results {
    text-align: center;
    color: #888;
    font-size: 14px;
    padding: 20px 0;
  }
  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #999;
    margin: 18px 0 8px;
  }
  #btnLimpiar {
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 16px;
    width: 100%;
    transition: background 0.2s;
  }
  #btnLimpiar:hover {
    background: #333;
  }
</style>
</head>

<div class="container">

// Construir lista única de ingredientes ordenada alfabéticamente
const ingredientesUnicos = [...new Set(DATA.map(r => r[0]))].sort((a,b) => a.localeCompare(b, 'es'));

const ingredienteInput = document.getElementById('ingredienteInput');
const ingredienteList = document.getElementById('ingredienteList');
const resultsDiv = document.getElementById('results');

ingredientesUnicos.forEach(i => {
  const opt = document.createElement('option');
  opt.value = i;
  ingredienteList.appendChild(opt);
});

function renderResultados(registro) {
  resultsDiv.innerHTML = '';
  if (!registro) {
    resultsDiv.innerHTML = '<div class="no-results">Sin datos para este ingrediente.</div>';
    return;
  }

  const conValor = [];
  const sinValor = [];

  METALES.forEach((metal, idx) => {
    const letra = registro[1 + idx];
    if (letra === "" || letra === undefined) {
      sinValor.push(metal);
    } else {
      conValor.push({ metal, letra });
    }
  });

  conValor.sort((a, b) => (ORDEN[a.letra] ?? 99) - (ORDEN[b.letra] ?? 99));

  conValor.forEach(({ metal, letra }) => {
    const row = document.createElement('div');
    row.className = 'result-row ' + (CLASE[letra] || '');
    row.innerHTML = `<span class="mat-name">${metal} — ${letra}</span><span class="mat-desc">${letra}</span>`;
    resultsDiv.appendChild(row);
  });

  if (sinValor.length > 0) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'Sin valorar';
    resultsDiv.appendChild(label);

    sinValor.forEach(metal => {
      const row = document.createElement('div');
      row.className = 'result-row sin-dato';
      row.innerHTML = `<span class="mat-name">${metal}</span><span class="mat-desc">Sin valorar</span>`;
      resultsDiv.appendChild(row);
    });
  }
}

function onIngredienteChange() {
  const ing = ingredienteInput.value.trim();
  if (!ingredientesUnicos.includes(ing)) {
    resultsDiv.innerHTML = '';
    return;
  }
  const registro = DATA.find(r => r[0] === ing);
  renderResultados(registro);
}

ingredienteInput.addEventListener('input', onIngredienteChange);
ingredienteInput.addEventListener('change', onIngredienteChange);
document.getElementById('btnLimpiar').addEventListener('click', function() {
  // Limpiar la selección del ingrediente
  const ingredienteInput = document.getElementById('ingredienteInput');
  ingredienteInput.value = '';

  // Vaciar el contenedor de resultados
  document.getElementById('results').innerHTML = '';

  // Dejar el foco nuevamente en el input
  ingredienteInput.focus();
});
</script>
