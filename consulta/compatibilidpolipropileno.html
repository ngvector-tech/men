const reactivoInput = document.getElementById('reactivoInput');
const reactivoList = document.getElementById('reactivoList');
const concField = document.getElementById('concField');
const concSelect = document.getElementById('concSelect');
const tempField = document.getElementById('tempField');
const tempSelect = document.getElementById('tempSelect');
const resultsDiv = document.getElementById('results');
const btnLimpiar = document.getElementById('btnLimpiar');

function init() {
  const reactivosUnicos = [...new Set(DATA.map(item => item[0]))].sort();
  reactivoList.innerHTML = '';
  reactivosUnicos.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r;
    reactivoList.appendChild(opt);
  });
}

reactivoInput.addEventListener('input', () => {
  const val = reactivoInput.value.trim();
  const opciones = DATA.filter(item => item[0].toLowerCase() === val.toLowerCase());

  if (opciones.length > 0) {
    concSelect.innerHTML = '';

    if (opciones.length > 1) {
      const optDefault = document.createElement('option');
      optDefault.value = "todas";
      optDefault.textContent = "-- Todas las concentraciones --";
      concSelect.appendChild(optDefault);
    }

    opciones.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item[1];
      opt.textContent = item[1] || 'Estándar / Única';
      concSelect.appendChild(opt);
    });

    concField.style.display = 'block';
    tempField.style.display = 'block';
    renderResults();
  } else {
    concField.style.display = 'none';
    tempField.style.display = 'none';
    resultsDiv.innerHTML = '';
  }
});

concSelect.addEventListener('change', renderResults);
tempSelect.addEventListener('change', renderResults);

function getResistenciaClass(resTexto) {
  if (!resTexto || resTexto === "Sin datos" || resTexto.trim() === "") return "res-sin-dato";
  const text = resTexto.toLowerCase();
  if (text.includes("alta")) return "res-alta";
  if (text.includes("moderada")) return "res-moderada";
  return "res-no";
}

function renderResults() {
  const reactivoVal = reactivoInput.value.trim();
  const concVal = concSelect.value;
  const tempVal = tempSelect.value;

  let filtrados = DATA.filter(item => item[0].toLowerCase() === reactivoVal.toLowerCase());

  if (concVal && concVal !== "todas") {
    filtrados = filtrados.filter(item => item[1] === concVal);
  }

  resultsDiv.innerHTML = '';

  if (filtrados.length === 0) {
    resultsDiv.innerHTML = '<div style="text-align:center; color:#888;">No se encontraron resultados.</div>';
    return;
  }

  filtrados.forEach(item => {
    const [reactivo, concentracion, res20, res60] = item;

    let cardClass = "res-alta";
    if (tempVal === "20") {
      cardClass = getResistenciaClass(res20);
    } else if (tempVal === "60") {
      cardClass = getResistenciaClass(res60);
    } else {
      const c20 = getResistenciaClass(res20);
      const c60 = getResistenciaClass(res60);
      cardClass = (c20 === "res-alta" || c60 === "res-alta") ? "res-alta" : (c20 === "res-moderada" || c60 === "res-moderada") ? "res-moderada" : "res-no";
    }

    const card = document.createElement('div');
    card.className = `result-card ${cardClass}`;

    let htmlDetails = '';
    if (tempVal === "todas" || tempVal === "20") {
      htmlDetails += `<div class="res-detail"><span>Resistencia a 20°C:</span> <strong>${res20}</strong></div>`;
    }
    if (tempVal === "todas" || tempVal === "60") {
      htmlDetails += `<div class="res-detail"><span>Resistencia a 60°C:</span> <strong>${res60 || 'Sin datos'}</strong></div>`;
    }

    card.innerHTML = `
      <div class="result-header">
        <span class="reactivo-name">${reactivo}</span>
        <span class="conc-tag">Conc: ${concentracion || 'N/A'}</span>
      </div>
      ${htmlDetails}
    `;

    resultsDiv.appendChild(card);
  });
}

btnLimpiar.addEventListener('click', () => {
  reactivoInput.value = '';
  concField.style.display = 'none';
  tempField.style.display = 'none';
  resultsDiv.innerHTML = '';
});

init();
</script>
