<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef0f2; margin: 0; padding: 16px 11px 40px; color: #222; display: block !important; }
  .container { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 7px; box-shadow: 0 2px 7px rgba(0,0,0,0.08); padding: 16px 19px 21px; }

  /* Línea de resumen debajo del título */

    text-align: center;
    color: #a03428;
    font-weight: bold;
    font-size: 9px;
    margin: 4px 0 12px;
    min-height: 13px;
    letter-spacing: 0.3px;

  .col { display: table-cell; width: 50%; padding-right: 5px; vertical-align: top; }
  .col:last-child { padding-right: 0; padding-left: 5px; }

  select:disabled { background: #f4f6f8; color: #aaa; cursor: not-allowed; }

  #btnLimpiar:hover { background: #333; }
  .image-container { text-align: center; margin: 13px 0; padding: 10px; background: #fafafa; border: 1px dashed #ccc; border-radius: 5px; }

  .img-placeholder { font-size: 9px; color: #888; font-style: italic; }
  #results { margin-top: 13px; }
  .card-result { background: #f8f9fa; border: 1px solid #e0e3e6; border-radius: 5px; padding: 11px; margin-bottom: 8px; }
  .card-title { font-size: 10px; font-weight: bold; color: #111; margin-bottom: 8px; border-bottom: 2px solid #4a90d9; padding-bottom: 3px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 9px; }
  .data-table th, .data-table td { padding: 5px 7px; border-bottom: 1px solid #e2e8f0; text-align: left; }
  .data-table th { background: #edf2f7; color: #4a5568; font-weight: 600; }
  .no-results { text-align: center; color: #888; font-size: 9px; padding: 13px 0; }
  #loadingMsg { text-align: center; color: #0284c7; font-weight: bold; padding: 9px; font-size: 9px; }
  .bloque-tornilleria { margin-bottom: 12px; padding: 11px 12px; background: #fff7ed; border: 1px solid #fed7aa; border-left: 4px solid #ea580c; border-radius: 5px; }
  .bloque-tornilleria h3 { margin: 0 0 8px; font-size: 9px; color: #9a3412; text-transform: uppercase; letter-spacing: 0.5px; }
  .bloque-tornilleria .linea-calc { font-size: 10px; font-weight: bold; color: #b42318; margin: 4px 0; }
  .bloque-tornilleria .linea-nota { font-size: 8px; color: #78716c; margin-top: 7px; }
  .bloque-tornilleria .btn-ir { display: block; width: 100%; margin-top: 9px; padding: 8px; background: #16a34a; color: #fff; border: none; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
  .bloque-tornilleria .btn-ir-sec { display: block; width: 100%; margin-top: 5px; padding: 7px; background: #fff; color: #b42318; border: 1px solid #ea580c; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; }

  /* ============ DESPLEGABLE DE TIPOS DE CARAS ============ */
  #tipoSelect { width: 100%; padding: 6px 7px; font-size: 9px; border: 1px solid #c7ccd1; border-radius: 4px; background: #fff; }
  #tipoSelect:focus { outline: none; border-color: #4a90d9; }

  /* ============ VENTANA FLOTANTE PARA IMAGEN DE TIPO ============ */
#imgTipoFlotante {
    position: fixed;
    background: #fff;
    border: 2px solid #0284c7;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    padding: 6px;               /* ← Reducido de 10px a 6px */
    z-index: 99999;
    display: none;
    max-width: 320px;           /* ← Ancho máximo fijo (antes 90vw) */
    max-height: 200vh;           /* ← Alto máximo reducido */
    overflow: visible;
}

#imgTipoFlotante img {
    max-width: 100%;
    max-height: 60vh;           /* ← Imagen más pequeña (antes 60vh) */
    object-fit: contain;
    display: block;
    margin: 0 auto;
}
    #imgTipoFlotante.activa { display: block; }
  #imgTipoFlotante .titulo {
    font-size: 10px;
    font-weight: bold;
    color: #0284c7;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #imgTipoFlotante .cerrar {
    position: absolute;
    top: -10px;
    right: -10px;
    background: #dc2626;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  #imgTipoFlotante .cerrar:hover { background: #b91c1c; }
</style>

<body>

<div class="container">
  <h1>Consulta Tecnica de Bridas</h1>
  <div class="resumen-seleccion" id="resumenSeleccion"></div>

  <div id="loadingMsg">⏳ Cargando base de datos...</div>

  <div id="formulario" style="display:none;">
    <div class="grid-2">
      <div class="col"><div class="field"><label for="catSelect">1. Categoría</label><select id="catSelect"><option value="">-- Selecciona Categoria --</option></select></div></div>
      <div class="col"><div class="field"><label for="normaSelect">2. Norma</label><select id="normaSelect" disabled><option value="">-- Selecciona Norma --</option></select></div></div>
    </div>
    <div class="grid-2">
      <div class="col"><div class="field"><label for="dnSelect">3. Diametro Nominal (DN)</label><select id="dnSelect" disabled><option value="">-- Selecciona DN --</option></select></div></div>
      <div class="col"><div class="field"><label for="pnSelect">4. Presion (PN / Lbs)</label><select id="pnSelect" disabled><option value="">-- Selecciona PN --</option></select></div></div>
    </div>
    <div class="grid-2">
      <div class="col">
        <div class="field">
          <label for="matSelect">5. Material de la tornillería</label>
          <select id="matSelect">
            <option value="ZINC">ZINC (acero galvanizado)</option>
            <option value="304">304 (inoxidable A2)</option>
          </select>
        </div>
      </div>
      <div class="col">
        <div class="field">
          <label for="tipoSelect">6. Tipos de caras</label>
          <select id="tipoSelect">
            <option value="">-- Selecciona tipo de cara --</option>
            <option value="tipo A">tipo A</option>
            <option value="tipo B">tipo B</option>
            <option value="tipo C D">tipo C D</option>
            <option value="tipo E F">tipo E F</option>
            <option value="tipo G H">tipo G H</option>
          </select>
        </div>
      </div>

    <button type="button" id="btnLimpiar">Nueva consulta</button>

    <div id="panelTornilleria"></div>

    <div class="image-container" id="imgBox">
      <span class="img-placeholder">Selecciona una categoria para ver su esquema</span>
    </div>

    <div id="results"></div>
  </div>
</div>

<!-- VENTANA FLOTANTE PARA IMAGEN DE TIPO DE CARA -->
<div id="imgTipoFlotante">
    <button class="cerrar" onclick="cerrarImgTipo(event)" title="Cerrar">✕</button>
    <div class="titulo" id="imgTipoTitulo">Tipo</div>
    <img id="imgTipoSrc" src="" alt="Tipo de cara">
</div>

<script>
let DATA = [], lineasArticulos = [];
const catSelect = document.getElementById('catSelect');
const normaSelect = document.getElementById('normaSelect');
const dnSelect = document.getElementById('dnSelect');
const pnSelect = document.getElementById('pnSelect');
const matSelect = document.getElementById('matSelect');
const btnLimpiar = document.getElementById('btnLimpiar');
const imgBox = document.getElementById('imgBox');
const resultsDiv = document.getElementById('results');
const panelTornilleria = document.getElementById('panelTornilleria');
const resumenSeleccion = document.getElementById('resumenSeleccion');

function limpiarCampo(valor) {
  valor = String(valor == null ? '' : valor).trim();
  valor = valor.replace(/^\[\s*/, '').replace(/\s*\]$/, '').trim();
  if (valor === '') return '';
  const match = valor.match(/^(-?\d+),(\d+)$/);
  if (match) {
    const entero = match[1];
    let decimal = match[2];
    if (decimal.length > 4) {
      const num = parseFloat(`${entero}.${decimal}`);
      decimal = num.toFixed(2).split('.')[1].replace(/0+$/, '');
      if (decimal === '') return entero;
    }
    return `${entero},${decimal}`;
  }
  return valor;
}

function parsearCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const filas = [];
  const lineas = text.split(/\r?\n/);
  for (const linea of lineas) {
    const l = linea.trim();
    if (!l || l.startsWith('#')) continue;
    const campos = [];
    let actual = '', dentroComillas = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (ch === '"') {
        if (dentroComillas && l[i + 1] === '"') { actual += '"'; i++; }
        else dentroComillas = !dentroComillas;
      } else if (ch === ',' && !dentroComillas) { campos.push(limpiarCampo(actual)); actual = ''; }
      else { actual += ch; }
    }
    campos.push(limpiarCampo(actual));
    if (campos.length >= 3) filas.push(campos);
  }
  return filas;
}

function claseNorma(norma) {
  const t = String(norma || '').toUpperCase();
  if (t.includes('ANTIGUA')) return 'norma-antigua';
  return 'norma-actual';
}

function colorNorma(norma) {
  return claseNorma(norma) === 'norma-antigua' ? '#a03428' : '#256b2c';
}

function ordenarNormas(normas) {
  const prioridad = (n) => {
    const t = String(n).toUpperCase().replace(/\s+/g, '');
    if (t.includes('EN-1092') || t.includes('EN1092')) return 0;
    if (t.includes('DIN')) return 1;
    if (t.includes('ANSI') || t.includes('ASME')) return 2;
    if (t.includes('AWWA')) return 3;
    if (t.includes('BS-3293') || t.includes('BS3293')) return 4;
    if (t.includes('EEMUA')) return 5;
    if (t.includes('JIS')) return 6;
    return 7;
  };
  return normas.sort((a, b) => {
    const pa = prioridad(a), pb = prioridad(b);
    if (pa !== pb) return pa - pb;
    return String(a).localeCompare(String(b), 'es');
  });
}

function aplicarColorSeleccionNorma() {
  const opt = normaSelect.options[normaSelect.selectedIndex];
  const texto = opt ? opt.text : '';
  if (!texto || texto.startsWith('--')) {
    normaSelect.style.color = '';
    normaSelect.style.fontWeight = '';
    return;
  }
  normaSelect.style.color = colorNorma(texto);
  normaSelect.style.fontWeight = '600';
}

function actualizarResumen() {
  const partes = ['BRIDA'];
  const cat = catSelect.value;
  const norma = normaSelect.value;
  const dn = dnSelect.value;
  const pn = pnSelect.value;
  const mat = matSelect.value;

  if (cat) partes.push(cat);
  if (norma) partes.push(norma);
  if (dn) partes.push(dn);
  if (pn) partes.push(pn);
  if (mat) partes.push(mat);

  resumenSeleccion.textContent = partes.join(' · ');
}

async function cargarBridas() {
  try {
    const res = await fetch('bridas.csv');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = parsearCSV(await res.text());
    console.log(`✓ ${DATA.length} filas cargadas desde bridas.csv`);
  } catch (e) { console.error('❌ Error bridas.csv:', e); alert('No se pudo cargar bridas.csv'); }
}

async function cargarArticulos() {
  try {
    const res = await fetch('../Pedidos desde obra/articulos.txt');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lineasArticulos = (await res.text()).split(/\r?\n/).map(l => l.trim()).filter(l => l).map(l => l.split(';').map(c => c.replace(/^"|"$/g, '').trim()));
    console.log(`✓ ${lineasArticulos.length} líneas desde articulos.txt`);
  } catch (e) { console.error('❌ Error articulos.txt:', e); }
}

async function init() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('formulario').style.display = 'none';
  await Promise.all([cargarBridas(), cargarArticulos()]);
  if (DATA.length === 0) { document.getElementById('loadingMsg').innerHTML = '❌ No se pudieron cargar los datos'; return; }
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('formulario').style.display = 'block';
  initCategories();
  actualizarResumen();
}

function initCategories() {
  const cats = [...new Set(DATA.map(item => item[0]))].filter(Boolean).sort();
  catSelect.innerHTML = '<option value="">-- Selecciona Categoría --</option>';
  cats.forEach(cat => { catSelect.innerHTML += `<option value="${cat}">${cat}</option>`; });
}

function updateImage(cat) {
  if (!cat) { imgBox.innerHTML = '<span class="img-placeholder">Selecciona una categoria</span>'; return; }
  const imgPath = `img/${cat.toLowerCase()}.png`;
  imgBox.innerHTML = `<img src="${imgPath}" alt="${cat}" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\\'img-placeholder\\'>Imagen no encontrada: ${imgPath}</span>';">`;
}

function rellenarSelect(select, opciones, placeholder, previo) {
  select.innerHTML = `<option value="">${placeholder}</option>`;
  opciones.forEach(o => {
    select.innerHTML += `<option value="${o.valor}" class="${o.clase || ''}">${o.etiqueta}</option>`;
  });
  if (previo && opciones.some(o => o.valor === previo)) {
    select.value = previo;
    return true;
  }
  return false;
}

catSelect.addEventListener('change', function() {
  const cat = this.value;
  updateImage(cat);
  const previaNorma = normaSelect.value;
  const previaDN = dnSelect.value;
  const previaPN = pnSelect.value;

  normaSelect.disabled = !cat;
  if (cat) {
    const normas = [...new Set(
      DATA.filter(item => item[0] === cat)
          .flatMap(item => [item[12], item[11]])
    )].filter(Boolean);

    const ordenadas = ordenarNormas(normas);
    const opciones = ordenadas.map(n => ({
      valor: n,
      etiqueta: n,
      clase: claseNorma(n)
    }));
    const ok = rellenarSelect(normaSelect, opciones, '-- Selecciona Norma --', previaNorma);
    if (ok) normaSelect.dispatchEvent(new Event('change'));
    else {
      dnSelect.innerHTML = '<option value="">-- Selecciona DN --</option>';
      pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';
      dnSelect.disabled = true; pnSelect.disabled = true;
      resultsDiv.innerHTML = ''; panelTornilleria.innerHTML = '';
      aplicarColorSeleccionNorma();
      actualizarResumen();
    }
  } else {
    normaSelect.innerHTML = '<option value="">-- Selecciona Norma --</option>';
    dnSelect.innerHTML = '<option value="">-- Selecciona DN --</option>';
    pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';
    dnSelect.disabled = true; pnSelect.disabled = true;
    resultsDiv.innerHTML = ''; panelTornilleria.innerHTML = '';
    aplicarColorSeleccionNorma();
    actualizarResumen();
  }
});

normaSelect.addEventListener('change', function() {
  const cat = catSelect.value, norma = this.value;
  const previaDN = dnSelect.value;

  aplicarColorSeleccionNorma();
  actualizarResumen();

  dnSelect.disabled = !norma;
  if (norma) {
    const dns = [...new Set(
      DATA.filter(item => item[0] === cat && (item[12] === norma || item[11] === norma))
          .map(item => item[1])
    )].filter(Boolean);

    const opciones = dns.map(dn => ({ valor: dn, etiqueta: dn }));
    const ok = rellenarSelect(dnSelect, opciones, '-- Selecciona DN --', previaDN);
    if (ok) dnSelect.dispatchEvent(new Event('change'));
    else {
      pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';
      pnSelect.disabled = true;
      resultsDiv.innerHTML = ''; panelTornilleria.innerHTML = '';
      actualizarResumen();
    }
  } else {
    dnSelect.innerHTML = '<option value="">-- Selecciona DN --</option>';
    pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';
    pnSelect.disabled = true;
    resultsDiv.innerHTML = ''; panelTornilleria.innerHTML = '';
    actualizarResumen();
  }
});

dnSelect.addEventListener('change', function() {
  const cat = catSelect.value, norma = normaSelect.value, dn = this.value;
  const previaPN = pnSelect.value;

  actualizarResumen();

  pnSelect.disabled = !dn;
  if (dn) {
    const pns = [...new Set(
      DATA.filter(item => item[0] === cat && (item[12] === norma || item[11] === norma) && item[1] === dn)
          .map(item => item[2])
    )].filter(Boolean);

    const opciones = pns.map(pn => ({ valor: pn, etiqueta: pn }));
    const ok = rellenarSelect(pnSelect, opciones, '-- Selecciona PN --', previaPN);
    if (ok) pnSelect.dispatchEvent(new Event('change'));
    else { resultsDiv.innerHTML = ''; panelTornilleria.innerHTML = ''; actualizarResumen(); }
  } else {
    pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';
    resultsDiv.innerHTML = ''; panelTornilleria.innerHTML = '';
    actualizarResumen();
  }
});

pnSelect.addEventListener('change', function() {
  renderResults();
  actualizarResumen();
});

matSelect.addEventListener('change', function() {
  actualizarResumen();
  const cat = catSelect.value, norma = normaSelect.value, dn = dnSelect.value, pn = pnSelect.value;
  if (!cat || !norma || !dn || !pn) return;
  const matches = DATA.filter(item => 
    item[0] === cat && (item[12] === norma || item[11] === norma) && item[1] === dn && item[2] === pn
  );
  if (matches.length > 0) {
    panelTornilleria.innerHTML = generarPanelTornilleria(matches[0], matSelect.value);
  }
});

function renderResults() {
  const cat = catSelect.value, norma = normaSelect.value, dn = dnSelect.value, pn = pnSelect.value;
  if (!cat || !norma || !dn || !pn) { resultsDiv.innerHTML = ''; panelTornilleria.innerHTML = ''; return; }
  const matches = DATA.filter(item => 
    item[0] === cat && (item[12] === norma || item[11] === norma) && item[1] === dn && item[2] === pn
  );
  if (matches.length === 0) { resultsDiv.innerHTML = '<div class="no-results">Sin datos.</div>'; panelTornilleria.innerHTML = ''; return; }
  panelTornilleria.innerHTML = generarPanelTornilleria(matches[0], matSelect.value);

  let html = '';
  matches.forEach(m => {
    let descripcion = '';
    for (let i = m.length - 1; i >= 0; i--) { if (m[i] && m[i].trim()) { descripcion = m[i]; break; } }

    const colorPrincipal = colorNorma(m[12]);

    const normaPrincipalConDP = `${m[12]} · DN${m[1]} · ${m[2]}`;

    let filaCompatible = '';
    if (m[11]) {
      const colorComp = colorNorma(m[11]);
      const normaCompatibleConDP = `${m[11]} · DN${m[1]} · ${m[2]}`;
      filaCompatible = `<tr><th>Norma compatible</th><td style="color:${colorComp}; font-weight:bold;">${normaCompatibleConDP}</td></tr>`;
    }

    html += `
      <div class="card-result">
        <div class="card-title">${descripcion}</div>
        <table class="data-table">
          <tr><th>Categoría</th><td>${m[0]}</td></tr>
          <tr><th>Norma Principal</th><td style="color:${colorPrincipal}; font-weight:bold;">${normaPrincipalConDP}</td></tr>
          ${filaCompatible}
          <tr><th>DN</th><td>${m[1]}</td></tr>
          ${m[4] ? `<tr><th>Ø Exterior</th><td>${m[4]}</td></tr>` : ''}
          ${m[5] ? `<tr><th>Ø Interior</th><td>${m[5]}</td></tr>` : ''}
          ${m[6] ? `<tr><th>Espesor</th><td>${m[6]}</td></tr>` : ''}
          ${m[8] ? `<tr><th>Nº Taladros</th><td>${m[8]}</td></tr>` : ''}
          ${m[9] ? `<tr><th>Ø Taladro</th><td>${m[9]}</td></tr>` : ''}
          ${m[10] ? `<tr><th>K</th><td>${m[10]}</td></tr>` : ''}
        </table>
      </div>`;
  });
  resultsDiv.innerHTML = html;
}

function generarPanelTornilleria(fila, material) {
  const espesor = fila[6], nTaladros = parseInt(fila[8]) || 0, diamTaladro = fila[9];

  if (!nTaladros || !diamTaladro || !espesor) {
    return `<div class="bloque-tornilleria"><h3>🔩 Tornillería calculada</h3><p class="linea-nota">Sin datos suficientes.</p></div>`;
  }

  const metrico = diametroTornilloDesdeTaladro(diamTaladro);
  const longitud = calcularLongitudTornillo(espesor, metrico);
  const matU = material || 'ZINC';

  let refTornillo = buscarReferenciaArticulo('TORNILLOS', `${metrico}X${longitud}`, matU, 'DIN931');
  let longitudFinal = longitud;
  let esAlternativa = false;

  if (!refTornillo) {
    for (let L = longitud + 5; L <= longitud + 60; L += 5) {
      const refAlt = buscarReferenciaArticulo('TORNILLOS', `${metrico}X${L}`, matU, 'DIN931');
      if (refAlt) {
        refTornillo = refAlt;
        longitudFinal = L;
        esAlternativa = true;
        break;
      }
    }
  }

  const refTuerca = buscarReferenciaArticulo('TUERCAS', `M${metrico}`, matU, 'DIN934');

  let lineaTornillo;
  if (refTornillo && !esAlternativa) {
    lineaTornillo = `
      <div class="linea-calc">
        • TORNILLO HEXAGONAL DIN931 ${metrico}X${longitud} — ${nTaladros} ud.
        <span style="color:#16a34a;"> (REF ${refTornillo})</span>
      </div>`;
  } else if (refTornillo && esAlternativa) {
    lineaTornillo = `
      <div class="linea-calc" style="color:#b45309;">
        • TORNILLO HEXAGONAL DIN931 ${metrico}X${longitud} — ${nTaladros} ud.
        <span style="color:#dc2626;"> (NO existe en inventario)</span>
      </div>
      <div class="linea-calc" style="color:#b45309; margin-left:18px; padding:8px 10px; background:#fef3c7; border-left:3px solid #f59e0b; border-radius:4px;">
        ↳ <strong>Alternativa al alza codificado:</strong><br>
        TORNILLO HEXAGONAL DIN931 ${metrico}X${longitudFinal} — ${nTaladros} ud.
        <span style="color:#16a34a; font-weight:bold;"> (REF ${refTornillo})</span>
      </div>`;
  } else {
    lineaTornillo = `
      <div class="linea-calc" style="color:#b45309;">
        • TORNILLO HEXAGONAL DIN931 ${metrico}X${longitud} — ${nTaladros} ud.
        <span style="color:#dc2626;"> (sin REF en base, ni alternativa encontrada)</span>
      </div>`;
  }

  let lineaTuerca;
  if (refTuerca) {
    lineaTuerca = `
      <div class="linea-calc">
        • TUERCA DIN934 M${metrico} — ${nTaladros} ud.
        <span style="color:#16a34a;"> (REF ${refTuerca})</span>
      </div>`;
  } else {
    lineaTuerca = `
      <div class="linea-calc" style="color:#b45309;">
        • TUERCA DIN934 M${metrico} — ${nTaladros} ud.
        <span style="color:#dc2626;"> (sin REF en base)</span>
      </div>`;
  }

  const avisoCambio = esAlternativa ? `
    <div style="
      margin-top:16px;
      padding:14px 16px;
      background:#fef3c7;
      border:2px solid #f59e0b;
      border-left:6px solid #dc2626;
      border-radius:6px;
      font-size:14px;
      color:#7c2d12;
      line-height:1.5;
    ">
      <div style="font-weight:bold; font-size:15px; margin-bottom:8px; color:#b91c1c;">
        ⚠️ ADVERTENCIA: el tornillo se va a cambiar
      </div>
      <div style="margin-bottom:6px;">
        El tornillo calculado <strong>DIN931 ${metrico}X${longitud}</strong> no existe en la base.
      </div>
      <div>
        Se va a pedir el inmediato superior que sí tiene código:
        <div style="margin-top:8px; padding:10px 12px; background:#fff; border-radius:4px; font-weight:bold; color:#166534; font-size:15px;">
          DIN931 ${metrico}X${longitudFinal}
          <span style="color:#16a34a;"> (REF ${refTornillo})</span>
        </div>
      </div>
    </div>
  ` : '';

  const refPedirTornillo = refTornillo || '';
  const descPedirTornillo = esAlternativa
    ? `TORNILLO HEXAGONAL DIN931 ${metrico}X${longitudFinal}`
    : `TORNILLO HEXAGONAL DIN931 ${metrico}X${longitud}`;

  return `
    <div class="bloque-tornilleria">
      <h3>🔩 Tornillería calculada (1 unión)</h3>
      ${lineaTornillo}
      ${lineaTuerca}
      <div class="linea-nota">
        Ø taladro ${diamTaladro}mm → M${metrico}. Espesor plato ${espesor}mm. Material: <strong>${matU}</strong>.
      </div>
      ${avisoCambio}
      <button class="btn-ir" onclick="irATornillo('${refPedirTornillo}', '${descPedirTornillo}')">📋 Pedir el TORNILLO</button>
      <button class="btn-ir-sec" onclick="irATuerca('${refTuerca || ''}', 'TUERCA DIN934 M${metrico}')">📋 Pedir solo la TUERCA</button>
    </div>`;
}

function buscarReferenciaArticulo(cat, dim, mat, din) {
  if (!lineasArticulos.length) return null;
  const catU = cat.toUpperCase();
  const dimU = dim.toUpperCase();
  const matU = mat.toUpperCase();
  const dinU = (din || '').toUpperCase();

  for (const linea of lineasArticulos) {
    if (!linea || linea.length < 6) continue;
    if (String(linea[0]).toUpperCase() !== catU) continue;
    if (dinU && !String(linea[1]).toUpperCase().includes(dinU)) continue;
    if (String(linea[2]).toUpperCase() !== dimU) continue;
    if (String(linea[4]).toUpperCase() !== matU) continue;
    return String(linea[5]).trim();
  }
  return null;
}

function irATornillo(ref, descripcion) {
  const operario = (sessionStorage.getItem('operarioNombre') || '').trim();
  const obra = (sessionStorage.getItem('operarioObra') || '').trim();
  const params = new URLSearchParams();
  if (ref) params.set('ref', ref);
  params.set('desc', descripcion);
  params.set('tipo', 'tornillo');
  if (operario) params.set('operario', operario);
  if (obra) params.set('obra', obra);
  window.location.assign(`../Pedidos desde obra/index.html?${params.toString()}`);
}

function diametroTornilloDesdeTaladro(taladro) {
  const t = parseFloat(String(taladro).replace(',', '.'));
  if (isNaN(t)) return 0;

  const tabla = [
    [11,     10],
    [12,     10],
    [13.5,   12],
    [14,     12],
    [15.9,   16],
    [16,     16],
    [17.5,   20],
    [18,     16],
    [19.1,   20],
    [20,     16],
    [20.6,   22],
    [22.2,   22],
    [23.8,   24],
    [24,     20],
    [25.4,   24],
    [26.9,   27],
    [28.6,   27],
    [30.2,   30],
    [31.8,   30],
    [34.9,   33],
    [36.5,   36],
    [38.1,   36],
    [41.3,   39],
    [44.5,   42],
    [47.6,   45],
    [50.8,   48],
    [53.9,   52],
    [57.2,   56],
    [60.3,   60],
    [63.5,   64],
    [66.7,   68],
    [69.9,   72],
    [73.0,   76],
    [76.2,   80]
  ];

  for (const [d, m] of tabla) {
    if (Math.abs(t - d) < 0.3) return m;
  }

  let mejor = null;
  for (const [d, m] of tabla) {
    if (d <= t) {
      if (mejor === null || d > mejor[0]) mejor = [d, m];
    }
  }
  if (mejor) return mejor[1];

  return tabla[0][1];
}

function alturaTuercaDIN934(metrico) {
  const tabla = {
    4:3.2, 5:4, 6:5, 8:6.5, 10:8, 12:10, 14:11, 16:13, 18:15,
    20:16, 22:18, 24:19, 27:22, 30:24, 33:26, 36:29, 39:31,
    42:34, 45:36, 48:38, 52:42, 56:46, 60:48, 64:52, 68:56,
    72:60, 76:64, 80:68
  };
  return tabla[metrico] || 13;
}

function calcularLongitudTornillo(espesorPlaca, metrico) {
  const C = parseFloat(String(espesorPlaca).replace(',', '.')) || 0;
  const G = 4.5, hTuerca = alturaTuercaDIN934(metrico), P = 3;
  return Math.ceil((2 * C + G + 2 * hTuerca + P) / 5) * 5;
}

// Prefijo de la carpeta donde están las imágenes de tipos de cara
const RUTA_IMG_TIPOS = 'img/';

const tipoSelect = document.getElementById('tipoSelect');
const imgTipoFlotante = document.getElementById('imgTipoFlotante');
const imgTipoTitulo = document.getElementById('imgTipoTitulo');
const imgTipoSrc = document.getElementById('imgTipoSrc');

function mostrarImagenTipo(nombreTipo) {
    if (!nombreTipo) return;

    // Nombre del archivo: "tipo A.png" (coincide con las opciones del select)
    const nombreArchivo = `${nombreTipo}.png`;
    const rutaCompleta = RUTA_IMG_TIPOS + nombreArchivo;

    imgTipoTitulo.textContent = nombreTipo.toUpperCase();
    imgTipoSrc.src = rutaCompleta;
    imgTipoSrc.onerror = function() {
        this.onerror = null;
        imgTipoSrc.alt = 'Imagen no encontrada: ' + rutaCompleta;
        imgTipoSrc.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80"><rect width="100%" height="100%" fill="%23f1f5f9" stroke="%23cbd5e1"/><text x="50%" y="50%" font-family="Arial" font-size="11" fill="%2364748b" text-anchor="middle" dy=".3em">Imagen no encontrada</text></svg>';
    };

    // Posicionar encima del #imgBox (panel con la imagen de la brida)
    const rect = imgBox.getBoundingClientRect();
    imgTipoFlotante.classList.add('activa');

    requestAnimationFrame(() => {
        const ancho = imgTipoFlotante.offsetWidth;
        const alto = imgTipoFlotante.offsetHeight;

        let left = rect.left + (rect.width - ancho) / 2;
        let top  = rect.top - alto - 10;

        if (top < 10) top = rect.bottom + 10;
        if (left < 10) left = 10;
        if (left + ancho > window.innerWidth - 10) left = window.innerWidth - ancho - 10;
        if (top + alto > window.innerHeight - 10) top = window.innerHeight - alto - 10;

        imgTipoFlotante.style.left = left + 'px';
        imgTipoFlotante.style.top  = top + 'px';
    });
}

function cerrarImgTipo(event) {
    if (event) event.stopPropagation();
    imgTipoFlotante.classList.remove('activa');
    imgTipoSrc.src = '';
    if (tipoSelect) tipoSelect.value = '';
}

if (tipoSelect) {
    tipoSelect.addEventListener('change', function() {
        if (this.value) {
            mostrarImagenTipo(this.value);
        } else {
            cerrarImgTipo();
        }
    });
}

document.addEventListener('click', function(event) {
    if (!imgTipoFlotante.classList.contains('activa')) return;
    if (!imgTipoFlotante.contains(event.target) && event.target !== tipoSelect) {
        cerrarImgTipo();
    }
});

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && imgTipoFlotante.classList.contains('activa')) {
        cerrarImgTipo();
    }
});
