<script>
// ============================================================================
// VARIABLES GLOBALES
// ============================================================================
let DATA = [];               // Bridas desde bridas.csv
let lineasArticulos = [];    // Artículos (tornillos, tuercas, etc.)
let iframeListo = false;

const catSelect   = document.getElementById('catSelect');
const normaSelect = document.getElementById('normaSelect');
const dnSelect    = document.getElementById('dnSelect');
const pnSelect    = document.getElementById('pnSelect');
const btnLimpiar  = document.getElementById('btnLimpiar');
const imgBox      = document.getElementById('imgBox');
const resultsDiv  = document.getElementById('results');

// ============================================================================
// PARSER CSV — delimitador ',' fuera de comillas, respeta comas decimales
// ============================================================================
function limpiarCampo(valor) {
  valor = String(valor == null ? '' : valor).trim();
  // Quitar corchetes iniciales/finales que vienen del formato array
  valor = valor.replace(/^\[\s*/, '').replace(/\s*\]$/, '').trim();
  if (valor === '') return '';
  const match = valor.match(/^(-?\d+),(\d+)$/);
  if (match) {
    const entero = match[1];
    let decimal = match[2];
    if (decimal.length > 4) {
      const num = parseFloat(`${entero}.${decimal}`);
      decimal = num.toFixed(2).split('.')[1].replace(/0+$/, '');
      if (decimal === '') return entero;
    }
    return `${entero},${decimal}`;
  }
  return valor;
}
function parsearCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const filas = [];
  const lineas = text.split(/\r?\n/);

  for (const linea of lineas) {
    const l = linea.trim();
    if (!l || l.startsWith('#')) continue;

    const campos = [];
    let actual = '';
    let dentroComillas = false;

    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (ch === '"') {
        if (dentroComillas && l[i + 1] === '"') { actual += '"'; i++; }
        else dentroComillas = !dentroComillas;
      } else if (ch === ',' && !dentroComillas) {
        campos.push(limpiarCampo(actual));
        actual = '';
      } else {
        actual += ch;
      }
    }
    campos.push(limpiarCampo(actual));

    if (campos.length >= 3) {
      filas.push(campos);
    }
  }

  return filas;
}
// Orden de normas: primero EN-1092 (con cualquier variante), luego el resto
function ordenarNormas(normas) {
  const prioridad = (n) => {
    const t = String(n).toUpperCase().replace(/\s+/g, '');
    // Coincide con EN-1092, EN1092, EN 1092, EN1092-1...
    if (t.includes('EN-1092') || t.includes('EN1092')) return 0;
    if (t.includes('DIN')) return 1;
    if (t.includes('ANSI') || t.includes('ASME')) return 2;
    return 3;
  };
  return normas.sort((a, b) => {
    const pa = prioridad(a);
    const pb = prioridad(b);
    if (pa !== pb) return pa - pb;
    return String(a).localeCompare(String(b), 'es');
  });
}

// ============================================================================
// CARGA DE BRIDAS
// ============================================================================
async function cargarBridas() {
  try {
    const res = await fetch('bridas.csv');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    DATA = parsearCSV(text);
    console.log(`✓ ${DATA.length} filas cargadas desde bridas.csv`);
    const cats = [...new Set(DATA.map(r => r[0]))].filter(Boolean);
    console.log(`✓ ${cats.length} categorías:`, cats);
  } catch (e) {
    console.error('❌ Error cargando bridas.csv:', e);
    alert('No se pudo cargar bridas.csv. Verifica la ruta.');
  }
}

// ============================================================================
// CARGA DE ARTICULOS
// ============================================================================
async function cargarArticulos() {
  try {
    const res = await fetch('../Pedidos desde obra/articulos.txt');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    lineasArticulos = text.split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l.length > 0)
      .map(l => l.split(';').map(c => c.replace(/^"|"$/g, '').trim()));
    console.log(`✓ ${lineasArticulos.length} líneas cargadas desde ../Pedidos desde obra/articulos.txt`);
  } catch (e) {
    console.error('❌ Error cargando articulos.txt:', e);
  }
}

// ============================================================================
// INICIALIZACIÓN
// ============================================================================
async function init() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('formulario').style.display = 'none';

  await Promise.all([cargarBridas(), cargarArticulos()]);

  if (DATA.length === 0) {
    document.getElementById('loadingMsg').innerHTML = '❌ No se pudieron cargar los datos de bridas';
    return;
  }

  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('formulario').style.display = 'block';
  initCategories();
}

function initCategories() {
  const categories = [...new Set(DATA.map(item => item[0]))].filter(Boolean).sort();
  catSelect.innerHTML = '<option value="">-- Selecciona Categoría --</option>';
  categories.forEach(cat => {
    catSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
}

function updateImage(cat) {
  if (!cat) {
    imgBox.innerHTML = '<span class="img-placeholder">Selecciona una categoria para ver su esquema</span>';
    return;
  }
  // Las imágenes están en consulta/img/ y en minúscula
  const imgPath = `img/${cat.toLowerCase()}.png`;
  imgBox.innerHTML = `<img src="${imgPath}" alt="Esquema ${cat}" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\\'img-placeholder\\'>Imagen no encontrada: ${imgPath}</span>';">`;
}

// ============================================================================
// EVENTOS EN CASCADA
// ============================================================================
catSelect.addEventListener('change', function() {
  const cat = this.value;
  updateImage(cat);

  dnSelect.innerHTML = '<option value="">-- Selecciona DN --</option>';
  pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';
  normaSelect.innerHTML = '<option value="">-- Selecciona Norma --</option>';

  normaSelect.disabled = !cat;
  dnSelect.disabled = true;
  pnSelect.disabled = true;
  resultsDiv.innerHTML = '';

  if (cat) {
    const normas = [...new Set(DATA.filter(item => item[0] === cat).map(item => item[12]))]
      .filter(Boolean);
    ordenarNormas(normas).forEach(n => {
      normaSelect.innerHTML += `<option value="${n}">${n}</option>`;
    });
  }
});

normaSelect.addEventListener('change', function() {
  const cat = catSelect.value;
  const norma = this.value;

  dnSelect.innerHTML = '<option value="">-- Selecciona DN --</option>';
  pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';

  dnSelect.disabled = !norma;
  pnSelect.disabled = true;
  resultsDiv.innerHTML = '';

  if (norma) {
    const dns = [...new Set(DATA.filter(item => item[0] === cat && item[12] === norma).map(item => item[1]))]
      .filter(Boolean);
    dns.forEach(dn => {
      dnSelect.innerHTML += `<option value="${dn}">${dn}</option>`;
    });
  }
});

dnSelect.addEventListener('change', function() {
  const cat = catSelect.value;
  const norma = normaSelect.value;
  const dn = this.value;

  pnSelect.innerHTML = '<option value="">-- Selecciona PN --</option>';
  pnSelect.disabled = !dn;
  resultsDiv.innerHTML = '';

  if (dn) {
    const pns = [...new Set(DATA.filter(item => item[0] === cat && item[12] === norma && item[1] === dn).map(item => item[2]))]
      .filter(Boolean);
    pns.forEach(pn => {
      pnSelect.innerHTML += `<option value="${pn}">${pn}</option>`;
    });
  }
});

pnSelect.addEventListener('change', renderResults);

// ============================================================================
// RENDERIZADO DE RESULTADOS
// ============================================================================
function renderResults() {
  const cat = catSelect.value;
  const norma = normaSelect.value;
  const dn = dnSelect.value;
  const pn = pnSelect.value;

  if (!cat || !norma || !dn || !pn) {
    resultsDiv.innerHTML = '';
    return;
  }

  const matches = DATA.filter(item =>
    item[0] === cat && item[12] === norma && item[1] === dn && item[2] === pn
  );

  if (matches.length === 0) {
    resultsDiv.innerHTML = '<div class="no-results">No se encontraron datos para la combinacion seleccionada.</div>';
    return;
  }

  let html = '';
  matches.forEach(m => {
    // Descripción: último campo no vacío
    let descripcion = '';
    for (let i = m.length - 1; i >= 0; i--) {
      if (m[i] && m[i].trim() !== '') { descripcion = m[i]; break; }
    }

    html += `
      <div class="card-result">
        <div class="card-title">${descripcion}</div>
        <table class="data-table">
          <tr><th>Categoría</th><td>${m[0]}</td></tr>
          <tr><th>Norma Principal</th><td>${m[12]}</td></tr>
          ${m[11] ? `<tr><th>Norma compatible</th><td>${m[11]}</td></tr>` : ''}
          <tr><th>Diametro Nominal (DN)</th><td>${m[1]}</td></tr>
          <tr><th>Presion (PN / Lbs)</th><td>${m[2]}</td></tr>
          ${m[3] ? `<tr><th>Otros (mm)</th><td>${m[3]}</td></tr>` : ''}
          ${m[4] ? `<tr><th>Diametro Exterior (mm)</th><td>${m[4]}</td></tr>` : ''}
          ${m[5] ? `<tr><th>Diametro Interior (mm)</th><td>${m[5]}</td></tr>` : ''}
          ${m[6] ? `<tr><th>Espesor plato (mm)</th><td>${m[6]}</td></tr>` : ''}
          ${m[7] ? `<tr><th>Altura Cuello(mm)</th><td>${m[7]}</td></tr>` : ''}
          ${m[8] ? `<tr><th>Numero de Taladros</th><td>${m[8]}</td></tr>` : ''}
          ${m[9] ? `<tr><th>Diametro Taladro</th><td>${m[9]}</td></tr>` : ''}
          ${m[10] ? `<tr><th>Distancia entre Taladros (k) (mm)</th><td>${m[10]}</td></tr>` : ''}
        </table>
      </div>
    `;
  });

  html += `
    <div style="text-align:center; margin-top:18px;">
      <button type="button" id="btnTornilleria" style="
        background:#0284c7; color:#fff; border:none;
        padding:14px 24px; font-size:15px; font-weight:600;
        border-radius:8px; cursor:pointer; width:100%;
        box-shadow:0 2px 6px rgba(2,132,199,0.3);
      ">🔩 Calcular tornillería para esta brida</button>
    </div>
  `;

  resultsDiv.innerHTML = html;
}

// ============================================================================
// MÓDULO TORNILLERÍA
// ============================================================================
function iframePedidosListo() {
  iframeListo = true;
  console.log('✓ iframe Pedidos cargado');
}

function normalizar(s) {
  return String(s == null ? '' : s).trim().toUpperCase();
}

function diametroTornilloDesdeTaladro(taladro) {
  const t = parseFloat(String(taladro).replace(',', '.'));
  const tabla = [
    [11, 10], [12, 10], [13.5, 12], [14, 12], [16, 14],
    [18, 16], [20, 16], [22, 20], [24, 20], [26, 24],
    [28, 24], [30, 27], [33, 30], [36, 33], [39, 36],
    [42, 39], [45, 42], [48, 45], [52, 48], [56, 52]
  ];
  for (const [d, m] of tabla) {
    if (Math.abs(t - d) < 0.6) return m;
  }
  return Math.round(t * 0.9);
}

function alturaTuercaDIN934(metrico) {
  const tabla = {
    4:3.2, 5:4, 6:5, 8:6.5, 10:8, 12:10, 14:11, 16:13,
    18:15, 20:16, 22:18, 24:19, 27:22, 30:24, 33:26,
    36:29, 39:31, 42:34, 45:36, 48:38, 52:42
  };
  return tabla[metrico] || 13;
}

function calcularLongitudTornillo(espesorPlaca, metrico) {
  const C = parseFloat(String(espesorPlaca).replace(',', '.')) || 0;
  const G = 4.5;
  const hTuerca = alturaTuercaDIN934(metrico);
  const P = 3;
  let L = 2 * C + G + 2 * hTuerca + P;
  return Math.ceil(L / 5) * 5;
}

function extraerReferencia(campos) {
  for (let i = campos.length - 1; i >= 0; i--) {
    const c = normalizar(campos[i]);
    if (c && c !== 'SEGUIR' && c !== '-') return campos[i].trim();
  }
  return null;
}

function buscarArticuloPorTokens(tokens, categoriaEsperada) {
  const tokensUpper = tokens.map(t => normalizar(t));
  const catUpper = normalizar(categoriaEsperada);

  for (const linea of lineasArticulos) {
    if (!linea || linea.length === 0) continue;

    const cat = normalizar(linea[0]);
    if (cat !== catUpper) continue;

    const camposBusqueda = linea.slice(0, -1).map(c => normalizar(c));

    const todosPresentes = tokensUpper.every(tok =>
      camposBusqueda.some(campo => campo === tok || campo.includes(tok))
    );

    if (todosPresentes) {
      const ref = extraerReferencia(linea);
      return { campos: linea, ref };
    }
  }
  return null;
}

function buscarTornillo(metrico, longitud, material) {
  const tokens = [`${metrico}X${longitud}`, material];
  return buscarArticuloPorTokens(tokens, 'TORNILLOS');
}

function buscarTuerca(metrico, material) {
  const tokens = [`M${metrico}`, material];
  return buscarArticuloPorTokens(tokens, 'TUERCAS');
}

document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'btnTornilleria') {
    abrirModalTornilleria();
  }
});

function abrirModalTornilleria() {
  const cat = catSelect.value;
  const norma = normaSelect.value;
  const dn = dnSelect.value;
  const pn = pnSelect.value;
  if (!cat || !norma || !dn || !pn) { alert('Selecciona una brida primero.'); return; }

  const fila = DATA.find(item =>
    item[0] === cat && item[12] === norma && item[1] === dn && item[2] === pn
  );
  if (!fila) { alert('No se encontró la brida.'); return; }

  const espesor = fila[6];
  const nTaladros = parseInt(fila[8]) || 0;
  const diamTaladro = fila[9];

  if (!nTaladros || !diamTaladro) {
    alert('Esta brida no tiene datos de taladros para calcular tornillería.');
    return;
  }

  const metrico = diametroTornilloDesdeTaladro(diamTaladro);
  const longitud = calcularLongitudTornillo(espesor, metrico);

  const modal = document.createElement('div');
  modal.id = 'modalTornilleria';
  modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:10000;`;
  modal.innerHTML = `
    <div style="background:#fff; border-radius:12px; padding:26px 28px; max-width:440px; width:92%; box-shadow:0 10px 40px rgba(0,0,0,0.3); max-height:90vh; overflow-y:auto;">
      <h3 style="margin:0 0 6px 0; color:#0284c7;">🔩 Cálculo de tornillería</h3>
      <p style="margin:0 0 18px 0; color:#64748b; font-size:0.9rem;">
        Brida: <strong>${dn} ${pn}</strong> ·
        Taladros: <strong>${nTaladros}×Ø${diamTaladro}mm</strong> ·
        Tornillo calculado: <strong>M${metrico}×${longitud}</strong>
      </p>

      <label style="display:block; font-weight:600; margin-bottom:6px;">1. ¿Cuántas uniones vas a montar?</label>
      <div style="display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;">
        <button type="button" class="union-btn" data-u="1" style="flex:1; min-width:50px; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">1</button>
        <button type="button" class="union-btn" data-u="2" style="flex:1; min-width:50px; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">2</button>
        <button type="button" class="union-btn" data-u="3" style="flex:1; min-width:50px; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">3</button>
        <button type="button" class="union-btn" data-u="4" style="flex:1; min-width:50px; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">4</button>
        <button type="button" class="union-btn" data-u="otro" style="flex:1; min-width:50px; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">Otro</button>
      </div>
      <input type="number" id="unionesManual" min="1" placeholder="Introduce número de uniones"
             style="display:none; width:100%; padding:10px; margin-bottom:14px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">

      <label style="display:block; font-weight:600; margin-bottom:6px;">2. Material</label>
      <div style="display:flex; gap:6px; margin-bottom:18px;">
        <button type="button" class="mat-btn" data-m="ZINC" style="flex:1; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">ZINC</button>
        <button type="button" class="mat-btn" data-m="304" style="flex:1; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">304</button>
        <button type="button" class="mat-btn" data-m="316" style="flex:1; padding:10px; border:2px solid #cbd5e1; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">316</button>
      </div>

      <div id="resumenTornilleria" style="display:none; background:#f1f5f9; padding:12px; border-radius:6px; margin-bottom:14px; font-size:0.9rem; line-height:1.6;"></div>

      <div style="display:flex; gap:10px;">
        <button type="button" id="btnCancelarTorn" style="flex:1; padding:12px; background:#64748b; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Cancelar</button>
        <button type="button" id="btnConfirmarTorn" style="flex:2; padding:12px; background:#0284c7; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;" disabled>Añadir a la lista</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  let uniones = null;
  let material = null;

  const btnConfirmar = modal.querySelector('#btnConfirmarTorn');
  const resumenDiv = modal.querySelector('#resumenTornilleria');
  const unionesManualInput = modal.querySelector('#unionesManual');

  function actualizarResumen() {
    if (uniones && material) {
      const nTornillos = uniones * nTaladros;
      const torn = buscarTornillo(metrico, longitud, material);
      const tuerca = buscarTuerca(metrico, material);

      resumenDiv.innerHTML = `
        <strong>Se añadirán:</strong><br>
        · <strong>${nTornillos}</strong> × TORNILLO HEXAGONAL DIN931 ${metrico}X${longitud} ${material}
        ${torn ? `<span style="color:#16a34a;"> ✓ REF ${torn.ref}</span>` : ' <span style="color:#dc2626;">(no en base — solo descripción)</span>'}<br>
        · <strong>${nTornillos}</strong> × TUERCA DIN934 M${metrico} ${material}
        ${tuerca ? `<span style="color:#16a34a;"> ✓ REF ${tuerca.ref}</span>` : ' <span style="color:#dc2626;">(no en base — solo descripción)</span>'}
      `;
      resumenDiv.style.display = 'block';
      btnConfirmar.disabled = false;
    }
  }

  modal.querySelectorAll('.union-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      modal.querySelectorAll('.union-btn').forEach(b => {
        b.style.background = '#fff';
        b.style.borderColor = '#cbd5e1';
        b.style.color = '#0f172a';
      });
      btn.style.background = '#0284c7';
      btn.style.borderColor = '#0284c7';
      btn.style.color = '#fff';

      if (btn.dataset.u === 'otro') {
        unionesManualInput.style.display = 'block';
        unionesManualInput.focus();
        uniones = null;
      } else {
        unionesManualInput.style.display = 'none';
        uniones = parseInt(btn.dataset.u);
      }
      actualizarResumen();
    });
  });

  unionesManualInput.addEventListener('input', () => {
    const v = parseInt(unionesManualInput.value);
    uniones = (v > 0) ? v : null;
    actualizarResumen();
  });

  modal.querySelectorAll('.mat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      modal.querySelectorAll('.mat-btn').forEach(b => {
        b.style.background = '#fff';
        b.style.borderColor = '#cbd5e1';
        b.style.color = '#0f172a';
      });
      btn.style.background = '#0284c7';
      btn.style.borderColor = '#0284c7';
      btn.style.color = '#fff';
      material = btn.dataset.m;
      actualizarResumen();
    });
  });

  modal.querySelector('#btnCancelarTorn').addEventListener('click', () => modal.remove());

  btnConfirmar.addEventListener('click', async () => {
    if (!uniones || !material) return;

    const nTornillos = uniones * nTaladros;
    const torn = buscarTornillo(metrico, longitud, material);
    const tuerca = buscarTuerca(metrico, material);

    const detalleTorn = torn
      ? `TORNILLO HEXAGONAL DIN931 ${metrico}X${longitud} ${material}`
      : `⚠️ NO EN BASE - TORNILLO HEXAGONAL DIN931 ${metrico}X${longitud} ${material}`;

    const detalleTuerca = tuerca
      ? `TUERCA DIN934 M${metrico} ${material}`
      : `⚠️ NO EN BASE - TUERCA DIN934 M${metrico} ${material}`;

    const lineas = [
      { referencia: torn ? torn.ref : null, detalle_linea: detalleTorn, cantidad: nTornillos },
      { referencia: tuerca ? tuerca.ref : null, detalle_linea: detalleTuerca, cantidad: nTornillos }
    ];

    let operario = localStorage.getItem('operarioNombre') || '';
    let obra = localStorage.getItem('operarioObra') || '';

    if (!operario) {
      operario = prompt('Tu nombre (operario):', '');
      if (!operario) return;
      operario = operario.trim();
      localStorage.setItem('operarioNombre', operario);
    }
    if (!obra) {
      obra = prompt('Nº de OT:', '');
      if (!obra) return;
      obra = obra.trim();
      localStorage.setItem('operarioObra', obra);
    }

    if (!iframeListo) {
      alert('La base de pedidos aún no está lista. Espera 2 segundos y reintenta.');
      return;
    }

    document.getElementById('pedidosIframe').contentWindow.postMessage({
      type: 'INSERT_LINEAS',
      operario: operario,
      obra: obra,
      lineas: lineas
    }, '*');

    modal.remove();

    setTimeout(() => {
      mostrarModalJuntas(operario, obra, nTornillos);
    }, 300);
  });
}

function mostrarModalJuntas(operario, obra, nTornillos) {
  const modal = document.createElement('div');
  modal.id = 'modalJuntas';
  modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:10001;`;
  modal.innerHTML = `
    <div style="background:#fff; border-radius:12px; padding:26px 28px; max-width:420px; width:92%; box-shadow:0 10px 40px rgba(0,0,0,0.3); text-align:center;">
      <div style="font-size:42px; margin-bottom:6px;">✅</div>
      <h3 style="margin:0 0 10px 0; color:#16a34a;">Añadido a la lista</h3>
      <p style="color:#475569; margin:0 0 20px 0;">
        Se han añadido <strong>${nTornillos} tuercas</strong> y <strong>${nTornillos} tornillos</strong> a la OT <strong>${obra}</strong>.
      </p>
      <p style="color:#0f172a; font-weight:600; margin:0 0 16px 0;">¿Quieres ver las juntas compatibles?</p>
      <div style="display:flex; gap:10px;">
        <button type="button" id="btnNoJuntas" style="flex:1; padding:12px; background:#64748b; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">NO</button>
        <button type="button" id="btnSiJuntas" style="flex:1; padding:12px; background:#0284c7; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">SÍ, ver juntas</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  modal.querySelector('#btnNoJuntas').addEventListener('click', () => modal.remove());

  modal.querySelector('#btnSiJuntas').addEventListener('click', () => {
    modal.remove();
    const url = `../Pedidos desde obra/index.html?buscar=junta&operario=${encodeURIComponent(operario)}&obra=${encodeURIComponent(obra)}`;
    window.location.href = url;
  });
}
