<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción de Trabajos - MEN</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        /* ============ ESTILOS BASE ============ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #eef0f2; color: #222; padding: 16px 11px 40px; }

        /* ============ CONTENEDOR PRINCIPAL ÚNICO ============ */
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            border-radius: 7px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.08);
            padding: 16px 19px 21px;
        }

        /* ============ CABECERA UNIFICADA (LA ÚNICA BARRA NEGRA) ============ */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #17212b;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .brand-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e5fa8;
            background: #fff;
            padding: 2px 7px;
            border-radius: 4px;
        }
        .brand-sub {
            font-size: 13px;
            color: #d9e1e7;
            font-weight: 600;
        }
        .brand-author {
            font-size: 11px;
            color: #89949e;
        }
        .header-right h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: #e8f0fa;
            background: transparent;
            padding: 0;
            text-align: right;
            line-height: 1.2;
        }

        /* ============ RESTO DE ESTILOS ============ */
        .actions-top { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
        button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; transition: background 0.2s; -webkit-tap-highlight-color: transparent; }

        .btn-add { background-color: #2563eb; color: white; flex: 2; }
        .btn-add:active { background-color: #1d4ed8; }

        .btn-view { background-color: #64748b; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; padding: 8px; flex: 1.2; }
        .btn-view:active { background-color: #475569; }

        .btn-send { background-color: #22c55e; color: white; flex: 1.8; }
        .btn-send:active { background-color: #16a34a; }

        .table-wrapper { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 4px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 375px; table-layout: fixed; }
        th { background-color: #f8fafc; color: #64748b; font-size: 9px; text-transform: uppercase; padding: 6px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        td { padding: 4px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        table input { width: 100%; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 3px; font-size: 10px; outline: none; box-sizing: border-box; }
        table input:focus { border-color: #2563eb; background-color: #f8fafc; }

        /* ====== ANCHOS DE COLUMNAS ====== */
        .col-fecha      { width: 95px; }
        .col-operario   { width: 85px; }
        .col-ot         { width: 55px; }
        .col-desc       { width: auto; }
        .col-horas      { width: 55px; }
        .col-accion     { width: 30px; text-align: center; }

        .btn-delete { background-color: #ef4444; color: white; padding: 4px; border-radius: 3px; width: 22px; height: 22px; font-size: 10px; }
        .btn-delete:hover { background-color: #dc2626; }

        /* ============ BOTÓN VOLVER ============ */
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #ecf0f1;
            color: #34495e;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: Arial, sans-serif;
        }
        .btn-volver:hover {
            background-color: #e0e6ed;
            border-color: #95a5a6;
            color: #2c3e50;
        }
        .btn-volver:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- BARRA OSCURA UNIFICADA -->
    <div class="header-top">
        <div class="header-left">
            <span class="brand-title">MEN</span>
            <span class="brand-sub">Montajes Industriales S. L.</span>
            <span class="brand-author">Creado por: J.N.G</span>
        </div>
        <div class="header-right">
            <h1>Introducción<br>de Trabajos</h1>
        </div>
    </div>

    <!-- CONTENIDO -->
    <a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>

    <div class="actions-top">
        <button class="btn-add" onclick="agregarLinea()">➕ Añadir Línea</button>
        <button class="btn-view" onclick="accederAlHistorico()">📊 Ver lista (Admin)</button>
        <button class="btn-send" onclick="enviarDatos()">📥 Enviar Datos</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th class="col-fecha">Fecha</th>
                    <th class="col-operario">Operario</th>
                    <th class="col-ot">OT</th>
                    <th class="col-desc">Descripción</th>
                    <th class="col-horas">Horas</th>
                    <th class="col-accion"></th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://qjyyvobhzybugiqlmdyp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqeXl2b2JoenlidWdpcWxtZHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTg4NzksImV4cCI6MjEwMzkzNDg3OX0.Q4o304kJyQZmY3kkk-WwawpOMMj3f8a7Vg54iO9FEg0";

    let supabaseClient = null;

    function obtenerFechaActual() {
        const hoy = new Date();
        const year = hoy.getFullYear();
        const month = String(hoy.getMonth() + 1).padStart(2, '0');
        const day = String(hoy.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function agregarLinea() {
        const tbody = document.getElementById('tabla-cuerpo');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="date" class="input-fecha" value="${obtenerFechaActual()}"></td>
            <td><input type="text" class="input-operario" placeholder="Nombre"></td>
            <td><input type="text" class="input-ot" placeholder="Nº OT"></td>
            <td><input type="text" class="input-desc" placeholder="Detalles"></td>
            <td><input type="number" class="input-horas" placeholder="0.0" step="0.5" min="0"></td>
            <td><button class="btn-delete" onclick="eliminarLinea(this)">🗑️</button></td>
        `;
        tbody.appendChild(tr);
    }

    function eliminarLinea(boton) {
        if (confirm("¿Estás seguro de que deseas eliminar esta línea?")) {
            boton.closest('tr').remove();
        }
    }

    async function enviarDatos() {
        if (!supabaseClient) {
            alert("Error técnico: No se ha podido establecer la conexión con Supabase. Revisa la consola.");
            return;
        }

        const filas = document.querySelectorAll('#tabla-cuerpo tr');
        if (filas.length === 0) {
            alert("No hay líneas para enviar.");
            return;
        }

        let nuevosRegistros = [];

        for (let i = 0; i < filas.length; i++) {
            const fila = filas[i];
            const inputFecha = fila.querySelector('.input-fecha');
            const inputOperario = fila.querySelector('.input-operario');
            const inputOt = fila.querySelector('.input-ot');
            const inputDesc = fila.querySelector('.input-desc');
            const inputHoras = fila.querySelector('.input-horas');

            const fechaOriginal = inputFecha ? inputFecha.value : "";
            let fechaFormateada = "No asignada";

            if (fechaOriginal) {
                const partes = fechaOriginal.split("-");
                if (partes.length === 3) {
                    fechaFormateada = `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }

            const registro = {
                fecha: fechaFormateada,
                operario: inputOperario ? inputOperario.value.trim() : "No asignado",
                ot: inputOt ? inputOt.value.trim() : "No asignada",
                desc: inputDesc ? inputDesc.value.trim() : "Sin descripción",
                horas: inputHoras ? inputHoras.value.trim() : "0"
            };
            nuevosRegistros.push(registro);
        }

        try {
            const { data, error } = await supabaseClient
                .from('historico_trabajos')
                .insert(nuevosRegistros);

            if (error) throw error;

            alert("¡Datos guardados con éxito en el histórico de la nube!");
            document.getElementById('tabla-cuerpo').innerHTML = "";
            agregarLinea();
        } catch (err) {
            console.error("Error al insertar en Supabase:", err);
            alert("Error al intentar transmitir los registros:\n" + (err.message || "Permiso denegado por políticas RLS o fallo de red."));
        }
    }

    function accederAlHistorico() {
        const clave = prompt("Introduce la contraseña para ver el histórico:");
        if (clave === "2026men") {
            window.location.href = "historico.html";
        } else if (clave !== null) {
            alert("Contraseña incorrecta. Acceso denegado.");
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.error("No se pudo cargar la librería de Supabase.");
        }
        agregarLinea();
    });
</script>
</body>
</html>
