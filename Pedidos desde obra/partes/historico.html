<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico y Exportación</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
    body{background:#f4f6f9;color:#333;padding:8px}
    .header-logo{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:3px 5px}
    .logo-men{font-size:.75rem;font-weight:800;color:#2563eb;letter-spacing:1px}
    h1{font-size:.6rem;color:#1e293b;text-align:right}
    .container{max-width:600px;margin:0 auto;background:#fff;padding:8px;border-radius:6px;box-shadow:0 2px 3px rgba(0,0,0,.05)}

    /* ====== BARRA DE ACCIONES CON 3 BOTONES ====== */
    .actions-top{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
    button{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 8px;border:none;border-radius:4px;font-size:.48rem;font-weight:600;cursor:pointer;transition:background .2s}

    .btn-back{background:#64748b;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:6px 8px;border-radius:4px;font-size:.48rem;font-weight:600;flex:1.6}
    .btn-back:active{background:#475569}

    .btn-clear{background:#ef4444;color:#fff;font-size:.42rem;padding:6px 8px;flex:1}
    .btn-clear:active{background:#dc2626}

    .btn-excel{background:#16a34a;color:#fff;font-size:.48rem;padding:6px 8px;flex:1.6}
    .btn-excel:active{background:#15803d}

    .table-wrapper{width:100%;overflow-x:auto;border:1px solid #e2e8f0;border-radius:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;min-width:375px;table-layout:fixed}
    th{background:#f8fafc;color:#64748b;font-size:.42rem;text-transform:uppercase;padding:5px;text-align:left;border-bottom:1px solid #e2e8f0}
    td{padding:5px;border-bottom:1px solid #e2e8f0;vertical-align:middle;font-size:.48rem}

    /* ====== ANCHOS DE COLUMNAS ====== */
    .col-fecha      {width:85px}
    .col-operario   {width:75px}
    .col-ot         {width:45px}
    .col-desc       {width:auto}
    .col-horas      {width:45px}
    .col-accion     {width:25px;text-align:center}

    .btn-delete{background:#fee2e2;color:#ef4444;padding:3px;border-radius:3px;width:16px;height:16px;border:none;cursor:pointer;font-size:.5rem}

    .no-data{text-align:center;color:#94a3b8;padding:15px;font-style:italic;font-size:.48rem}

    @media(max-width:600px){
      body{padding:5px}
      .container{padding:5px}
      .header-logo{padding:3px}
      .logo-men{font-size:.7rem}
      h1{font-size:.52rem}
      .actions-top{flex-direction:column;align-items:stretch!important}
      .btn-back,.btn-clear,.btn-excel{width:100%;min-height:22px}
    }
      /* ============================================================
       ESTILO DEL BOTÓN VOLVER (Para calculadoras)
       ============================================================ */
    .btn-volver {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 20px; /* Separación con el contenido de abajo */
        padding: 8px 16px;
        background-color: #ecf0f1;
        color: #34495e;
        border: 1px solid #bdc3c7;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
        font-family: Arial, sans-serif;
    }

    .btn-volver:hover {
        background-color: #e0e6ed;
        border-color: #95a5a6;
        color: #2c3e50;
    }

    .btn-volver:active {
        transform: scale(0.98);
    }
</style>
</head>
<body>

<div class="container">
<a href="javascript:history.back()" class="btn-volver">⬅ Volver atrás</a>
  <div class="header-logo">
    <div class="logo-men">MEN</div>
    <h1>Lista</h1>
  </div>

  <div class="actions-top">
    <a href="index.html" class="btn-back">⬅️ Volver a Introducir</a>
    <button class="btn-excel" onclick="exportarExcel()">📊 Exportar a Excel</button>
    <button class="btn-clear" onclick="borrarTodoElHistorial()">⚠️ Vaciar Todo</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="col-fecha">Fecha</th>
          <th class="col-operario">Operario</th>
          <th class="col-ot">OT</th>
          <th class="col-desc">Descripción</th>
          <th class="col-horas">Horas</th>
          <th class="col-accion"></th>
        </tr>
      </thead>
      <tbody id="tabla-historico-cuerpo"></tbody>
    </table>
    <div id="mensaje-vacio" class="no-data" style="display:none">No hay registros guardados en la nube.</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://qjyyvobhzybugiqlmdyp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqeXl2b2JoenlidWdpcWxtZHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTg4NzksImV4cCI6MjEwMzkzNDg3OX0.Q4o304kJyQZmY3kkk-WwawpOMMj3f8a7Vg54iO9FEg0";

  let supabaseClient = null;
  let listaTrabajos = [];

  async function cargarHistorico() {
    if (!supabaseClient) return;

    const tbody = document.getElementById('tabla-historico-cuerpo');
    const mensajeVacio = document.getElementById('mensaje-vacio');

    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:10px;font-size:.48rem">Cargando registros...</td></tr>';

    try {
      const { data, error } = await supabaseClient
        .from('historico_trabajos')
        .select('*')
        .order('id', { ascending: false });

      if (error) throw error;

      listaTrabajos = data || [];
      tbody.innerHTML = "";

      if (listaTrabajos.length === 0) {
        mensajeVacio.style.display = "block";
        return;
      }

      mensajeVacio.style.display = "none";

      listaTrabajos.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.fecha || 'No asignada'}</strong></td>
          <td>${item.operario || ''}</td>
          <td><span style="background:#f1f5f9;padding:1px 3px;border-radius:2px;">${item.ot || ''}</span></td>
          <td>${item.desc || ''}</td>
          <td><strong>${item.horas || '0'} h</strong></td>
          <td><button class="btn-delete" onclick="eliminarFilaUnica(${item.id})">🗑️</button></td>
        `;
        tbody.appendChild(tr);
      });

    } catch (err) {
      tbody.innerHTML = "";
      console.error("Error detallado al cargar:", err);
      alert("Error al leer los datos de la nube: " + (err.message || err));
    }
  }

  async function eliminarFilaUnica(id) {
    if (!supabaseClient) return;
    if (confirm("¿Quieres eliminar este registro definitivamente?")) {
      try {
        const { error } = await supabaseClient
          .from('historico_trabajos')
          .delete()
          .eq('id', id);

        if (error) throw error;
        cargarHistorico();
      } catch (err) {
        alert("No se pudo eliminar el registro de la nube.");
        console.error(err);
      }
    }
  }

  async function borrarTodoElHistorial() {
    if (!supabaseClient) return;
    if (confirm("⚠️ ¿Se borrarán TODOS los partes guardados para siempre de la base de datos?")) {
      try {
        const { error } = await supabaseClient
          .from('historico_trabajos')
          .delete()
          .gt('id', 0);

        if (error) throw error;
        cargarHistorico();
      } catch (err) {
        alert("Error al vaciar el histórico de la nube.");
        console.error(err);
      }
    }
  }

  // ============================================================
  // EXPORTAR A EXCEL + COPIAR AL PORTAPAPELES
  // ============================================================
  async function exportarExcel() {
    if (listaTrabajos.length === 0) {
      alert("No hay datos para exportar.");
      return;
    }

    // ==== 1) Generar el archivo .xls ====
    let contenidoTabla = `<table border="1"><tr style="background-color:#16a34a;color:white;font-weight:bold;"><th>FECHA</th><th>OPERARIO</th><th>Nº OT</th><th>DESCRIPCION</th><th>HORAS TRABAJADAS</th></tr>`;

    listaTrabajos.forEach(item => {
      contenidoTabla += `<tr><td>${item.fecha||'No asignada'}</td><td>${item.operario||''}</td><td>${item.ot||''}</td><td>${item.desc||''}</td><td>${item.horas||''}</td></tr>`;
    });

    contenidoTabla += '</table>';

    const plantillaExcel = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://w3.org"><head><meta charset="UTF-8"></head><body>${contenidoTabla}</body></html>`;
    const blob = new Blob([plantillaExcel], { type: 'application/vnd.ms-excel' });
    const urlDescarga = URL.createObjectURL(blob);
    const hoy = new Date().toISOString().slice(0, 10);

    const enlaceTemporal = document.createElement('a');
    enlaceTemporal.href = urlDescarga;
    enlaceTemporal.download = `Reporte_Trabajos_${hoy}.xls`;
    document.body.appendChild(enlaceTemporal);
    enlaceTemporal.click();
    document.body.removeChild(enlaceTemporal);

    setTimeout(() => URL.revokeObjectURL(urlDescarga), 1000);

    // ==== 2) Generar texto tabulado (formato WhatsApp / correo) ====
    let texto = `*LISTA DE TRABAJOS - ${hoy}*\n\n`;
    listaTrabajos.forEach((item, i) => {
      texto += `${i + 1}. ${item.fecha||'No asignada'} | ${item.operario||'-'} | OT: ${item.ot||'-'} | ${item.desc||'-'} | ${item.horas||'0'} h\n`;
    });

    // ==== 3) Copiar al portapapeles ====
    let copiado = false;
    try {
      await navigator.clipboard.writeText(texto);
      copiado = true;
    } catch (err) {
      // Fallback para navegadores antiguos / sin permisos
      try {
        const ta = document.createElement('textarea');
        ta.value = texto;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copiado = true;
      } catch (e2) {
        console.warn("No se pudo copiar al portapapeles:", e2);
      }
    }

    // ==== 4) Aviso final al usuario ====
    if (copiado) {
      alert(`✅ Archivo Excel descargado.\n📋 Y la lista también se ha copiado al portapapeles (${listaTrabajos.length} registros).`);
    } else {
      alert(`✅ Archivo Excel descargado.\n⚠️ No se pudo copiar al portapapeles automáticamente.`);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (typeof supabase !== 'undefined' && supabase.createClient) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      cargarHistorico();
    } else {
      console.error("La librería de Supabase no se cargó correctamente desde la CDN.");
    }
  });
</script>

</body>
</html>
