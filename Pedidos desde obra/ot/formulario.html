<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de OT - MEN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============ ESTILOS BASE ============ */
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; padding: 16px 11px 40px; background-color: #eef0f2; color: #222; }

        /* ============ CONTENEDOR PRINCIPAL ÚNICO ============ */
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #fff;
            border-radius: 7px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.08);
            padding: 16px 19px 21px;
        }

        /* ============ CABECERA UNIFICADA (LA ÚNICA BARRA NEGRA) ============ */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #17212b;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }
        .brand-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e5fa8;
            background: #fff;
            padding: 2px 7px;
            border-radius: 4px;
        }
        .brand-sub {
            font-size: 13px;
            color: #d9e1e7;
            font-weight: 600;
        }
        .brand-author {
            font-size: 11px;
            color: #89949e;
        }
        .header-right h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: #e8f0fa;
            background: transparent;
            padding: 0;
            text-align: right;
            line-height: 1.2;
        }

        /* ============ RESTO DE ESTILOS ============ */
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 20px; font-size: 22px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 16px; -webkit-appearance: none;
        }
        textarea { resize: vertical; min-height: 80px; }

        .btn-submit {
            width: 100%; padding: 12px; background-color: #2ecc71; border: none;
            color: white; font-size: 16px; border-radius: 5px; cursor: pointer;
            font-weight: bold; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #27ae60; }

        /* ============ BOTÓN VOLVER ============ */
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #ecf0f1;
            color: #34495e;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: Arial, sans-serif;
        }
        .btn-volver:hover {
            background-color: #e0e6ed;
            border-color: #95a5a6;
            color: #2c3e50;
        }
        .btn-volver:active {
            transform: scale(0.98);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .container { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- BARRA OSCURA UNIFICADA -->
    <div class="header-top">
        <div class="header-left">
            <span class="brand-title">MEN</span>
            <span class="brand-sub">Montajes Industriales S. L.</span>
            <span class="brand-author">Creado por: J.N.G</span>
        </div>
        <div class="header-right">
            <h1>Nueva<br>Orden de Trabajo</h1>
        </div>
    </div>

    <!-- CONTENIDO -->
    <a href="javascript:history.back()" class="btn-volver">? Volver atrás</a>

    <form id="otForm" accept-charset="UTF-8">
        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
            <label for="ot">Número de OT:</label>
            <input type="text" id="ot" required placeholder="Ej: 15/25">
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" required placeholder="Detalles del trabajo..."></textarea>
        </div>
        <div class="form-group">
            <label for="cliente">Cliente:</label>
            <input type="text" id="cliente" required placeholder="Nombre del cliente">
        </div>
        <button type="submit" class="btn-submit">Pasar a lista</button>
    </form>
</div>

<script>
    // URL DE API REAL CORREGIDA
    const SUPABASE_URL = "https://qjyyvobhzybugiqlmdyp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqeXl2b2JoenlidWdpcWxtZHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTg4NzksImV4cCI6MjEwMzkzNDg3OX0.Q4o304kJyQZmY3kkk-WwawpOMMj3f8a7Vg54iO9FEg0";
    
    // Inicialización limpia de Supabase en el navegador
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = function() {
        const hoy = new Date();
        const yyyy = hoy.getFullYear();
        let mm = hoy.getMonth() + 1; 
        let dd = hoy.getDate();

        if (dd < 10) dd = '0' + dd;
        if (mm < 10) mm = '0' + mm;

        document.getElementById('fecha').value = yyyy + '-' + mm + '-' + dd;
    }

    document.getElementById('otForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const nuevaOT = {
            fecha: document.getElementById('fecha').value,
            ot: document.getElementById('ot').value.trim(),
            descripcion: document.getElementById('descripcion').value.trim(),
            cliente: document.getElementById('cliente').value.trim()
        };

        try {
            const { error } = await supabaseClient
                .from('ots')
                .insert([nuevaOT]);

            if (error) throw error;
            
            window.location.href = "index.html";
        } catch (err) {
            alert("Error crítico al guardar la información");
            console.error(err);
        }
    });
</script>
</body>
</html>
