<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Operarios</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    display: block !important;
  }
  .container {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    padding: 28px 32px 32px;
    width: 100%;
    max-width: 420px;
    margin: 24px auto 0;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    background: #111;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    margin: 0 0 22px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #c7ccd1;
    border-radius: 6px;
    margin-bottom: 14px;
    letter-spacing: 2px;
  }
  input:focus { outline: none; border-color: #4a90d9; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
  button:disabled { background: #94a3b8; cursor: wait; }
  .error {
    color: #c0392b;
    font-size: 13px;
    margin-bottom: 10px;
    min-height: 18px;
    text-align: center;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Acceso Operarios</h1>

  <label for="passInput">Contraseña</label>
  <input type="password" id="passInput" placeholder="Introduce tu contraseña" autofocus>
  <div class="error" id="errorMsg"></div>
  <button type="button" id="btnEntrar">Entrar</button>

  <div class="hint">Si no recuerdas tu contraseña, pregunta al administrador.</div>
</div>

<link rel="stylesheet" href="men-header.css">
<script src="men-header.js" data-autor="Creado por: J.N.G"></script>

<script>
// ============================================================
// CONFIG SUPABASE
// ============================================================
const SUPABASE_URL = 'https://qjyyvobhzybugiqlmdyp.supabase.co';
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqeXl2b2JoenlidWdpcWxtZHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNTg4NzksImV4cCI6MjEwMzkzNDg3OX0.Q4o304kJyQZmY3kkk-WwawpOMMj3f8a7Vg54iO9FEg0";

let _supabase = null;
try { _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
catch (e) { console.error("Error Supabase:", e); }

const passInput = document.getElementById('passInput');
const errorMsg  = document.getElementById('errorMsg');
const btnEntrar = document.getElementById('btnEntrar');

btnEntrar.addEventListener('click', validar);
passInput.addEventListener('keydown', e => { if (e.key === 'Enter') validar(); });

async function validar() {
  const pass = passInput.value.trim();
  errorMsg.textContent = '';

  if (!pass) {
    errorMsg.textContent = 'Introduce la contraseña.';
    return;
  }

  if (!_supabase) {
    errorMsg.textContent = 'Error de conexión. Revisa tu red.';
    return;
  }

  btnEntrar.disabled = true;
  btnEntrar.textContent = 'Comprobando...';

  // Intentar hasta 3 veces si falla por red
  let intentos = 0;
  let data = null;
  let ultimoError = null;

  while (intentos < 3 && !data) {
    intentos++;
    try {
      const r = await _supabase.rpc('validar_operario', { p_pass: pass });
      if (r.error) {
        ultimoError = r.error;
        // Si el error es de red, esperar y reintentar
        if (String(r.error.message || '').includes('fetch')) {
          await new Promise(res => setTimeout(res, 500 * intentos));
          continue;
        } else {
          // Error real de la RPC (no de red)
          break;
        }
      }
      data = r.data;
      break;
    } catch (e) {
      ultimoError = e;
      await new Promise(res => setTimeout(res, 500 * intentos));
    }
  }

  btnEntrar.disabled = false;
  btnEntrar.textContent = 'Entrar';

  if (ultimoError && !data) {
    console.error('Error tras reintentos:', ultimoError);
    errorMsg.textContent = 'Error de conexión. Inténtalo de nuevo.';
    return;
  }

  // data es unarray con una fila { nombre, es_admin } o vacío
  if (data && data.length > 0) {
    const { nombre, es_admin } = data[0];

    try {
      sessionStorage.setItem('operario', nombre);
      if (es_admin) {
        sessionStorage.setItem('admin', '1');
        window.location.href = 'lista.html';
      } else {
        sessionStorage.removeItem('admin');
        window.location.href = 'panel.html';
      }
    } catch (e) {
      if (es_admin) {
        window.location.href = 'lista.html?admin=1';
      } else {
        window.location.href = 'panel.html?op=' + encodeURIComponent(nombre);
      }
    }
  } else {
    errorMsg.textContent = 'Contraseña incorrecta.';
    passInput.value = '';
    passInput.focus();
    passInput.style.borderColor = '#e74c3c';
    setTimeout(() => { passInput.style.borderColor = '#c7ccd1'; }, 500);
  }
}
</script>
</body>
</html>
