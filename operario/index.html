<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Operarios</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    display: block !important;
  }
  .container {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    padding: 28px 32px 32px;
    width: 100%;
    max-width: 420px;
    margin: 24px auto 0;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    background: #111;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    margin: 0 0 22px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #c7ccd1;
    border-radius: 6px;
    margin-bottom: 14px;
    letter-spacing: 2px;
  }
  input:focus {
    outline: none;
    border-color: #4a90d9;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
  .error {
    color: #c0392b;
    font-size: 13px;
    margin-bottom: 10px;
    min-height: 18px;
    text-align: center;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Acceso Operarios</h1>

  <label for="passInput">Contraseña</label>
  <input type="password" id="passInput" placeholder="Introduce tu contraseña" autofocus>
  <div class="error" id="errorMsg"></div>
  <button type="button" id="btnEntrar">Entrar</button>

  <div class="hint">Si no recuerdas tu contraseña, pregunta al administrador.</div>
</div>

<link rel="stylesheet" href="men-header.css">
<script src="men-header.js" data-autor="Creado por: J.N.G"></script>

<script>
// ============================================================
// OPERARIOS Y CONTRASEÑAS
// Edita aquí: "Nombre visible": "contraseña"
// ============================================================
const OPERARIOS = {
  "Arturo":   "5248",
  "Heribert": "4282",
  "Juanma":   "3249",
  "Manolo":   "9244",
  "Nahum":    "6724",
  "Paco":     "5862",
  "Rabal":    "6565",
  "Ricardo":  "7435"
};

// Contraseña maestra → lleva a la LISTA de operarios
const PASS_MAESTRA = "2026men";

const passInput = document.getElementById('passInput');
const errorMsg  = document.getElementById('errorMsg');
const btnEntrar = document.getElementById('btnEntrar');

btnEntrar.addEventListener('click', validar);
passInput.addEventListener('keydown', e => { if (e.key === 'Enter') validar(); });

function validar() {
  const pass = passInput.value.trim();
  if (!pass) {
    errorMsg.textContent = 'Introduce la contraseña.';
    return;
  }

  // 1) MAESTRA → lista de operarios
  if (pass === PASS_MAESTRA) {
    try {
      sessionStorage.setItem('admin', '1');
      sessionStorage.removeItem('operario');
      window.location.href = 'lista.html';
    } catch (e) {
      window.location.href = 'lista.html?admin=1';
    }
    return;
  }

  // 2) Contraseña de algún operario → panel directo de ese operario
  const encontrado = Object.keys(OPERARIOS).find(nombre => OPERARIOS[nombre] === pass);

  if (encontrado) {
    try {
      sessionStorage.setItem('operario', encontrado);
      sessionStorage.removeItem('admin');
      window.location.href = 'panel.html';
    } catch (e) {
      window.location.href = 'panel.html?op=' + encodeURIComponent(encontrado);
    }
    return;
  }

  // 3) Contraseña incorrecta
  errorMsg.textContent = 'Contraseña incorrecta.';
  passInput.value = '';
  passInput.focus();
}
</script>
</body>
</html>
